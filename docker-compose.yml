services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lbs-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_API_KEY: ${SERVER_API_KEY}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@letsblog.example.com}
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL:-http://localhost:3000}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      COMFYUI_BASE_URL: http://comfyui:8188
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-v1-5-pruned-emaonly.safetensors}
      PLANTUML_BASE_URL: http://plantuml:8080
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - lbs-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lbs-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - lbs-net

  mysql:
    image: mysql:8.0
    container_name: lbs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lbs-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lbs-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - lbs-net

  ollama:
    image: ollama/ollama:latest
    container_name: lbs-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - lbs-net

  comfyui:
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu130-slim}
    container_name: lbs-comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - comfyui_models:/root/ComfyUI/models
      - comfyui_output:/root/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - lbs-net

  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: lbs-plantuml
    restart: unless-stopped
    ports:
      - "8085:8080"
    networks:
      - lbs-net

networks:
  lbs-net:
    driver: bridge

volumes:
  mysql_data:
  ollama_models:
  comfyui_models:
  comfyui_output:
