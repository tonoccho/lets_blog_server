# サービス定義のテンプレート化(#556)。共通のrestart/networks、Spring Bootサービス共通の
# actuatorヘルスチェック、RabbitMQ接続情報を各サービス定義から参照する。
# 新しいサービス(gateway/Keycloak/各ドメインサービス等)を追加する際もこれらを再利用する。
# ポート割当は内部8080に統一し(docs/DOCKER_COMPOSE_ARCHITECTURE.md参照)、外部公開は
# reverse-proxy(nginx)経由のみとする。
# 全サービスのjson-fileログにサイズ上限を付ける(#1247)。
# Dockerの既定json-fileは無制限で、1サービスの暴走(2026-09-10のlog-writerは約352GB)が
# ホストのディスクを埋める。各サービスは `logging: *default-logging` で参照する。
# 新しいサービスを足すときも必ず付けること(scripts/test_compose_log_rotation.py が検査する)。
# 1コンテナあたりの上限は max-size x max-file = 250MB。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# 全サービスに mem_limit を付ける(#1739)。上限が無いと JVM はホストメモリの1/4を最大ヒープに取り、
# 負荷時に G1 がヒープを手放さず膨らむ。Spring Boot 10サービスは JAVA_TOOL_OPTIONS の -Xmx を明示し、
# mem_limit との差を非ヒープ(メタスペース・スレッド・ダイレクトバッファ、content/media は Chromium)の
# 余裕にする。値と根拠(アイドル・負荷時の実測)は docs/DOCKER_COMPOSE_ARCHITECTURE.md「全コンテナのメモリ上限」。
# deploy.resources.limits ではなく mem_limit を使う(media の既存方式、#1112)。
# 新しいサービスを足すときも必ず付けること(scripts/test_compose_memory_limits.py が検査する)。
x-common-service: &common-service
  # restartを個別に上書きする場合は、ダッシュボードのコンテナ状態判定
  # (services/platform/.../ContainerStatusService、issue #725)に影響する点に注意。
  # 判定は「終了コード0 かつ 再起動ポリシーno」を『正常に完了したワンショットジョブ』と見なす。
  # 常駐サービスでこのアンカーを付け忘れるとポリシーがDocker既定のnoになり、正常停止が
  # 「正常」と表示されて停止に気付けなくなる。
  restart: unless-stopped
  networks:
    - lbs-net

# 猶予 = start_period + interval × retries = 120 + 10×5 = 170 秒(#1757)。
# リリース検証ログの実測で起動は最長約 75 秒(content, 2026-10-11)。ゼロ構築の同時起動は
# CPU の取り合いで遅れるため 2 倍強の余裕を取る。start_period 中の失敗は retries に数えられず、
# healthy になれば即 healthy なので、正常時の起動は遅くならない。
# 下限は scripts/test_compose_actuator_healthcheck_grace.py が検査する。
x-actuator-healthcheck: &actuator-healthcheck
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 120s

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

services:
  reverse-proxy:
    environment:
      TZ: UTC
    logging: *default-logging
    image: nginx:alpine
    container_name: lbs-reverse-proxy
    mem_limit: 128m
    <<: *common-service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    # E2E(#588)は https://localhost(=このreverse-proxy)へ直接アクセスするため、
    # 「スタック全体がhealthy」を機械的に判定できるようヘルスチェックを持たせる。
    # nginx:alpineにcurlは無いためbusybox wgetを使い、自己署名証明書のHTTPSではなく
    # 80番のヘルス用location(infra/nginx/conf.d/default.confの/nginx-health)を叩く。
    #
    # issue #1038: /nginx-health だけでは足りない。ホストの80/443を他プロセスが占有していると
    # Dockerはネットワーク接続時のポート公開に失敗し、コンテナは**どのネットワークにも
    # 所属しないまま running になる**(実測: NetworkSettings.Networks が {}、コンテナ内は
    # loopback のみ、web:3000 も gateway:8080 も `bad address`)。ところが /nginx-health は
    # 自分のnetns内の127.0.0.1を叩くだけなので、この状態でも 200 を返し healthy と
    # 報告され続ける。何も中継できないのに「正常」と見える、最も質の悪い壊れ方だった。
    #
    # そこで上流への到達性を条件に加える。busybox nc の -z はTCP接続だけを見るため、
    # web(Next.js)のコンパイル中でも、gatewayが5xxを返していても落ちない。孤立時のみ
    # 名前解決に失敗して落ちる。web と gateway の**どちらか**が届けばよいことにして、
    # 片方の再起動でreverse-proxyがunhealthyへ倒れる無用な連鎖を避ける。
    #
    # start_period は上流のTCP待ち受け開始を待てる長さにする(webは既定で本番ビルドの
    # `next start` で、起動後すぐ3000番をlistenする。開発モードの`next dev`も初回コンパイル前に
    # 3000番をlistenするので、いずれもここで待つのはコンパイルではなく起動)。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:80/nginx-health
          && { nc -z -w 3 web 3000 || nc -z -w 3 gateway 8080; }
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    logging: *default-logging
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: lbs-web
    mem_limit: 2g
    <<: *common-service
    environment:
      TZ: UTC
      # Web(BFF)からバックエンドへの全リクエストはgateway経由に一本化する(issue #584)。
      # ルーティング/JWT検証/レート制限/相関IDはgatewayが担う。issue #583でlegacy-apiを削除し、
      # gatewayのフォールバック(未割り当てパスの暗黙転送)も廃止したため、ルート表に無いパスは
      # gatewayが404を返す(services/gateway/src/main/resources/application.yml)。
      # コンテナ間通信のためlbs-net内部で直接到達させる(自己署名証明書を経由しないため
      # NODE_EXTRA_CA_CERTSは不要)
      LETS_BLOG_GATEWAY_URL: http://gateway:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # ブラウザから見える公開URL(認証コールバック等の生成に使用)
      NEXTAUTH_URL: https://localhost
      # Keycloakのletsblog-webクライアント(confidential client)のシークレット(#564)。
      # apps/web/src/lib/auth.tsがトークン交換・リフレッシュ・ログアウトのサーバー間通信で使う。
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
    # 既定は本番ビルド(#1743)。`next build` はイメージのビルド時に済んでおり、ここでは
    # `next start` で配信するだけである。ソースはバインドマウントしない: イメージ内の
    # node_modules と .next を使うので、ホストで `npm run build` を実行しても稼働中の web と
    # 衝突しない(以前は ./apps/web:/app を共有しており、500になることがあった)。
    # `apps/web` を変えたら `./startup.sh --build` でイメージを作り直す。
    # ホットリロード(next dev + ソースのバインドマウント)が要るときだけ、
    # docker-compose.dev-web.yml を重ねる(README.md「lbs-web の開発モード」)。
    #
    # マウント先(/app)を working_dir にしない(#1000)。
    #
    # イメージのWORKDIRは/appである。開発モードのオーバーレイはそこへバインドマウントする。
    # ヘルスチェックはdocker execと同じ経路で走り、cwdはコンテナのWorkingDirになる。
    # runc 1.4.0はexecのcwdがバインドマウント経由でマウント名前空間のルート外を指す場合、
    # プロセスの起動そのものを拒否する(current working directory is outside of container
    # mount namespace root)。拒否されるのはプロセスが動き出す前なので、test:の中にcdを
    # 書いても回避できない。e2eスタブ6本が恒常的にunhealthyになったのと同じ構図である。
    # 本番モードにバインドマウントは無いが、開発オーバーレイと同じ working_dir に揃える。
    #
    # next はプロジェクトディレクトリをcwdから決めるため、起動時にだけ/appへ入る。
    working_dir: /
    command: ["sh", "-c", "cd /app && exec npm run start"]
    # webの呼び先はgatewayに一本化した(issue #584)ため、起動順の依存もgatewayへ付け替える
    # (gateway自身がapi/identity/各ドメインサービスのhealthyを待つ)。
    depends_on:
      - gateway
    # E2E(#588)がテスト開始前に「全サービスhealthy」を待てるようにするためのヘルスチェック。
    # 認証不要でNext.jsのサーバー処理まで到達する/api/auth/csrf(NextAuth)を叩く。
    # 本番モード(next start)はビルド済みなのでコンパイルは走らないが、開発モード(next dev、
    # docker-compose.dev-web.yml)は初回リクエスト時にコンパイルが走る。両方で使うため
    # start_period/retriesは他サービス(actuator)より緩めに設定する。
    # node:22-alpineにcurlは無いためbusybox wgetを使う。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/auth/csrf || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  media:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/media/Dockerfile
    container_name: lbs-media
    <<: [*common-service, *actuator-healthcheck]
    environment:
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_media?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_media
      SPRING_DATASOURCE_PASSWORD: ${LBS_MEDIA_DB_PASSWORD}
      # media は platform-service の /api/internal/platform/image-generation-config を
      # 自分自身のサービストークンで呼ぶ(#583 で画像生成一式が移り、#742 で JWT 必須になった)。
      # この宣言が無いと application.yml の既定値(空文字)が使われ、Keycloak が
      # unauthorized_client で拒否し、画像生成に関わる公開APIが全滅する(#998)。
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-v1-5-pruned-emaonly.safetensors}
      PLANTUML_BASE_URL: http://plantuml:8080
      GENERATED_IMAGES_STORAGE_PATH: /app/data/generated-images
      # メディアガベージコレクションのCMSブリッジ(CmsMediaBridgeController)の呼び出し先。
      # #573 stage3ではlegacy-apiが所有していたが、issue #709でpublishing-serviceへ移管された
      # (Epic #551 C6-3)。起動時の依存関係(depends_on)には含めない(publishingがmediaのhealthyを
      # 待つ構成にはしていないため、循環させないよう実行時呼び出し先としてのみ設定する)。
      PUBLISHING_SERVICE_URI: http://publishing:8080
      # プロジェクトの存在確認(画像設定の読み書き・解決、issue #583)。project_image_settings と
      # 画像生成一式が media-service へ移ったのに伴い、projects の所有者へ問い合わせる。
      PROJECT_SERVICE_URI: http://project:8080
      # 画像生成・メディアGCのジョブ(GenerationJob、ai-serviceが所有)の進捗反映先。
      # issue #574でgeneration_jobsの所有権がai-serviceへ移ったため、GenerationJobClientの向き先を
      # ここへ切り替えた(同じくdepends_onには含めない。理由は上のコメントと同じ)。
      AI_SERVICE_URI: http://ai:8080
      <<: *rabbitmq-env
      # メディアガベージコレクションのrequireAdmin/自分自身のuserId解決のため、呼び出し元の
      # Bearerトークンをそのままidentity-serviceへ転送して問い合わせる(#573 stage3)。
      IDENTITY_SERVICE_URI: http://identity:8080
      # 同期 POST /api/ai/image は最大256枚(16x16)のBase64をレスポンス完了までオンヒープに保持する。
      # ヒープを既定(コンテナ上限の25%)に任せず明示する(#1112)。コンテナ上限との差(1GiB)は
      # 非ヒープ(メタスペース・スレッド・ダイレクトバッファ)と RechartsRenderer の Chromium の余裕。
      # 根拠と見積もりは docs/DOCKER_COMPOSE_ARCHITECTURE.md「media のメモリ上限」。
      JAVA_TOOL_OPTIONS: -Xmx1g
      # .env の SAFETY_NEGATIVE_PROMPT_* を media へ渡す(#1605)。未設定のときだけ application.yml と
      # 同じ既定値を使う(コロン無しの `${VAR-既定値}`)。`${VAR}` や `${VAR:-}` だと未設定が空文字になり
      # 既定値を潰す。空文字を明示したカテゴリは空のまま渡り、連結されない(SafetyNegativePromptService)。
      SAFETY_NEGATIVE_PROMPT_SEXUAL: ${SAFETY_NEGATIVE_PROMPT_SEXUAL-nsfw, nude, naked, nudity, explicit, sexual, lewd, erotic, underwear, lingerie, cleavage}
      SAFETY_NEGATIVE_PROMPT_VIOLENT: ${SAFETY_NEGATIVE_PROMPT_VIOLENT-gore, gory, mutilated, dismembered, corpse, blood, violence, decapitated}
      SAFETY_NEGATIVE_PROMPT_DISCRIMINATORY: ${SAFETY_NEGATIVE_PROMPT_DISCRIMINATORY-nazi symbol, hate symbol, racist imagery, offensive stereotype}
    # deploy.resources.limits ではなく mem_limit を使う: Swarm 専用扱いの deploy 節に頼らず、
    # 通常の `docker compose up` でも docker inspect の HostConfig.Memory に確実に反映されるため。
    mem_limit: 2g
    volumes:
      - generated_images:/app/data/generated-images
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy

  # LLM呼び出し(下書き/校正/要約/タグ提案/セクション生成/Ask AI)・記事プラン(壁打ち)・
  # generation_jobs(LLM/ComfyUIジョブ履歴)の所有権をai-serviceへ移管(#574)。スキーマ・Flyway
  # マイグレーションは専用のlbs_aiスキーマ(ADR-0004)で本サービスが所有する。
  ai:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: lbs-ai
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_ai
      SPRING_DATASOURCE_PASSWORD: ${LBS_AI_DB_PASSWORD}
      # project_ai_settings.brave_search_api_key_encryptedの暗号化/復号(CredentialCipher)。
      # 全サービス共通の鍵(legacy-api/media-serviceと同じ値)。
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # GitHubアクセス解決(ProjectBridgeClient)の呼び出し先。issue #583 で legacy-api の
      # AiBridgeController から、GitHubトークンの所有者である project-service へ移した。
      # プロジェクトメンバー判定は下の IDENTITY_SERVICE_URI(project_users の所有者)へ向く。
      PROJECT_SERVICE_URI: http://project:8080
      # マスター環境サイトの既存カテゴリ/タグ取得(PublishingServiceClient)の呼び出し先。issue #574では
      # legacy-apiのAiBridgeControllerが所有していたが、CmsAdapterFactory/cms/*の所有権がpublishing-service
      # へ移った(issue #707)ため、issue #711でこの3エンドポイントのみ切り替えた(Epic #551 C6-5。
      # 起動時の依存関係(depends_on)には含めない。理由は上のLEGACY_API_URIと同じ)。
      PUBLISHING_SERVICE_URI: http://publishing:8080
      # AdminAuthorizationServiceのrequireAdmin/requireProjectMemberOrAdmin・自分自身のuserId解決の
      # ため、呼び出し元のBearerトークンをそのままidentity-serviceへ転送して問い合わせる
      # (log-writer(#572)/media-service(#573)と同じ暫定策)。
      IDENTITY_SERVICE_URI: http://identity:8080
      # システム設定由来の実効LLM接続設定とBrave Search APIキーの取得先(issue #583)。
      # 以前はlegacy-apiのAiBridgeController経由だったが、その実装はplatform-serviceへの
      # 単純な中継だったため直接呼ぶよう切り替えた。
      PLATFORM_SERVICE_URI: http://platform:8080
      <<: *rabbitmq-env
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 記事本文(posts)・カスタムタグ・Markdownレンダリング・記事プレビュー・ブログカード/Amazonタグの
  # コンテンツキャッシュの所有権をcontent-serviceへ移管(#576)。スキーマ・Flywayマイグレーションは
  # 専用のlbs_contentスキーマ(ADR-0004)で本サービスが所有する。[blogcard]/[amazon]タグの
  # スクレイピング・記事プレビューのテーマ骨格取得用のヘッドレスブラウザ(Playwright)は本サービスが持つ。
  content:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/content/Dockerfile
    container_name: lbs-content
    mem_limit: 1536m
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx768m
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_content?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_content
      SPRING_DATASOURCE_PASSWORD: ${LBS_CONTENT_DB_PASSWORD}
      <<: *rabbitmq-env
      # projects/sites/tag_design_settings への内部ブリッジ(ProjectBridgeClient)の呼び出し先。
      # issue #583 まではこれらを legacy-api の ContentBridgeController 経由で取得していたが、
      # その実装は project-service への素通しだったため、中継を外して直接向けた。
      # project_users のメンバー判定と roles は下の IDENTITY_SERVICE_URI へ向く。
      PROJECT_SERVICE_URI: http://project:8080
      # 埋め込みタグ(PlantUML/Recharts)展開の
      # 呼び出し先(issueの注記どおり、実際のダイアグラム描画はmedia-serviceへ委譲する)。
      MEDIA_SERVICE_URI: http://media:8080
      # カスタムタグのAI生成(CustomTagGenerationService)の呼び出し先。
      AI_SERVICE_URI: http://ai:8080
      # AdminAuthorizationServiceのrequireAdmin/requireProjectMemberOrAdmin・自分自身のuserId解決の
      # ため、呼び出し元のBearerトークンをそのままidentity-serviceへ転送して問い合わせる
      # (log-writer/media-service/ai-serviceと同じ暫定策)。
      IDENTITY_SERVICE_URI: http://identity:8080
      # カスタムタグ生成ジョブ(issue #1409)の完了・失敗をai-serviceの内部ブリッジへ反映するための
      # Client Credentials(ServiceTokenClientConfig)。media-service・project-serviceと同じ資格情報。
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy

  # Google Analytics/AdSense連携(OAuth資格情報の保管、GA4 Data API/AdSense Management APIの
  # レポート取得)の所有権をanalytics-serviceへ移管(#578)。OAuthの資格情報を扱うため、他ドメインから
  # 分離して保管する。スキーマ・Flywayマイグレーションは専用のlbs_analyticsスキーマ(ADR-0004)で
  # 本サービスが所有する。
  analytics:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: lbs-analytics
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_analytics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_analytics
      SPRING_DATASOURCE_PASSWORD: ${LBS_ANALYTICS_DB_PASSWORD}
      # analytics_credentialsの各暗号化カラム(GAサービスアカウントJSON/AdSenseリフレッシュトークン/
      # AdSense OAuthクライアントシークレット)の暗号化/復号(CredentialCipher)。全サービス共通の鍵
      # (legacy-api/ai-serviceと同じ値)。
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # レポート取得可否判定(本番サイトが紐付いているか、ProjectBridgeClient)の呼び出し先。
      # issue #583 で legacy-api の AnalyticsBridgeController から projects/sites の所有者である
      # project-service へ移した。プロジェクトメンバー判定は下の IDENTITY_SERVICE_URI へ向く。
      PROJECT_SERVICE_URI: http://project:8080
      # AdminAuthorizationServiceのrequireProjectMemberOrAdmin・自分自身のuserId解決のため、
      # 呼び出し元のBearerトークンをそのままidentity-serviceへ転送して問い合わせる
      # (log-writer(#572)/media-service(#573)/ai-service(#574)と同じ暫定策)。
      IDENTITY_SERVICE_URI: http://identity:8080
      <<: *rabbitmq-env
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # プロジェクト/サイトに紐付かないアプリ全体のグローバル設定(system_settings: Brave Search APIキー・
  # 実効LLM接続設定/メール送信/Google OAuthクライアント/Webフロント公開URL/アップロードレート制限)の
  # 所有権をplatform-serviceへ移管(issue #693、C10-1)。緊急パスワードリセット
  # (AdminPasswordResetRunner)もここへ移設した。スキーマ・Flywayマイグレーションは専用の
  # lbs_platformスキーマ(ADR-0004)で本サービスが所有する。全サービスMySQLスキーマ+Keycloak
  # PostgreSQLを対象としたバックアップ/リストア機能(BackupService/BackupController)をlegacy-apiから
  # 移設・拡張した(issue #694、C10-2)。コンテナ状態/接続サービス状態のSSE中継(#695、C10-3)・
  # VSCode拡張のオンデマンドビルド配布(VscodeExtensionBuildService/VscodeExtensionController、
  # issue #696、C10-4)もlegacy-apiから移設した(gatewayのplatformルート、
  # /api/system/**・/api/backup/**参照。/api/system/vscode-extensionは/api/system/**に含まれる)。
  platform:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    container_name: lbs-platform
    mem_limit: 1536m
    <<: [*common-service, *actuator-healthcheck]
    # 他サービスとの通信はlbs-net(x-common-serviceの既定)を維持しつつ、docker-socket-proxyへの
    # 到達性のためだけにdocker-socket-proxy-netへも参加する(issue #701。下のdocker-socket-proxy
    # サービス定義・networks:セクションのコメント参照)。
    networks:
      - lbs-net
      - docker-socket-proxy-net
    environment:
      JAVA_TOOL_OPTIONS: -Xmx768m
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_platform
      SPRING_DATASOURCE_PASSWORD: ${LBS_PLATFORM_DB_PASSWORD}
      # system_settings.setting_value_encryptedの暗号化/復号(CredentialCipher)。全サービス共通の鍵
      # (legacy-api/ai-service/analytics-serviceと同じ値)。
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # AppSettingServiceのDB未設定時フォールバック値。legacy-apiのapiコンテナが持っていた同名の
      # 環境変数と同じ(issue #693でSystemSettingService/AppSettingServiceの所有権がここへ移った)。
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@letsblog.example.com}
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL:-https://localhost}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_AVAILABLE_MODELS: ${LLM_AVAILABLE_MODELS:-gpt-4o-mini,gpt-4o,gpt-4.1-mini}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      # issue #1086: 既定プロバイダはOllama(外部LLMのAPIキーが無くてもAI執筆支援が動く)。Ollamaは同梱せず、
      # GPU PC で動かして URL で接続する(#1745。docs/EXTERNAL_OLLAMA.md)。
      # DB(system_settings)に llm_provider があればそちらが優先される。
      LLM_PROVIDER: ${LLM_PROVIDER:-OLLAMA}
      LLM_CLAUDE_MODEL: ${LLM_CLAUDE_MODEL:-claude-3-5-haiku-20241022}
      # OLLAMA専用の既定モデル(issue #1086)。Ollama / ComfyUI の接続先は環境変数では渡さない(issue #1567):
      # プロジェクト設定かシステム設定(DB)だけで決まる。Ollama も ComfyUI も同梱せず、既定値は書き込まない
      # (GPU PC などの外部の URL を管理画面で設定する。#1745 / #1746)。LLM_OLLAMA_BASE_URL / COMFYUI_BASE_URL は廃止した。
      LLM_OLLAMA_MODEL: ${LLM_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:-10}
      # ConnectedServiceStatusService(issue #695、C10-3でlegacy-apiから移設)が疎通確認する外部連携先。
      # legacy-apiのapiコンテナが持っていた同名の環境変数と同じ。
      PLANTUML_BASE_URL: http://plantuml:8080
      WORDPRESS_PROVISION_BASE_URL: http://wordpress:9000
      # issue #589: ダッシュボードに Let's Blog 自身の9サービスの状態を出すため、gateway の
      # 集約ヘルスを読む。各サービスを個別に叩かず1箇所(gateway)の判定を展開する。
      GATEWAY_URI: http://gateway:8080
      # issue #589: RabbitMQ のキュー滞留・DLQ 滞留の判定に Management HTTP API を使う。
      # AMQP の接続だけでは各キューの滞留数を取れない。
      RABBITMQ_MANAGEMENT_URI: http://rabbitmq:15672
      # ContainerStatusService(issue #695、C10-3でlegacy-apiから移設)がDocker Engine API(コンテナ一覧)を
      # 読み取り専用で取得するためのdocker-socket-proxyのURL。docker-socket-proxyへのアクセスは
      # 本サービスのみに限定する(Epic #551の方針。下のdocker-socket-proxy定義・depends_on参照)。
      DOCKER_SOCKET_PROXY_BASE_URL: http://docker-socket-proxy:2375
      # ダッシュボードに他プロジェクトのコンテナを載せないための絞り込みに使う(issue #803)。
      # composeが既定で使うプロジェクト名(ディレクトリ名)と一致させること。
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-lets_blog_server}
      # AdminAuthorizationServiceのrequireAdmin・自分自身のuserId解決のため、呼び出し元のBearer
      # トークンをそのままidentity-serviceへ転送して問い合わせる(log-writer/content-service/
      # project-serviceと同じ暫定策)。
      IDENTITY_SERVICE_URI: http://identity:8080
      # AdminPasswordResetRunner(緊急パスワードリセット)がKeycloak Admin REST APIを呼び出すための
      # letsblog-servicesクライアントのシークレット(legacy-api/identity-serviceと同じ値、issue #681由来)。
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
      # BackupService(issue #694)が生成画像ファイルをバックアップ/リストアする際の保存先。
      # legacy-apiのapiコンテナが持っていた同名の環境変数と同じ(バックアップ機能の移設に伴い、
      # 実体を書き込むmedia-serviceと共有するgenerated_images volumeをこちらへ付け替えた)。
      GENERATED_IMAGES_STORAGE_PATH: /app/data/generated-images
      # BackupService(issue #694、C10-2)が全サービスのMySQLスキーマ+Keycloak PostgreSQLを横断して
      # バックアップ/リストアするための接続情報。各サービス専用のDBユーザーでは他スキーマへ
      # アクセスできない(#570のスキーマ分離)ため、バックアップ専用のMySQLユーザー(infra/mysql/init/
      # 01-create-service-schemas.shが作成・スキーマ限定の権限を付与する)を使う。
      # 旧スキーマ(分割前の lets_blog)は #785 でバックアップのうえ DROP したため、
      # この一覧から外した。対象はサービス別スキーマ9つ(ADR-0004)のみ。
      BACKUP_MYSQL_HOST: mysql
      BACKUP_MYSQL_PORT: "3306"
      BACKUP_MYSQL_USER: lbs_backup
      BACKUP_MYSQL_PASSWORD: ${LBS_BACKUP_DB_PASSWORD}
      BACKUP_MYSQL_SCHEMAS: lbs_identity,lbs_project,lbs_content,lbs_media,lbs_ai,lbs_publishing,lbs_analytics,lbs_platform,lbs_log
      # KeycloakのPostgreSQL(keycloak-postgres)は元々そのDB専用のkeycloakユーザーしか存在しないため、
      # 新たな横断的な認証情報を追加せず、その既存ユーザーの認証情報をそのまま流用する
      # (下のkeycloak-postgresサービス定義参照)。
      BACKUP_POSTGRES_HOST: keycloak-postgres
      BACKUP_POSTGRES_PORT: "5432"
      BACKUP_POSTGRES_USER: keycloak
      BACKUP_POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      BACKUP_POSTGRES_DATABASE: keycloak
      # VscodeExtensionBuildService(issue #696、C10-4でlegacy-apiから移設)がシステム画面向けに
      # VSCode拡張機能の.vsixをオンデマンドビルドする際のソース/作業ディレクトリ。legacy-apiのapi
      # コンテナが持っていた同名の環境変数と同じ。
      VSCODE_EXTENSION_SOURCE_PATH: /app/extension-src
      VSCODE_EXTENSION_BUILD_PATH: /app/extension-build
      <<: *rabbitmq-env
    volumes:
      - generated_images:/app/data/generated-images
      # システム画面からのVSCode拡張機能ダウンロード用。オンデマンドビルドの作業ディレクトリは
      # コンテナ内の書き込み可能な場所(/app/extension-build)を使うため、ソースは読み取り専用でマウントする
      # (issue #696、C10-4でapiコンテナから移設)。
      - ./apps/extension:/app/extension-src:ro
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  # 名前をつけて保存・管理するSSH鍵ペア(Ed25519)、[toc]/[blogcard]/[amazon]組み込みタグの
  # デザインカスタマイズ(プロジェクト単位)をlegacy-apiから抽出した(#577 stage 1)。より大きな
  # Project/Site(CMS/WordPress自動プロビジョニング)ドメインは #577 stage2 で移設済み。
  project:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/project/Dockerfile
    container_name: lbs-project
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_project
      SPRING_DATASOURCE_PASSWORD: ${LBS_PROJECT_DB_PASSWORD}
      <<: *rabbitmq-env
      # project_users(メンバー判定・所属プロジェクトID)と利用者個人のGitHubトークンへの
      # 内部ブリッジ(IdentityBridgeClient)の呼び出し先は、下の IDENTITY_SERVICE_URI。
      # issue #583 で project_users の所有権が legacy-api から identity-service へ移ったため、
      # LEGACY_API_URI は不要になった。
      # CMSプロビジョニングブリッジ(CmsProvisioningBridgeClient、サイト登録・接続確認・wp-cli
      # インストール・環境同期のSSH/wp-cli操作)の呼び出し先。issue #577 stage2ではlegacy-apiが
      # 所有していたが、issue #710でpublishing-serviceへ移管した(Epic #551 C6-4。起動時の
      # 依存関係(depends_on)には含めない、理由は上のLEGACY_API_URIと同じ)。
      PUBLISHING_SERVICE_URI: http://publishing:8080
      # WordPress の letsblog プラグインへ送るタグ定義・統合CSS等(ContentBridgeClient)の取得先(issue #1558)。
      # 起動時の依存関係(depends_on)には含めない(同期は後から非同期で行うため)。
      CONTENT_SERVICE_URI: http://content:8080
      # 組み込みタグのデザインCSS/HTMLテンプレートのAI生成(TagDesignGenerationService)の呼び出し先。
      AI_SERVICE_URI: http://ai:8080
      # AdminAuthorizationServiceのrequireAdmin/requireProjectMemberOrAdmin・自分自身のuserId解決の
      # ため、呼び出し元のBearerトークンをそのままidentity-serviceへ転送して問い合わせる
      # (log-writer/media-service/ai-service/content-serviceと同じ暫定策)。
      IDENTITY_SERVICE_URI: http://identity:8080
      # ssh_key_pairs.private_key_encrypted / sites.credentials_encryptedの暗号化/復号
      # (CredentialCipher、lbs-common)。全サービス共通のAES-256-GCM鍵。
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # 常駐wordpressコンテナ内の内部限定プロビジョニングエージェント(issue #577 stage2)。
      # apiと同じ値(同一エージェントを共有する)。wordpressにヘルスチェックが無いため、apiと同様
      # 起動時の依存関係(depends_on)には含めず、実行時呼び出し先としてのみ設定する。
      WORDPRESS_PROVISION_BASE_URL: http://wordpress:9000
      WP_PROVISION_TOKEN: ${WP_PROVISION_TOKEN}
      # サイト自動構築ジョブ(issue #1479)の進捗・完了・失敗をai-serviceの内部ブリッジへ反映するための
      # Client Credentials(ServiceTokenClientConfig)。media-serviceと同じ資格情報。
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # cms/*パッケージ(CmsAdapter/WordPressAdapter/エージェント・SSH操作)・PostPublishService/
  # PostDeleteService・PostControllerの公開・削除エンドポイントをlegacy-apiから抽出(issue #707、
  # Epic #551 C6-1)。サイト本体・CMS認証情報(project-service)・投稿(posts)テーブル(content-service)・
  # 著者マッピング(user_site_authors、issue #583でidentity-service)はいずれも自身で持たず、
  # 内部ブリッジ経由で読み書きする
  # (#575設計判断1・2・4)。スキーマ・Flywayマイグレーションは専用のlbs_publishingスキーマ
  # (ADR-0004)で本サービスが所有する(本Issue時点では所有ドメインテーブルは無い)。
  publishing:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/publishing/Dockerfile
    container_name: lbs-publishing
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_publishing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_publishing
      SPRING_DATASOURCE_PASSWORD: ${LBS_PUBLISHING_DB_PASSWORD}
      <<: *rabbitmq-env
      # サイト本体・CMS認証情報の内部ブリッジ呼び出し先(ProjectServiceClient、#575設計判断2)。
      PROJECT_SERVICE_URI: http://project:8080
      # Markdownレンダリング・postsテーブルの読み書きの内部ブリッジ呼び出し先(ContentServiceClient、
      # #575設計判断1)。記事プレビューのテーマ骨格取得(Playwrightを持つのはcontent-service)も
      # 同じクライアント経由で呼ぶ(issue #712でArticlePreviewServiceを移設したのに伴う)。
      CONTENT_SERVICE_URI: http://content:8080
      # 著者マッピング(user_site_authors、#575設計判断4)とプロジェクトメンバー判定
      # (project_users、issue #712)の内部ブリッジ呼び出し先(IdentityBridgeClient)。
      # issue #583 でこれらの所有権が identity-service へ移った。あわせて identity-service が
      # 著者プロビジョニング(PublishingServiceClient)をこのコンテナへ依頼する双方向ブリッジになる
      # (起動時の依存関係(depends_on)には含めない。循環しない実行時呼び出し先としてのみ設定する)。
      # CurrentActorService の自分自身の userId 解決も同じ宛先。
      IDENTITY_SERVICE_URI: http://identity:8080
      # 投稿画像リサイズのプロジェクト別デフォルト(project_image_settings、MediaSettingsBridgeClient)は
      # issue #583 で media-service が所有するようになったため、下の MEDIA_SERVICE_URI 経由で解決する。
      # [plantuml]/```plantumlの埋め込み(PlantUmlEmbedService/PlantUmlTagRenderService)の実際の
      # レンダリング呼び出し先。
      MEDIA_SERVICE_URI: http://media:8080
      # 常駐wordpressコンテナ内の内部限定プロビジョニングエージェント(infra/wordpress/provision-agent)の
      # `/wp-cli/*`エンドポイント呼び出し先(WordPressAgentOperations)。apiと同じ値。
      WORDPRESS_PROVISION_BASE_URL: http://wordpress:9000
      WP_PROVISION_TOKEN: ${WP_PROVISION_TOKEN}
      # 一括管理(プラグイン/テーマのzipアップロード)のロールフォワード用永続ボリューム
      # (BulkUploadStorageService)。一括管理機能一式のpublishing-serviceへの移設(issue #708)に伴い、
      # apiコンテナから移した(bulk_upload_filesボリュームは同じものを引き続き使う)。
      BULK_UPLOAD_STORAGE_PATH: /app/data/bulk-uploads
      # 全環境インストール(slug / zip)をジョブとして受理する(issue #1702)。ジョブ(generation_jobs)の
      # 所有者はai-serviceなので、その呼び出し先と、進捗・完了・失敗の反映とリクエストの無いスレッドでの
      # project-service呼び出しに使うClient Credentials(ServiceTokenClientConfig)を渡す。
      # project-service・media-serviceと同じ資格情報。ai-serviceへはdepends_onに含めない(実行時の呼び出し先のみ)。
      AI_SERVICE_URI: http://ai:8080
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
    volumes:
      - bulk_upload_files:/app/data/bulk-uploads
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ログの所有権をlog-writerへ完全移管(#572)。RabbitMQ経由でエラーログ/操作ログ/監査ログの
  # メッセージを受信して書き込むのに加え、読み取りAPI(監査ログ・操作ログ・フロントエンドエラー
  # ログ)もここへ移設した。スキーマ・Flywayマイグレーションは専用の lbs_log スキーマ
  # (ADR-0004)で本サービスが所有する。
  log-writer:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/log-writer/Dockerfile
    container_name: lbs-log-writer
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      <<: *rabbitmq-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_log?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_log
      SPRING_DATASOURCE_PASSWORD: ${LBS_LOG_DB_PASSWORD}
      # 読み取りAPIのadmin判定・自分自身のuserId解決のため、呼び出し元のBearerトークンを
      # そのままidentity-serviceの/api/identity/meへ転送して問い合わせる(#572の暫定策。
      # lbs_logスキーマはusersテーブルへアクセスできない=ADR-0004のクロススキーマ禁止のため。
      # C12(#581)でサービス間同期呼び出しの標準クライアントが定まったらそちらへ寄せる)。
      IDENTITY_SERVICE_URI: http://identity:8080
      # 統合操作ログ(/api/operation-logs/unified)のAIジョブソース。#825でlegacy-apiから
      # ai-serviceへ向け直した(GenerationJobControllerがai-serviceへ移設済みのため)。
      AI_SERVICE_URI: http://ai:8080
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 単一入口(#560)。/api/**のルーティング・JWT検証・レート制限・相関ID付与を担う。
  # issue #583 で legacy-api を削除し、全ルートが実サービスを指すようになった。
  # 未割り当てパスのフォールバック(以前は legacy-api へ暗黙転送していた)も廃止し、
  # マッチしないパスは gateway 自身が404を返す
  # (services/gateway/src/main/resources/application.yml参照)。
  gateway:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: lbs-gateway
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      LOG_SERVICE_URI: http://log-writer:8080
      # 画像生成・ダイアグラム・PlantUML/Rechartsレンダリングのルーティング先(#573)。
      MEDIA_SERVICE_URI: http://media:8080
      # LLM呼び出し・記事プラン(壁打ち)・generation_jobsのルーティング先(#574)。
      AI_SERVICE_URI: http://ai:8080
      # 記事本文(posts)・カスタムタグ・記事プレビュー・コンテンツキャッシュのルーティング先(#576)。
      CONTENT_SERVICE_URI: http://content:8080
      # プロジェクトダッシュボードのGA/AdSenseレポート取得のルーティング先(#578)。
      ANALYTICS_SERVICE_URI: http://analytics:8080
      # Project/Site本体、SSH鍵ペア管理、組み込みタグのデザインカスタマイズ、
      # プロジェクト単位のGitHubトークン(issue #583で分割した api-keys のうち1本)の
      # ルーティング先(services/gateway/src/main/resources/application.yml参照)。
      PROJECT_SERVICE_URI: http://project:8080
      # システム全体のグローバル設定(system-settings、issue #693)・バックアップ(issue #694)・
      # ダッシュボードのコンテナ状態/接続サービス状態(issue #695、C10-3、dashboard-status/
      # dashboard-status-streamルート)・VSCode拡張のオンデマンドビルド配布(issue #696、C10-4、
      # /api/system/vscode-extension、下のplatformルートの/api/system/**に含まれる)の
      # ルーティング先。
      PLATFORM_SERVICE_URI: http://platform:8080
      # 投稿の公開(POST /api/posts/publish)・削除(DELETE /api/posts/*/*)のルーティング先
      # (issue #707、posts-publish-legacy/posts-delete-legacyルート)。一括管理・taxonomy解決
      # (issue #708、project-bulk-management-legacy/project-asset-images-legacy/publishingルート)、
      # 記事プレビューの署名付きURL発行(issue #1561、project-previewルート。/renderのみ
      # content-serviceのまま)もここへ向ける。
      PUBLISHING_SERVICE_URI: http://publishing:8080
    depends_on:
      identity:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      log-writer:
        condition: service_healthy
      platform:
        condition: service_healthy
      media:
        condition: service_healthy
      ai:
        condition: service_healthy
      content:
        condition: service_healthy
      analytics:
        condition: service_healthy
      project:
        condition: service_healthy
      publishing:
        condition: service_healthy

  identity:
    logging: *default-logging
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: lbs-identity
    mem_limit: 1g
    <<: [*common-service, *actuator-healthcheck]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: UTC
      # issue #786: 専用スキーマlbs_identityへ切り替えた(ADR-0004)。#561の受入基準にあった
      # 「lbs_identityをFlywayで管理する」が未達のまま、分割前のlets_blogを参照し続けていた。
      # 切り替え前にscripts/migrate-identity-tables-to-lbs-identity.sqlでデータを移すこと
      # (手順はdocs/SERVICE_SCHEMA_MIGRATION.md)。
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lbs_identity?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs_identity
      SPRING_DATASOURCE_PASSWORD: ${LBS_IDENTITY_DB_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # Keycloakユーザー同期(#562)。letsblog-servicesクライアントのシークレット
      # (infra/keycloak/realm-export.jsonで定義済み)。他の値(token-uri等)はコンテナ間の既定URLで
      # 足りるためservices/identity/src/main/resources/application.ymlの既定値に委ねる。
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
      # issue #1241: アバター画像(512x512 JPEG、メタ情報削除済み)の保存先。
      # media-serviceのGENERATED_IMAGES_STORAGE_PATHと同じ考え方の、identity-service専用ボリューム。
      AVATAR_STORAGE_PATH: /app/data/avatars
      <<: *rabbitmq-env
    volumes:
      - avatar_images:/app/data/avatars
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:3-management-alpine
    container_name: lbs-rabbitmq
    mem_limit: 768m
    <<: *common-service
    environment:
      TZ: UTC
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # apiコンテナからダッシュボードのコンテナ稼働状況(issue #280)取得のためだけにDocker Engine APIを
  # 中継する(読み取りに加え、コンテナのstart/stopだけ許可: #1587)。apiコンテナ自体にはdocker.sockを渡さない
  # (コンテナ作成/実行系のPOST操作は許可しない=侵害時にDockerホストを乗っ取られるリスクを避ける)。
  # issue #695(C10-3)でアプリコードの呼び出し元をplatform-serviceのみに一本化したが、lbs-net上の
  # 全コンテナが同一フラットネットワークにいたため、環境変数を持たない他コンテナからでも
  # http://docker-socket-proxy:2375 へ到達できてしまっていた(ネットワークレベルの制限は未達成、
  # issue #701)。ここでは共通の lbs-net には参加させず、専用の内部ネットワーク
  # docker-socket-proxy-net(下のplatformサービス定義・networks:セクション参照)にのみ参加させることで、
  # Epic #551の方針どおり到達可能なコンテナをplatform-serviceだけに限定する。
  docker-socket-proxy:
    logging: *default-logging
    # v0.5.0。haproxy.cfg.template をイメージ内部のパスへ差し替えるため、:latest ではなく
    # ダイジェストで固定する(#1587)。更新するときは infra/docker-socket-proxy/haproxy.cfg.template を
    # 新しいイメージの同ファイルと突き合わせること。
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: lbs-docker-socket-proxy
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - docker-socket-proxy-net
    environment:
      TZ: UTC
      # 権限は環境変数(CONTAINERS / POST / ALLOW_*)ではなく、下のテンプレートの frontend で決める。
      # 許可: GET /containers/json、GET /containers/<id>/json だけ(#1744)。
      # それ以外(start / stop / create / DELETE / exec / restart / kill / images/create ほか)はすべて 403。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/docker-socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro

  mysql:
    logging: *default-logging
    image: mysql:8.0
    container_name: lbs-mysql
    mem_limit: 1g
    <<: *common-service
    # セッション/グローバルのタイムゾーンをコンテナOSの TZ に頼らず +00:00 に固定する(#1257)。
    # DATETIME DEFAULT/ON UPDATE CURRENT_TIMESTAMP 列がUTCで書かれることを保証する。
    # tz テーブル(mysql_tzinfo_to_sql)に依存しないオフセット表記にしている。
    command: ["--default-time-zone=+00:00"]
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # MYSQL_DATABASE(分割前の lets_blog スキーマ)は #785 で撤去した。#583 で legacy-api を
      # 削除して参照元が無くなり、スキーマ自体も DROP 済み。残すと空ボリュームからの初回起動時に
      # 使われないスキーマが再作成されてしまう。
      #
      # MYSQL_USER / MYSQL_PASSWORD(lbs_app)は残す。下の wordpress(WORDPRESS_DB_USER)が
      # このユーザーで接続する(phpmyadmin は #978 以降このユーザーを渡されず、運用者が
      # ログイン画面で入力する)。マネージドWordPressのサイト別DBは
      # プロビジョニングエージェントが root で都度作成し、このユーザーへ個別に権限を付与するため、
      # MYSQL_DATABASE が無くても機能する。
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # サービス別スキーマ分離(#570)。infra/mysql/init/01-create-service-schemas.sh が
      # 初回起動時にこれらの値でスキーマ/ユーザーを作成する。
      LBS_IDENTITY_DB_PASSWORD: ${LBS_IDENTITY_DB_PASSWORD}
      LBS_PROJECT_DB_PASSWORD: ${LBS_PROJECT_DB_PASSWORD}
      LBS_CONTENT_DB_PASSWORD: ${LBS_CONTENT_DB_PASSWORD}
      LBS_MEDIA_DB_PASSWORD: ${LBS_MEDIA_DB_PASSWORD}
      LBS_AI_DB_PASSWORD: ${LBS_AI_DB_PASSWORD}
      LBS_PUBLISHING_DB_PASSWORD: ${LBS_PUBLISHING_DB_PASSWORD}
      LBS_ANALYTICS_DB_PASSWORD: ${LBS_ANALYTICS_DB_PASSWORD}
      LBS_PLATFORM_DB_PASSWORD: ${LBS_PLATFORM_DB_PASSWORD}
      LBS_LOG_DB_PASSWORD: ${LBS_LOG_DB_PASSWORD}
      # 全サービスMySQLスキーマを横断してバックアップ/リストアするための専用ユーザー(issue #694、
      # C10-2)。01-create-service-schemas.shが作成し、上記の各スキーマ限定の権限のみを付与する
      # (MySQL rootクレデンシャルは使わず、#570のスキーマ分離の意図を損なわない範囲に留める)。
      LBS_BACKUP_DB_PASSWORD: ${LBS_BACKUP_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    logging: *default-logging
    image: phpmyadmin/phpmyadmin
    container_name: lbs-phpmyadmin
    mem_limit: 128m
    # 既定の起動では作らない(#1741)。DB を画面で確認するときだけ `COMPOSE_PROFILES=db-tools`
    # (または `docker compose --profile db-tools up -d`)で起動する。
    profiles: ["db-tools"]
    <<: *common-service
    environment:
      TZ: UTC
      PMA_HOST: mysql
      # PMA_USER / PMA_PASSWORD は**渡さない**(#978)。公式イメージは PMA_USER が
      # 設定されていると auth_type を config に切り替え、ログイン画面を出さずに
      # MySQL へ接続済みのセッションを与える(/etc/phpmyadmin/config.inc.php)。
      # reverse-proxy は /phpmyadmin/ を無認証で中継するため、この組み合わせでは
      # URL に到達できる者が誰でも全DBを読み書きできてしまう。
      # 渡さなければ既定の auth_type: cookie に戻り、phpMyAdmin 自身のログインを経由する。
      # 運用者は .env の MYSQL_USER / MYSQL_PASSWORD を入力してログインする。
      # サブパス(/phpmyadmin/)配下でのリンク生成・リダイレクトを正しく行うために必須
      PMA_ABSOLUTE_URI: https://localhost/phpmyadmin/
    depends_on:
      - mysql

  # 認証基盤(ADR-0002, #559)。realm定義はGit管理された ./infra/keycloak/realm-export.json から
  # 起動時にimportする(--import-realm)。GUIでの手作業設定はしない。
  keycloak-postgres:
    logging: *default-logging
    image: postgres:15
    container_name: lbs-keycloak-postgres
    mem_limit: 256m
    <<: *common-service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    environment:
      TZ: UTC
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

  keycloak:
    logging: *default-logging
    image: "quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.2}"
    container_name: lbs-keycloak
    mem_limit: 1536m
    <<: *common-service
    command: ["start", "--import-realm"]
    environment:
      TZ: UTC
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # 初回起動時のみ有効。一度adminユーザーが作成された後は無視される
      # (パスワードローテーションはKeycloak管理コンソール側で行う)。
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # reverse-proxy配下の /auth/ サブパスで配信するため
      KC_HTTP_RELATIVE_PATH: /auth
      # 固定のissuer/公開URLを明示する(#560)。KC_HOSTNAME_STRICT=false +
      # X-Forwarded-*ヘッダ頼みの動的検出だと、gatewayがコンテナ間通信で
      # 直接keycloak:8080を叩いた際に issuer が http://keycloak/auth/... になり、
      # ブラウザ経由で発行されたトークンの iss (https://localhost/auth/...) と
      # 一致せずJWT検証が失敗する。ローカル開発のホスト名は固定(localhost)のため、
      # 固定URLで両経路の issuer を一致させる。
      KC_HOSTNAME: https://localhost/auth
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # realm-export.json の `${VAR:既定値}` が import 時にこの値を受け取る(#1551)。
      # setup.sh が .env に書いたランダム値と realm のクライアント secret を一致させる経路。
      # 既存の realm には効かない(--import-realm は既存 realm を上書きしない)。
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    # イメージにcurl/wgetが無いため、bashの/dev/tcpでヘルスチェックエンドポイント
    # (KC_HEALTH_ENABLEDが公開する管理ポート9000の/health/ready)を直接叩く。
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /auth/health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailcatch:
    environment:
      TZ: UTC
    logging: *default-logging
    image: sj26/mailcatcher:latest
    container_name: lbs-mailcatch
    mem_limit: 64m
    <<: *common-service
    expose:
      - '1025'
    ports:
      - "1080:1080"

  plantuml:
    environment:
      TZ: UTC
    logging: *default-logging
    image: plantuml/plantuml-server:jetty
    container_name: lbs-plantuml
    mem_limit: 1g
    # 既定の起動では作らない(#1741)。`COMPOSE_PROFILES=diagram` で draw.io とともに起動する。
    profiles: ["diagram"]
    <<: *common-service

  drawio:
    environment:
      TZ: UTC
    logging: *default-logging
    image: ${DRAWIO_IMAGE:-jgraph/drawio:latest}
    container_name: lbs-drawio
    mem_limit: 512m
    # 既定の起動では作らない(#1741)。`COMPOSE_PROFILES=diagram` で PlantUML とともに起動する。
    profiles: ["diagram"]
    <<: *common-service

  wordpress:
    logging: *default-logging
    build:
      context: ./infra/wordpress
      dockerfile: Dockerfile
    container_name: lbs-wordpress
    mem_limit: 1g
    <<: *common-service
    environment:
      TZ: UTC
      WP_PROVISION_TOKEN: ${WP_PROVISION_TOKEN}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress_sites:/var/www/html/sites
    depends_on:
      mysql:
        condition: service_healthy

networks:
  lbs-net:
    driver: bridge
  # docker-socket-proxyへの到達性をplatform-serviceのみに限定するための専用ネットワーク(issue #701、
  # Epic #551の方針)。docker-socket-proxyはこのネットワークにのみ参加し(lbs-netには参加しない)、
  # platformはlbs-netに加えてこちらにも参加することで両ネットワークへ到達できる。internal: trueに
  # より、このネットワーク単体では外部(インターネット)への出口も持たない。
  docker-socket-proxy-net:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  rabbitmq_data:
  keycloak_postgres:
  wordpress_sites:
  bulk_upload_files:
  generated_images:
  # issue #1241: アバター画像の専用ボリューム(identity-service)。
  avatar_images:
