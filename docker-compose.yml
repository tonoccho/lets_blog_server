services:
  reverse-proxy:
    image: nginx:alpine
    container_name: lbs-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - lbs-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: lbs-web
    restart: unless-stopped
    environment:
      # コンテナ間通信のためlbs-net内部でapiへ直接到達させる(自己署名証明書を経由しないため
      # NODE_EXTRA_CA_CERTSは不要)
      LETS_BLOG_API_URL: http://api:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # ブラウザから見える公開URL(認証コールバック等の生成に使用)
      NEXTAUTH_URL: https://localhost
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - lbs-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lbs-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@letsblog.example.com}
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL:-https://localhost}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      COMFYUI_BASE_URL: http://comfyui:8188
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-v1-5-pruned-emaonly.safetensors}
      COMFYUI_MODELS_PATH: /comfyui-models
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      PLANTUML_BASE_URL: http://plantuml:8080
      WORDPRESS_PROVISION_BASE_URL: http://wordpress:9000
      WP_PROVISION_TOKEN: ${WP_PROVISION_TOKEN}
      BACKUP_MYSQL_HOST: mysql
      BACKUP_MYSQL_PORT: "3306"
      BACKUP_MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_MYSQL_USER: ${MYSQL_USER}
      BACKUP_MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BULK_UPLOAD_STORAGE_PATH: /app/data/bulk-uploads
      GENERATED_IMAGES_STORAGE_PATH: /app/data/generated-images
      VSCODE_EXTENSION_SOURCE_PATH: /app/extension-src
      VSCODE_EXTENSION_BUILD_PATH: /app/extension-build
    volumes:
      - bulk_upload_files:/app/data/bulk-uploads
      - generated_images:/app/data/generated-images
      - comfyui_models:/comfyui-models
      # システム画面からのVSCode拡張機能ダウンロード用。オンデマンドビルドの作業ディレクトリは
      # コンテナ内の書き込み可能な場所(/app/extension-build)を使うため、ソースは読み取り専用でマウントする。
      - ./extension:/app/extension-src:ro
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - lbs-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lbs-mailhog
    restart: unless-stopped
    networks:
      - lbs-net

  mysql:
    image: mysql:8.0
    container_name: lbs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lbs-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lbs-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      # サブパス(/phpmyadmin/)配下でのリンク生成・リダイレクトを正しく行うために必須
      PMA_ABSOLUTE_URI: https://localhost/phpmyadmin/
    depends_on:
      - mysql
    networks:
      - lbs-net

  penpot_postgres:
    image: postgres:15-alpine
    container_name: lbs-penpot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot_user
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD}
    volumes:
      - penpot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lbs-net

  penpot:
    image: penpot/penpot:latest
    container_name: lbs-penpot
    restart: unless-stopped
    environment:
      PENPOT_POSTGRES_URI: "postgresql://penpot_user:${PENPOT_DB_PASSWORD}@penpot_postgres:5432/penpot"
      PENPOT_PUBLIC_URI: "https://localhost/penpot"
    depends_on:
      penpot_postgres:
        condition: service_healthy
    networks:
      - lbs-net

  ollama:
    image: ollama/ollama:latest
    container_name: lbs-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - lbs-net

  comfyui:
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu130-slim}
    container_name: lbs-comfyui
    restart: unless-stopped
    volumes:
      - comfyui_models:/root/ComfyUI/models
      - comfyui_output:/root/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - lbs-net

  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: lbs-plantuml
    restart: unless-stopped
    networks:
      - lbs-net

  mcp-penpot:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: lbs-mcp-penpot
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      MCP_PORT: 3000
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    depends_on:
      - ollama
    networks:
      - lbs-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    container_name: lbs-wordpress
    restart: unless-stopped
    environment:
      WP_PROVISION_TOKEN: ${WP_PROVISION_TOKEN}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress_sites:/var/www/html/sites
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lbs-net

networks:
  lbs-net:
    driver: bridge

volumes:
  mysql_data:
  penpot_postgres:
  ollama_models:
  comfyui_models:
  comfyui_output:
  wordpress_sites:
  bulk_upload_files:
  generated_images:
