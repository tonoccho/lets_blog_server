server:
  port: 8080

spring:
  application:
    name: gateway

# ログ時刻をJVM既定ゾーンに依存させずUTCに固定する(#1258)。Spring Bootの既定パターンは
# %d{<dateformat>} に展開されるので、末尾の ", UTC" がlogbackのタイムゾーン指定になる。
logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC"

# ルーティング(#560)。Spring Cloud Gatewayはこの環境のSpring Boot 4.1系と非互換のため
# (services/gateway/build.gradleのコメント参照)、独自のプロパティ構造(RouteProperties)
# として定義し、com.letsblog.gateway.config.ProxyHandler がWebClientで転送する。
#
# リストは先頭から順に評価され、最初にマッチしたルートが使われる
# (先勝ち。特定度の高いパスを先に置くこと)。
#
# issue #583でlegacy-apiを解体・削除し、フォールバック(未割り当てパスの暗黙転送先)も廃止した。
# どのルートにもマッチしないパスはgateway自身が404を返す(ProxyHandler#handle)。
# ルート表への載せ忘れが「たまたま動く / 別サービスの404として返る」形で隠れなくなる。
app:
  # 下流サービス名のDNS解決をキャッシュする上限秒数(issue #951)。
  # Reactor Netty の既定は DNS レコードの TTL(Docker の組み込みDNSは600秒)に従うため、
  # 複数サービスを同時再起動して IP が入れ替わると、gateway が古いIPを掴んだまま
  # **別のサービスへ転送し続ける**。GatewayRoutingConfig のコメント参照。
  dns-cache-ttl-seconds: ${GATEWAY_DNS_CACHE_TTL_SECONDS:10}
  gateway:
    # 既定は60秒(旧nginxの暗黙のproxy_read_timeoutと同等)。個別に長い処理が
    # 必要なルートはresponse-timeoutで上書きする(下記)。
    default-response-timeout: 60s
    routes:
      # 以下は、旧nginx設定で個別にタイムアウト延長していたエンドポイントの移設(#560)。
      # より広いプレフィックスにマッチする下のルートより先に評価されるよう、
      # 特定度の高いものを先に置く。
      #
      # プロジェクトのCRUD・環境紐付け・環境同期はproject-serviceへ移設した(issue #577 stage2)。
      # environments/syncはenvironmentsSyncのタイムアウト延長対象のためproject-serviceへの専用ルートを残す。
      - id: project-environment-sync
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/projects/*/environments/sync
        response-timeout: 300s
      # 一括管理(bulk-management: カテゴリ/タグ/プラグイン/テーマ/投稿の環境間比較・同期)を担う
      # BulkManagementService/TermComparisonService/PluginThemeComparisonService/PostComparisonServiceは
      # publishing-serviceへ移設した(issue #708、Epic #551 C6-2。#577移設時の発見: 元のこのルート
      # エントリはPROJECT_SERVICE_URIを指しており、実際のエンドポイント(/bulk-management/apply・
      # /apply-all・/categories/**等)をカバーしていなかった。実パスを網羅する/**へ修正した上で
      # まずLEGACY_API_URIへ固定し、#708でPUBLISHING_SERVICE_URIへ切り替えた)。
      - id: project-bulk-management
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/projects/*/bulk-management/**
        response-timeout: 300s
      # プロジェクトメンバー管理(ProjectUserSyncService)はidentity-serviceへ移設した
      # (issue #583。project_usersの所有権がidentity-serviceにあるため)。
      - id: project-users
        uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
        paths:
          - /api/projects/*/users/**
      # ComfyUI生成画像のアセットアップロード(BulkManagementService#uploadImageToAllEnvironments)は、
      # 一括管理機能一式のpublishing-serviceへの移設(issue #708)に伴い、呼び出し元の
      # BulkManagementControllerもpublishing-serviceへ移った。
      - id: project-asset-images
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/projects/*/asset-images/**
      # ProjectMediaGarbageCollectionControllerはmedia-serviceへ移設した(#573 stage3)が、パス自体は
      # /api/projects/**配下のまま(既存フロントのURLを変えないため)。より広い/api/projects/**
      # (下のprojectルート)より先に評価されるよう、ここに置く。
      - id: project-media-garbage-collection
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          - /api/projects/*/media-garbage-collection/scan
          - /api/projects/*/media-garbage-collection/delete
      # ProjectAiModelControllerを分割し、LLMモデル/プロバイダー選択(ProjectLlmModelController)を
      # ai-serviceへ移設した(issue #574)。パス自体は/api/projects/**配下のまま(既存フロントのURLを
      # 変えないため)。同じ/api/projects/{id}/ai-models/**配下でも、画像生成AI/ComfyUI部分
      # (ImageModelService/ComfyUiModelService、issue #583でmedia-serviceへ移設)より広い/api/projects/**
      # (下のprojectルート)より先にここでLLM部分だけをai-serviceへマッチさせる。
      - id: project-ai-models-llm
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/ai-models/llm/**
      # プロジェクト単位のOllama / ComfyUI接続先の上書き(ProjectConnectionController、issue #1503)は
      # ai-serviceが持つ(project_ai_settingsの所有者)。パスは/api/projects/*/ai-models/**配下なので、
      # 下のmedia向けproject-ai-models-imageより先にマッチさせる(欠けるとmediaに落ちて404になる)。
      - id: project-ai-models-connections
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/ai-models/connections
      # ProjectDashboardController(プロジェクトダッシュボードのGA/AdSenseレポート取得)は
      # analytics-serviceへ移設した(#578)。パス自体は/api/projects/**配下のまま(既存フロントのURLを
      # 変えないため)。より広い/api/projects/**(下のprojectルート)より先にここでマッチさせる
      # (project-ai-models-llmと同じパターン)。DashboardController(コンテナ状態SSE・接続サービス状態、
      # /api/dashboard/**配下でこれとはパスが異なる)は分析ではなくplatform-serviceへ移設された
      # (下のdashboard-statusルートのコメント参照、issue #695、C10-3)。
      - id: project-dashboard-analytics
        uri: ${ANALYTICS_SERVICE_URI:http://analytics:8080}
        paths:
          - /api/projects/*/dashboard/**
      # 画像生成AI/ComfyUI部分(ImageModelService/ComfyUiModelService、上のLLM部分を除く
      # /api/projects/*/ai-models/**の残り)はmedia-serviceへ移設した(issue #583)。
      # project_image_settingsとComfyUIチェックポイントの実体・インストールワーカーを
      # media-serviceが所有しているため。
      - id: project-ai-models-image
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          - /api/projects/*/ai-models/**
      # プロジェクト単位の資格情報(ProjectApiKeyController)は、issue #583で
      # 「ファサードごと1サービスへ移す」のではなく所有サービスへ分割した(ADR-0004のデータ所有権)。
      # パスは変えていないので、gatewayがサブパスごとに振り分ける。
      # より広い /api/projects/*/api-keys/** を最後に置き、載せ忘れが404で表面化するようにする。
      - id: project-api-keys-github-token
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/projects/*/api-keys/github-token
      - id: project-api-keys-brave-search
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/api-keys/brave-search-api-key
      # プロジェクト単位のChatGPT(OpenAI) APIキー(ProjectOpenAiApiKeyController、issue #1506)も
      # ai-serviceが持つ(project_ai_settingsの所有者)。欠けると下のanalytics向け
      # /api/projects/*/api-keys/** に落ちて404になる。
      - id: project-api-keys-openai
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/api-keys/openai-api-key
      # プロジェクト単位のClaude(Anthropic) APIキー(ProjectClaudeApiKeyController、issue #1507)も
      # ai-serviceが持つ。欠けると下のanalytics向け /api/projects/*/api-keys/** に落ちて404になる。
      - id: project-api-keys-claude
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/api-keys/claude-api-key
      - id: project-api-keys-analytics
        uri: ${ANALYTICS_SERVICE_URI:http://analytics:8080}
        paths:
          - /api/projects/*/api-keys/google-analytics
          # OAuth化(#1231)で client / oauth-callback / properties / property が増えた。
          # 完全一致だけでは404になる(#771と同型)ため、adsenseと同じく配下を通す。
          - /api/projects/*/api-keys/google-analytics/**
          - /api/projects/*/api-keys/adsense
          - /api/projects/*/api-keys/adsense/**
      # 画像生成プロンプトの生成(AiController#generateImagePrompt)はai-serviceへ移設した
      # (issue #583)。#583で画像生成本体はmedia-serviceへ移したが、こちらは
      # プロンプト文字列を作るだけの純粋なLLM機能なのでLLMの所有者であるai-serviceが持つ。
      # 専用ルートが無かった頃はより広い/api/projects/**(下のprojectルート)へ先勝ちでマッチし、
      # project-serviceに存在しないパスとして404になっていた(issue #771)。
      #
      # response-timeoutは下のaiルートと同じ180秒にする。同期のLLM呼び出しであり、
      # ai-service側のLLM_REQUEST_TIMEOUT_SECONDSは既定120秒。既定の60秒
      # (default-response-timeout)のままだと下流がまだ待っている最中にgatewayだけが504で切ってしまう。
      - id: project-ai-generate-image-prompt
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/ai/generate-image-prompt
        response-timeout: 180s
      # 多段レビュー(issue #1210)のステップ単位の指摘生成(issue #1213)。上の
      # project-ai-generate-image-promptと同じ理由(専用ルートが無いと下のprojectルートへ
      # 先勝ちマッチして404になる、issue #771と同型)で、同期のLLM呼び出しぶんタイムアウトも揃える。
      - id: project-ai-review-step-suggestions
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/ai/review-steps/*/suggestions
        response-timeout: 180s
      # プロジェクト単位の設定も issue #583 で所有サービスへ分割した。
      #   - cssSelectorPrefix(project_content_settings)→ content-service(#576で所有権移管済み。
      #     legacy-api側は素通しだった)
      #   - 画像生成系4本(project_image_settings)→ media-service
      # 専用ルートが無かった頃はprojectルートへ先勝ちマッチして404になっていた
      # (issue #771の調査で発見。apps/web/src/lib/apiClient.tsが実際に呼んでいる)。
      - id: project-content-settings
        uri: ${CONTENT_SERVICE_URI:http://content:8080}
        paths:
          - /api/projects/*/css-selector-prefix
          # 参照用(issue #913)。移設前はプロジェクト詳細が cssSelectorPrefix を含めて返していたが、
          # project-service の ProjectResponse は他サービス所有の設定を含まないため個別の口が要る。
          - /api/projects/*/content-settings
      - id: project-image-settings
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          - /api/projects/*/image-settings
          - /api/projects/*/image-generation-prompt-defaults
          - /api/projects/*/image-generation-size-defaults
          - /api/projects/*/article-image-resize-default
          - /api/projects/*/image-content-filter-settings
      # ProjectCustomTagController(プロジェクト詳細のカスタムタグ画面)はcontent-serviceへ移設した
      # (#576)。パス自体は/api/projects/**配下のまま(既存フロントのURLを変えないため)。より広い
      # /api/projects/**(下のprojectルート、project-service)より
      # 先にここでマッチさせる。
      - id: project-custom-tags
        uri: ${CONTENT_SERVICE_URI:http://content:8080}
        paths:
          - /api/projects/*/custom-tags/**
      # ArticlePreviewControllerのうち、記事本文のレンダリング(/render、CMSへの依存を持たない)のみ
      # content-serviceへ移設した(#576)。署名付きプレビューURLの発行(/signed-url、#1561)は
      # Site/CMSアダプタへの深い依存があるためpublishing-serviceが持つ(#712)。
      # 旧プレビュー経路(/theme-css・/skeleton・/preview-post)は#1564で削除したため、
      # /api/projects/*/preview/** の包括ルートも持たない(削除した3つのパスは404になる)。
      - id: project-preview-render
        uri: ${CONTENT_SERVICE_URI:http://content:8080}
        paths:
          - /api/projects/*/preview/render
      # より広い/api/projects/**(下のprojectルート)より先に評価されるよう、ここで固定する。
      - id: project-preview
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/projects/*/preview/signed-url
      # PostController#publish/#deleteは、投稿(posts)テーブルの所有権がcontent-serviceへ移った(#576)
      # 後もCMSアダプタ(CmsAdapter等)への深い依存のため、publishing-serviceへ移設した
      # (issue #707。PostPublishService/PostDeleteServiceはpostsテーブルの読み書きを
      # content-serviceへの内部ブリッジ経由で行う)。より広い/api/posts/**(下のcontentルート、
      # content-serviceへ向く)より先に評価されるよう、ここでpublishing-serviceへマッチさせる
      # (#576移設時点ではlegacy-apiへ向けていたが、issue #707でPUBLISHING_SERVICE_URIへ切り替えた)。
      - id: posts-publish
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/posts/publish
        response-timeout: 1200s
      - id: posts-delete
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/posts/*/*
      # DashboardController(コンテナ状態SSE・接続サービス状態、/api/dashboard/**配下)は
      # GA/AdSenseレポート(ProjectDashboardController、/api/projects/*/dashboard/**配下、
      # 上のanalyticsルート参照)とは別物で分析ドメインではない。C10(platform-service)へ移設された
      # (issue #695、C10-3)ため、非ストリーム系(service-status/service-status/detail/
      # container-status)・ストリーム系の両方をPLATFORM_SERVICE_URIへ向ける。下の広い
      # /api/dashboard/**(analyticsルート)より先にここでマッチさせる。
      #
      # ストリーム系エンドポイント(#560)は、ダッシュボードの常時接続ストリームのため応答自体は
      # すぐ返る(ボディはFlux<DataBuffer>として遅延ストリーミングされ、この
      # response-timeoutには縛られない。ProxyHandlerのJavadoc参照)。非ストリーム系はissue #695より前は
      # このルート表に専用エントリが無く、当時のfallback-uri(legacy-api)経由の暗黙到達に依存していた
      # (#695で明示ルートを追加した)。
      - id: dashboard-status
        uri: ${PLATFORM_SERVICE_URI:http://platform:8080}
        paths:
          - /api/dashboard/service-status
          - /api/dashboard/service-status/detail
          - /api/dashboard/service-status/stream
          - /api/dashboard/container-status
          - /api/dashboard/container-status/stream

      # ログイン・2FA・パスワードリセットは #566 でKeycloakへ全面移行し撤去済み。
      # /api/auth/ に残るのは初回セットアップ導線(setup-status・setup)の2本だけで、
      # issue #583 で users/roles の所有者である identity-service へ移設した。
      # この2本は identity-service 側でも PUBLIC_PATHS(未認証で到達可能)である
      # (まだ誰もログインできない状態で叩くため。ADR-0008 / #713)。
      - id: auth
        uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
        paths:
          - /api/auth/**
      # ユーザー/ロール管理は identity-service に移設した(#561)。
      # /api/project-users(全プロジェクトのメンバー割り当て一覧、Web管理画面のユーザー編集画面)は
      # issue #583 で identity-service へ移設した。#583以前は専用ルートが無く、廃止した
      # fallback-uri 経由で legacy-api に届いていた(ルート表に載せ忘れが隠れていた一例)。
      - id: identity
        uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
        paths:
          - /api/identity/**
          - /api/users/**
          - /api/roles/**
          - /api/project-users
      # SSH鍵ペア管理・組み込みタグのデザインカスタマイズをproject-serviceへ移設した(#577 stage 1)。
      # 当時、Project/Site本体(下のprojectルート)はまだlegacy-apiにあったため、この2つだけを
      # 先にproject-serviceへマッチさせる(より広い/api/projects/**より先に評価される必要がある)。
      # 元のこのルートエントリのpaths(/api/ssh-keys/**)は実際のSshKeyPairControllerの
      # @RequestMapping(/api/ssh-key-pairs)と一致していなかった(#577移設時の発見)ため、
      # 実パスに修正した上でこちらへ分離した。
      - id: project-ssh-key-pairs
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/ssh-key-pairs/**
      # タグデザインのAI生成(POST .../{tagType}/generate、issue #1410)。project-serviceが
      # ai-serviceの内部ブリッジ経由で同期にLLMを呼ぶ。上のproject-ai-generate-image-promptと同じ理由
      # (ai-service側のLLM_REQUEST_TIMEOUT_SECONDSは既定120秒なのに、既定の60秒だとgatewayだけが先に504)で
      # 180秒にする。tag-design-settings配下には一覧取得(GET)・保存(PUT)もあり、それらを巻き込まないよう
      # 生成のパスだけに絞り、下のproject-tag-design-settings / project-global-tag-design-settingsより
      # 先に評価させる(先勝ちなので順序が効く)。
      - id: project-tag-design-settings-generate
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/projects/*/tag-design-settings/*/generate
          - /api/tag-design-settings/*/generate
        response-timeout: 180s
      - id: project-tag-design-settings
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/projects/*/tag-design-settings/**
      # GlobalTagDesignSettingController(どのプロジェクトにも属さないグローバル既定、issue #763)。
      # projectIdがLongで束縛されているため/api/projects/global/...のようにプロジェクト配下へ
      # 寄せられず、独立したパスになっている。このルートが欠けていたため、#763のマージ時点から
      # 全リクエストが当時のfallback-uri(legacy-api)へ誤ルーティングされ404になっていた(issue #861)。
      - id: project-global-tag-design-settings
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/tag-design-settings/**
      # ArticlePlanController(記事プラン壁打ちチャット・セッション管理)はai-serviceへ移設済み
      # (issue #574)。パス自体は/api/projects/**配下のまま(既存フロントのURLを変えないため)。
      # より広い/api/projects/**(下のprojectルート)より先にここでマッチさせる
      # (project-ai-models-llmと同じパターン)。このルートが欠けていたため、記事プラン関連の
      # 全リクエストがprojectルートへ誤って先勝ちマッチし、project-serviceに存在しない
      # エンドポイントとして到達不能になっていた(issue #642のcontract testで検出)。
      - id: project-article-plan
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/article-plan/**
      # AiConnectionController(プロジェクトから見たAIプロバイダー4種の接続情報と利用可否、issue #1499)は
      # ai-serviceが持つ。パスは/api/projects/**配下のままなので、より広い/api/projects/**(下のprojectルート)
      # より先にここでマッチさせる(project-article-planと同じパターン。欠けると先勝ちでproject-serviceに
      # 落ちて404になる)。
      - id: project-ai-connections
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/projects/*/ai-connections
      # ArticleReviewController(レビュー待ちPRの一覧など、Epic #1333)はpublishing-serviceが持つ
      # (issue #1337)。パスは/api/projects/**配下のままなので、より広い/api/projects/**(下のproject
      # ルート)より先にここでマッチさせる。欠けると先勝ちでproject-serviceに落ちて404になる。
      - id: project-article-review
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/projects/*/article-review/**
      # LLM生成を伴う同期APIの専用ルート(issue #1410)。下流のai-serviceは
      # LLM_REQUEST_TIMEOUT_SECONDS(既定120秒)まで待つので、既定の60秒だとgatewayだけが先に504を返す。
      # /api/sites/**と/api/custom-tags/**は生成以外のCRUDも含む広いプレフィックスのため、プレフィックスごと
      # 延ばさず生成のパスだけを180秒にする(nginxのlocation /api/はproxy_read_timeout 1200sで範囲内)。
      #   - POST /api/sites/{siteId}/static-content/generate(SiteStaticContentController、project-service)
      #   - POST /api/custom-tags/generate(CustomTagController、content-service)
      # 下のproject / contentルートより先に評価させる。
      - id: project-site-static-content-generate
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/sites/*/static-content/generate
        response-timeout: 180s
      - id: content-custom-tags-generate
        uri: ${CONTENT_SERVICE_URI:http://content:8080}
        paths:
          - /api/custom-tags/generate
        response-timeout: 180s
      # Project/Site本体(CRUD・環境紐付け・CMS/WordPress自動プロビジョニング・サイト管理)を
      # project-serviceへ移設した(issue #577 stage2)。上記の、project-serviceへ移設していない
      # サブパス(bulk-management/users/asset-images/ai-models(LLM以外)/dashboard/api-keys/
      # article-plan)はより先に評価されるため、ここへは落ちてこない。
      # マネージドWordPressサイトの自動構築(POST /api/sites/managed-wordpress、issue #1480)。
      # 実測で最大240秒かかる(site-provisioning.feature の「@slow な理由」)ため、既定の60秒
      # (default-response-timeout)だと応答だけが504で切れ、構築は裏で完走してしまう
      # (再試行すると siteKey 重複で本当に失敗する)。実測240秒に余裕を見て300秒にする。
      # nginx の location /api/ は proxy_read_timeout 1200s なので、律速はこのgatewayで、
      # 300秒は nginx の範囲内(#1110 の再発なし)。一覧・疎通確認など短い /api/sites/** の
      # 操作を巻き込まないよう構築のパスだけに絞り、下のprojectルートより先に評価させる。
      - id: project-site-managed-wordpress
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/sites/managed-wordpress
        response-timeout: 300s
      # issue #1479: サイト自動構築を非同期ジョブとして受理する口(POST /api/sites/managed-wordpress/jobs)。
      # 上のproject-site-managed-wordpressは完全一致なのでこのパスは巻き込まれない。受理はジョブを
      # 1件作って即座に返すだけなので、構築本体用の長いresponse-timeoutは与えず既定値を使う
      # (#1405のai-image-jobsと同じ)。明示ルートにするのは、新パスをここで意図して受けていることを
      # 示し、下の汎用projectルートより前で固定するため(AiImageJobsRouteTest相当のテストあり)。
      - id: project-site-managed-wordpress-jobs
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/sites/managed-wordpress/jobs
      - id: project
        uri: ${PROJECT_SERVICE_URI:http://project:8080}
        paths:
          - /api/projects/**
          - /api/sites/**
      - id: content
        uri: ${CONTENT_SERVICE_URI:http://content:8080}
        paths:
          - /api/posts/**
          - /api/custom-tags/**
          # CustomTagTemplateController/ContentCacheController/MetadataControllerもcontent-serviceへ
          # 移設した(#576)。実際のマッピングは/api/custom-tag-templates/**・/api/content-cache/**・
          # /api/metadata/**であり、既存のこのルートエントリ(/api/posts/**・/api/custom-tags/**のみ)は
          # これらの実パスをカバーしていなかったため追加した(#573のGeneratedImageController発見と
          # 同じパターン)。
          - /api/custom-tag-templates/**
          - /api/content-cache/**
          - /api/metadata/**
      - id: media
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          # GeneratedImageControllerの実際のマッピングは/api/generated-images/**。
          # #573で移設した際、既存のルートエントリ(/api/images/**)が実パスをカバーして
          # いなかったため追加した。その /api/images/** 自体はどのコントローラにも対応せず
          # 残り続けていたので、issue #913 で削除した(#707 の /api/publish/** と同じ形の残骸)。
          - /api/generated-images/**
          - /api/diagrams/**
          # /api/render/** は載せない(issue #830)。PlantUML/Recharts/Penpotのレンダリングは
          # content-service・publishing-serviceのMediaRenderClientがapp.media-service-uriへ
          # コンテナ間で直接呼ぶ経路しか無く、web/extensionからの利用は無い。gatewayに載せると
          # 「有効なJWTさえあれば誰でも」外部から叩ける状態になり、特に
          # /api/render/penpot/design-file はサービスアカウントで共有Penpotにファイルを作れてしまう。
          # 認可はレンダリングを依頼する側(content-serviceのCustomTagController等)が担う。
          # MediaControllerの実際のマッピングは/api/media/**(#573 stage3でmedia-serviceへ移設)。
          - /api/media/**
      # 画像生成(#574でもai-serviceへ移設していなかった2本)はissue #583でmedia-serviceへ移設した。
      # media-serviceが生成画像・ComfyUIチェックポイントの実体・インストールワーカーを所有しており、
      # 生成だけが別サービスに残っている状態のほうが不自然なため。
      # /api/ai/**の大半(テキスト生成)はai-serviceなので、この2本だけを下の広い/api/ai/**より
      # 先にmedia-serviceへマッチさせる。
      #
      # response-timeoutは画像生成の実時間に合わせて延ばす。ComfyUI/ChatGPTの画像生成は
      # 既定の60秒(default-response-timeout)を超えうる。
      #
      # issue #1102で、生成(POST /api/ai/image)と参照(GET /api/ai/image-options)を
      # 別ルートに分けた。生成は1リクエストで batchSize(最大16)×batchCount(最大16)=256枚を
      # 同期で作りうる。
      #
      # response-timeout は「nginx >= gateway >= media の最悪ケース」という鎖の
      # 真ん中として決める。この鎖は自動テストが固定している
      # (media: ImageGenerationTimeoutChainTest / gateway: AiImageRouteTimeoutTest)。
      #
      #   media の最悪ケース  3308s = 300s(ポーリング以外: タグ提案LLM 180s + ジョブ2往復
      #                              + 最大256枚の取得・保存) + 16リピート × 188s
      #                              (ComfyUiClient のポーリング予算 60 + 8 × batchSize 秒)
      #   gateway            3400s  ← ここ
      #   nginx              3600s (infra/nginx/conf.d/default.conf の location = /api/ai/image)
      #
      # ポーリング予算 60 + 8 × batchSize 秒は実測から導いた。512×512・20ステップ・単一GPU
      # (lbs-ollama とGPUを共有)で 1枚3.8秒 / 4枚5.3秒 / 16枚17秒 / 32枚34秒であり、
      # この予算はどの batchSize でも実測の10倍以上になる(16枚で188秒 = 11.1倍)。
      #
      # #1102の当初実装はここが 18000s(5時間)だったが、実クライアントは必ず
      # reverse-proxy(nginx)を通り、nginx の location /api/ が proxy_read_timeout 1200s
      # で頭打ちにしていたため一度も効いていなかった(レビュー指摘)。gateway だけを
      # 伸ばしても意味が無いので、3層まとめて 3600s 以内へ揃えている。
      # gateway を nginx より少しだけ短くしてあるのは、先に gateway が 504 を返して
      # 相関IDつきのエラーになるようにするため。
      #
      # 打ち切られた場合でも、それまでに生成できた画像は generated_images に残り
      # ギャラリーには現れる。失われるのは応答だけ。
      #
      # 参照系の /api/ai/image-options に同じ長さを与えると、ComfyUIが無応答のときに
      # 接続を何時間も掴んだままになるため、こちらは従来の300sのままにする。
      - id: ai-image-options
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          - /api/ai/image-options
        response-timeout: 300s
      - id: ai-image
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          - /api/ai/image
        response-timeout: 3400s
      # issue #1405: 画像生成を非同期ジョブとして受理する口。/api/ai/** はai-service向けなので
      # 明示ルートが要る(先勝ちのため汎用のaiルートより前に置く)。受理はジョブを1件作って
      # 即座に返すだけなので、生成本体用の長いresponse-timeoutは与えず既定値を使う。
      # レート制限は upload-endpoint 枠に入れず api-global に置く
      # (RateLimitWebFilter#UPLOAD_BUCKET_EXACT_PATHS のJavadoc参照)。
      - id: ai-image-jobs
        uri: ${MEDIA_SERVICE_URI:http://media:8080}
        paths:
          - /api/ai/image/jobs
      # LLM呼び出しはLLM_REQUEST_TIMEOUT_SECONDS(既定120秒)まで掛かりうり、記事プランの壁打ちは
      # Web検索+LLM呼び出しでさらに長くなりうるため、既定の60秒(default-response-timeout)より
      # 長いタイムアウトを設定する(issue #574の受入基準)。AiGenerationClient/GenerationJobClientの
      # READ_TIMEOUT(180秒)と揃えている。
      - id: ai
        uri: ${AI_SERVICE_URI:http://ai:8080}
        paths:
          - /api/ai/**
          - /api/generation-jobs/**
          # /api/article-plan/** は載せない。ArticlePlanController の実パスは
          # /api/projects/*/article-plan/** で、上の project-article-plan ルートが担当する
          # (issue #659 で追加)。実体の無いエントリとして残っていたので issue #913 で削除した。
        response-timeout: 180s
      # このルートのpathsは元々`/api/publish/**`・`/api/bulk-management/**`だったが、実際のコントローラの
      # パス(PostController: /api/posts/publish・/api/posts/*/*、BulkManagementController:
      # /api/projects/*/bulk-management/**)と一致しておらず、`/api/publish/**`宛のリクエストは
      # どのコントローラにも到達できていなかった(issue #707調査で発見)。`/api/posts/publish`・
      # `/api/posts/*/*`は上のposts-publish/posts-deleteルートで既にPUBLISHING_SERVICE_URIへ
      # 正しくマッチしているため、`/api/publish/**`は実体の無い誤りとして削除した(issue #707)。
      # `/api/bulk-management/**`の実パス(/api/projects/*/bulk-management/**)は、上の
      # project-bulk-managementルート(response-timeout: 300sのタイムアウト延長付き)で
      # 既にPUBLISHING_SERVICE_URIへマッチしているため、ここへ重複させず削除した(issue #708)。
      # 代わりにTaxonomyController(/api/taxonomy/resolve)向けの明示ルートをここに追加する
      # (以前はfallback-uri経由の暗黙到達に依存していた)。
      - id: publishing
        uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
        paths:
          - /api/taxonomy/resolve
      # analytics-service へのルートは、実体のあるパスだけを上に置いてある。
      #   - /api/projects/*/dashboard/**            (project-dashboard-analytics)
      #   - /api/projects/*/api-keys/{google-analytics,adsense}  (project-api-keys-analytics、#583。google-analytics は #1231 で配下も通す)
      # かつて /api/analytics/** を「将来直接公開する場合に備えて」置いていたが、対応する
      # コントローラは無く、叩けば analytics-service が404を返すだけだった。実体の無いルートは
      # 「ルート表にあるから届くはず」という誤解を生むので issue #913 で削除した。
      # 直接公開するコントローラを足す時点でルートも足せばよい。
      #
      # /api/dashboard/**(DashboardController、コンテナ状態SSE・接続サービス状態)は分析ドメイン
      # ではないため含めない(上のdashboard-statusルート。platform-serviceへ明示ルーティング、#695)。
      # response-timeoutは、このルートに同居するVscodeExtensionController(VSCode拡張の
      # .vsixオンデマンドビルド配布、issue #696、C10-4)のビルド時間に合わせて上書きする
      # (issue #1190、症状B)。2026-09-19のリリース検証(develop f261d2bd、run
      # 20260919T204741Z-2375325)の実測で、npm ci → npm run compile → npx vsce package の
      # 1回のビルドは47〜53秒かかっており、既定の60秒(default-response-timeout)は1回分
      # だけでも既に際どい。以前はbuildLockでビルド全体を直列化するだけだったため、
      # 2並列が直列に走ると100秒近くに達し確実に504になっていた。#1190で後続リクエストを
      # 進行中のビルドに合流させるようにしたため、複数並列でも待ち時間は1回分のビルド時間
      # で済むが、npmキャッシュが冷えている等の遅い環境にも耐えられるよう、実測の最大値
      # (53秒)に3倍弱の余裕を持たせた180秒にする(下の ai系ルートと同じ180秒。理由も
      # 同型: 同期的に完了を待つ処理であり、既定の60秒のままだと下流がまだビルドしている
      # 最中にgatewayだけが504で切ってしまう)。前段のnginx(location /api/、
      # proxy_read_timeout 1200s)がこの180秒を頭打ちにすることは無い。
      - id: platform
        uri: ${PLATFORM_SERVICE_URI:http://platform:8080}
        paths:
          # VscodeExtensionController(VSCode拡張の.vsixオンデマンドビルド配布、issue #696、C10-4)は
          # /api/system/vscode-extension配下にあり、この/api/system/**に含まれる。以前ここにあった
          # /api/vscode-extension/**という別パターンは実際のコントローラーパス(/api/system/
          # vscode-extension)と一致せず一度もマッチしないルールだったため、#696で撤去した。
          - /api/system/**
          - /api/backup/**
          # プロジェクト/サイトに紐付かないアプリ全体のグローバル設定(SystemSettingController/
          # AppSettingController)の所有権をplatform-serviceへ移管した(issue #693)。
          - /api/system-settings/**
        response-timeout: 180s
      # ログ読み取り・記録APIはlog-writerへ移設した(#572)。
      - id: log
        uri: ${LOG_SERVICE_URI:http://log-writer:8080}
        paths:
          - /api/logs/**
          - /api/audit-logs/**
          - /api/operation-logs/**
  # レート制限(legacy-api時代のRateLimitInterceptorから移設。#560)。
  # 管理画面からのアップロード系エンドポイント制限値の動的変更(旧AppSettingService経由)は
  # gatewayがDBを持たないため未対応(静的デフォルト値のみ)。follow-up issueで再検討する。
  #
  # api-global / api-internal はクライアント単位に分割される(#749)。分割キーの決め方と、
  # auth/upload/operation-logを従来どおりプロセス全体の1バケットに据え置いた理由は
  # com.letsblog.gateway.config.RateLimitWebFilter のJavadoc、および
  # docs/API_RATE_LIMITING.md を参照。
  rate-limit:
    # 外部(reverse-proxy経由)クライアント1つ(=X-Forwarded-For末尾のIP)あたりの上限。
    # #749より前は「プロセス全体で100req/分」だったが、値は据え置いたまま単位だけを
    # クライアント単位に変更した(ブラウザ発の直接呼び出しは実測ピークでも54req/分)。
    api-global:
      limit-for-period: ${API_RATE_LIMIT_REQUESTS:100}
      limit-refresh-period: ${API_RATE_LIMIT_PERIOD:60s}
    # lbs-net内部からgatewayを直接叩く呼び出し(WebのBFF)のログインユーザー1人あたりの上限(#749)。
    # 管理画面の1画面あたりのBFF呼び出しは最大12本程度、実測のピーク需要は239req/分(E2E実行時)
    # だったため、その2.5倍を既定値とする(暴走ループは引き続き頭打ちになる)。
    api-internal:
      limit-for-period: ${INTERNAL_API_RATE_LIMIT_REQUESTS:600}
      limit-refresh-period: ${INTERNAL_API_RATE_LIMIT_PERIOD:60s}
    auth-endpoint:
      limit-for-period: ${AUTH_RATE_LIMIT_REQUESTS:5}
      limit-refresh-period: ${AUTH_RATE_LIMIT_PERIOD:60s}
    operation-log-endpoint:
      limit-for-period: ${OPERATION_LOG_RATE_LIMIT_REQUESTS:300}
      limit-refresh-period: ${OPERATION_LOG_RATE_LIMIT_PERIOD:60s}
    upload-endpoint:
      limit-for-period: ${UPLOAD_RATE_LIMIT_REQUESTS:10}
      limit-refresh-period: ${UPLOAD_RATE_LIMIT_PERIOD:3600s}

# JWT検証(#560)。jwk-set-uriはコンテナ間通信で実際に到達可能な内部アドレス、
# issuerはブラウザ経由で発行されるトークンのiss claim(#559でKC_HOSTNAME固定済みの
# 公開URL)。この2つが異なる(内部アドレス経由でもissは常に公開URL値になる)ため、
# Spring Bootの spring.security.oauth2.resourceserver.jwt.issuer-uri
# (フェッチ先とissuerの一致を前提とする自動設定)は使えず、
# com.letsblog.gateway.config.JwtDecoderConfig で個別にJwtDecoderを組み立てている。
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}

management:
  # issue #1470: http.server.requests の p95 / p99 をActuatorから読めるようにする。
  # 読み方: GET /actuator/metrics/http.server.requests.percentile?tag=phi:0.95 (phi:0.99)。
  # percentiles-histogram はPrometheus用のバケットを出すだけでActuatorのp95/p99にはならないので使わない。
  # クライアント側計算のパーセンタイルはこのメーターだけに絞る(全メーターへ広げるとメモリを食う)。
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        # issue #589: health に加えて info / metrics も公開する。
        # 認証ゲート(ADR-0008)の PUBLIC_PATHS に /actuator/** が入っているため、
        # 秘匿情報を含みうるエンドポイント(env / configprops / heapdump 等)は公開しない。
        include: health,info,metrics
  endpoint:
    health:
      # 下流サービスの状態を/actuator/healthに集約する(#560)。probeの定義は
      # DownstreamHealthConfig にあり、#743 で services/ 配下の全10サービス
      # (gatewayを除く)が揃った。DownstreamHealthConfigContractTest が
      # ディレクトリを列挙して網羅性を検証するので、サービス追加時の漏れは検出できる。
      #
      # 注意: いずれか1つでもDOWNならgateway自身の /actuator/health もDOWNになり、
      # コンテナのhealthcheckが失敗する。一部のサービスだけ起動する開発・検証時には
      # gatewayがunhealthy表示になるが、gatewayのhealthyを service_healthy で
      # 待っているコンテナは無いため起動順序には影響しない。
      show-details: always
