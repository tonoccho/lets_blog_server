server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.content: DEBUG
  # 標準出力は1行1JSON(Spring Bootの構造化ログ、logstash形式)にする(#1729)。相関ID
  # (issue #582、com.letsblog.common.web.CorrelationIdFilter)はMDCのキー correlationId のまま
  # JSONの項目として出る。時刻は@timestamp(ゾーンはcomposeのTZ=UTC)。
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

management:
  # issue #1470: http.server.requests の p95 / p99 をActuatorから読めるようにする。
  # 読み方: GET /actuator/metrics/http.server.requests.percentile?tag=phi:0.95 (phi:0.99)。
  # percentiles-histogram はPrometheus用のバケットを出すだけでActuatorのp95/p99にはならないので使わない。
  # クライアント側計算のパーセンタイルはこのメーターだけに絞る(全メーターへ広げるとメモリを食う)。
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        # issue #589: health に加えて info / metrics も公開する。
        # 認証ゲート(ADR-0008)の PUBLIC_PATHS に /actuator/** が入っているため、
        # 秘匿情報を含みうるエンドポイント(env / configprops / heapdump 等)は公開しない。
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # log-writer(#572)/media-service(#573)/ai-service(#574)と同じ理由: 明示的なproducesを持たない
  # エンドポイントがOpenAPI上`*/*`として記録されると、orvalが生成するTypeScriptクライアントの
  # 型付けが崩れる。既定の応答Content-Typeを明示することでこれを避ける。
  default-produces-media-type: application/json

spring:
  application:
    name: lets-blog-content
  # バナーはJSONでない行になるので出さない(#1729)。
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    # issue #1095: mysqlコンテナ再作成後も再起動なしで自力回復できるよう、ai-serviceの
    # application.ymlと同じ理由でconnectTimeout/socketTimeoutを設定する。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbs_content?useSSL=false&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_content}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_content}
    hikari:
      # issue #1095: ai-serviceのapplication.ymlと同じ理由で、プール枯渇時にヘルスチェックを
      # 含む全呼び出しがsocketTimeoutの自力回復を待たず早く失敗するようconnection-timeoutを縮める。
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # posts/custom_tags/custom_tag_templates/content_cache/project_content_settingsのスキーマ所有権を
  # content-serviceへ移管した(#576)。専用スキーマ(lbs_content、ADR-0004)なので、legacy-api側の
  # V1〜とは無関係の独立したマイグレーション履歴としてV1から開始する。既存データの移行は
  # scripts/migrate-content-tables-to-lbs-content.sqlを参照(V1適用後に実行する運用)。
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # issue #1390: project-service(#1388)で確定した経路の横展開。RabbitMQ停止直後、JVMの
    # 名前解決キャッシュ(既定30秒)が古いIPを生かしている間に接続を試みると、未設定時の既定
    # (RabbitMQ Javaクライアント既定の60秒)いっぱいCachingConnectionFactoryの接続確立ロックを
    # 握ったまま止まり、gatewayの応答時間と競合して504になる。AuditLogServiceがrabbitTemplate
    # .convertAndSendをHTTPリクエストスレッド上で同期的に呼び、失敗はAmqpExceptionとしてcatch
    # するだけの設計(監査ログの喪失は許容範囲)なので、接続確立自体をgatewayの応答時間より
    # 十分短く諦めさせればよい。本サービスの内部クライアント(IdentityBridgeClient/
    # ProjectBridgeClient、いずれもCONNECT_TIMEOUT = Duration.ofSeconds(3))と同じ3秒の慣例に合わせる。
    connection-timeout: 3s
    # letsblog.eventsコンシューマー(EventMessageListener)のリトライ→DLQポリシー(issue #580)。
    # 3回まで再試行(1秒→2秒→4秒のバックオフ)し、それでも失敗したメッセージはrequeueされず
    # (default-requeue-rejected: false)、各キューのx-dead-letter-exchange設定によりletsblog.events.dlx
    # 経由でDLQへ配送される(RabbitMqConfig参照)。
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

app:
  # issue #583でlegacy-apiを解体し、それまで legacy-api の ContentBridgeController を素通しして
  # いた経路を所有サービスへ直接向けた(素通しだったのは、所有権が #577 stage1/stage2 で既に
  # project-service へ移っていたため)。
  #   - projects / sites / tag_design_settings、アクセス可能サイトID(ProjectBridgeClient)
  #     → project-service
  #   - project_users のメンバー判定、roles(IdentityBridgeClient)→ identity-service
  project-service-uri: ${PROJECT_SERVICE_URI:http://project:8080}
  identity-service-uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
  # 組み込みタグ展開時のPlantUML/Rechartsダイアグラム描画はmedia-serviceへ同期呼び出しする
  # (issueの注記。Playwrightを持つのはcontent-serviceになったが、実際のレンダリング処理自体は
  # 引き続きmedia-serviceに委譲する。legacy-api/media-serviceのMediaRenderClientと同じ構成)。
  media-service-uri: ${MEDIA_SERVICE_URI:http://media:8080}
  # CustomTagGenerationService(カスタムタグのAI生成)/TagDesignGenerationService相当の呼び出し先。
  # 既定値を http://ai:8080 にしている理由(issue #825 / #1484): 撤去済みのlegacy-api(http://api:8080)を
  # 指したままだと、環境変数未設定時に呼び出しが静かに失敗する(#825で実際に起きた事象。#827により
  # 宛先URLがログに出ないため原因の切り分けも難しい)。log-writerのapplication.ymlと同じ宛先に揃えている。
  ai-service-uri: ${AI_SERVICE_URI:http://ai:8080}
  # [blogcard]/[amazon]組み込みタグ向けスクレイピング結果のキャッシュTTL。legacy-apiの既定値と同じ。
  content-cache-ttl-hours: ${CONTENT_CACHE_TTL_HOURS:24}

# KeycloakのJWT検証。identity-service/log-writer/media-service/ai-serviceのSecurityConfig/
# JwtDecoderConfigと同じ理由により、issuer-uriによる自動設定は使わずJWKS取得先と期待issuerを
# 個別に指定して組み立てている。
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}
  # サービス間のClient Credentials認証(#567)。カスタムタグ生成ジョブ(issue #1409)の完了・失敗をai-serviceの
  # 内部ブリッジへ反映するときと、リクエストの無い非同期スレッドからai-serviceのLLM生成を呼ぶときに、
  # このサービス自身のトークンを使う(#1083。ユーザーのBearerは数分で失効する)。ServiceTokenClientConfig参照。
  admin:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_SERVICES_CLIENT_ID:letsblog-services}
    client-secret: ${KEYCLOAK_SERVICES_CLIENT_SECRET:}
