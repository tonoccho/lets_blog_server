server:
  port: 8080

spring:
  application:
    name: lets-blog-content
  datasource:
    # legacy-api(services/legacy-api/src/test/resources/application-test.yml)と同じ方式(ADR-0006:
    # Testcontainersは使わず実MySQLに接続する)。ローカルではリポジトリのdocker-compose MySQL
    # コンテナに対して、専用のlbs_content_testスキーマ(lets_blog_testと同じtest_user/test_pass)を
    # 使う。lbs_contentスキーマ(実データ)には接続しない。
    url: jdbc:mysql://localhost:3306/lbs_content_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  project-service-uri: http://localhost:19999
  identity-service-uri: http://localhost:19999
  media-service-uri: http://localhost:19999
  ai-service-uri: http://localhost:19999
  content-cache-ttl-hours: 24

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
  # カスタムタグ生成ジョブ(issue #1409)の終端通知用のClient Credentials(ServiceTokenClientConfig)。
  admin:
    token-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/token
    client-id: letsblog-services
    client-secret: test-secret
