server:
  port: 8080

spring:
  application:
    name: identity
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。専用のlbs_identity_testスキーマを使い、
    # 本番相当のlets_blogスキーマ(実データ。identity-serviceは現状legacy-apiと同じ物理スキーマを
    # 参照している。issue #786参照)には接続しない。
    # スキーマはmysql/init/02-create-test-schemas.shが作成する(issue #772)。
    url: jdbc:mysql://localhost:3306/lbs_identity_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 本サービスはFlywayを持たない(users/roles等の移行管理はlegacy-api側が担う。
      # application.ymlのコメント参照)。そのためテストでは空スキーマに対して
      # エンティティ定義からテーブルを生成する。本番のddl-auto: validateは変更しない。
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
  admin:
    token-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/token
    admin-base-uri: http://localhost:19999/auth/admin/realms/letsblog
    client-id: letsblog-services
    client-secret: test-secret
