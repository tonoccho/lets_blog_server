server:
  port: 8080

spring:
  application:
    name: identity
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。専用のlbs_identity_testスキーマを使い、
    # 本番相当のlbs_identityスキーマ(実データ。issue #786で専用スキーマへ分離済み)には
    # 接続しない。
    # スキーマはinfra/mysql/init/02-create-test-schemas.shが作成する(issue #772)。
    url: jdbc:mysql://localhost:3306/lbs_identity_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # issue #914: 他の8サービスと揃えて Flyway + validate にした。
      # #786 以降、本番のスキーマは db/migration/V1 が作るのに、テストだけが
      # create-drop でエンティティ定義から生成していたため、マイグレーションと
      # エンティティの食い違いをテストで検出できなかった。#886(Flyway依存の追加漏れで
      # 「missing table [role_permissions]」で起動失敗)は、まさにこの穴を通り抜けた不具合である。
      # validate にすると、食い違った時点で context load が落ちて気付ける。
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
  admin:
    token-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/token
    admin-base-uri: http://localhost:19999/auth/admin/realms/letsblog
    client-id: letsblog-services
    client-secret: test-secret
