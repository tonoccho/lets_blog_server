server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.identity: DEBUG
  # 標準出力は1行1JSON(Spring Bootの構造化ログ、logstash形式)にする(#1729)。相関ID
  # (issue #582、com.letsblog.common.web.CorrelationIdFilter)はMDCのキー correlationId のまま
  # JSONの項目として出る。時刻は@timestamp(ゾーンはcomposeのTZ=UTC)。
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

management:
  # issue #1470: http.server.requests の p95 / p99 をActuatorから読めるようにする。
  # 読み方: GET /actuator/metrics/http.server.requests.percentile?tag=phi:0.95 (phi:0.99)。
  # percentiles-histogram はPrometheus用のバケットを出すだけでActuatorのp95/p99にはならないので使わない。
  # クライアント側計算のパーセンタイルはこのメーターだけに絞る(全メーターへ広げるとメモリを食う)。
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        # issue #589: health に加えて info / metrics も公開する。
        # 認証ゲート(ADR-0008)の PUBLIC_PATHS に /actuator/** が入っているため、
        # 秘匿情報を含みうるエンドポイント(env / configprops / heapdump 等)は公開しない。
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # log-writer(#572)/media-service(#573)/ai-service(#574)/content-service(#576)等と同じ理由:
  # 明示的なproducesを持たないエンドポイントがOpenAPI上`*/*`として記録されると、orvalが生成する
  # TypeScriptクライアントの型付けが崩れる(res.json()ではなくres.text()を生成し、宣言した
  # レスポンス型と一致しなくなる)。既定の応答Content-Typeを明示することでこれを避ける。
  # 本サービスだけこの設定が漏れており、生成クライアントに型エラーが出ていた(issue #739)。
  default-produces-media-type: application/json

spring:
  application:
    name: identity
  # バナーはJSONでない行になるので出さない(#1729)。
  main:
    banner-mode: "off"
  # issue #1241: アバターアップロード(POST /api/users/{id}/avatar)。未設定だとSpring Bootの
  # 既定1MBが黙って効いてしまう(#1061と同種の失敗)ため、要件通り20MBを明示する。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # ユーザー/ロール管理を扱う(#561)。#786で専用スキーマlbs_identityへ分離済み(ADR-0004)。
  # #583でproject_users/user_site_authorsの所有権も移ってきたため、lbs_identityが持つのは
  # users / roles / role_permissions / user_roles / project_users / user_site_authors の6テーブル。
  # スキーマの管理は下のFlyway(db/migration/V1__create_identity_tables.sql)が行う。
  datasource:
    # issue #1095: mysqlコンテナ再作成後も再起動なしで自力回復できるよう、ai-serviceの
    # application.ymlと同じ理由でconnectTimeout/socketTimeoutを設定する。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbs_identity?useSSL=false&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_identity}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_identity}
    hikari:
      # issue #1095: ai-serviceのapplication.ymlと同じ理由で、プール枯渇時にヘルスチェックを
      # 含む全呼び出しがsocketTimeoutの自力回復を待たず早く失敗するようconnection-timeoutを縮める。
      connection-timeout: 10000
  # issue #786: 専用スキーマlbs_identityを自身のFlywayで管理する(ADR-0004)。
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # user.deactivatedドメインイベント発行(letsblog.events、issue #580)。発行側にはリトライ/DLQ設定は
  # 不要(コンシューマー側の設定はcontent-service等を参照)。購読するproject.environment-bound
  # (issue #1324)のリトライ設定はlistener.simple.retry。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # issue #1390: project-service(#1388)で確定した経路の横展開。RabbitMQ停止直後、JVMの
    # 名前解決キャッシュ(既定30秒)が古いIPを生かしている間に接続を試みると、未設定時の既定
    # (RabbitMQ Javaクライアント既定の60秒)いっぱいCachingConnectionFactoryの接続確立ロックを
    # 握ったまま止まり、gatewayの応答時間と競合して504になる。AuditLogService/
    # DomainEventPublisherがrabbitTemplate.convertAndSendをHTTPリクエストスレッド上で同期的に
    # 呼び、失敗はAmqpExceptionとしてcatchするだけの設計なので、接続確立自体をgatewayの応答時間
    # より十分短く諦めさせればよい。本サービスの内部クライアント(PublishingServiceClient/
    # ProjectServiceClient、いずれもCONNECT_TIMEOUT = Duration.ofSeconds(3))と同じ3秒の慣例に合わせる。
    connection-timeout: 3s
    # project.environment-boundコンシューマー(EventMessageListener、issue #1324)のリトライ→DLQ
    # ポリシー。analytics/content-serviceと同じ設定(docs/EVENT_DRIVEN_ARCHITECTURE.md参照)。
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2.0

# GitHubトークンの暗号化(user.githubTokenEncrypted)に使う。legacy-apiと同じ物理カラムを
# 参照するため、legacy-apiと同一のAPP_ENCRYPTION_KEYを共有する必要がある。
app:
  encryption-key: ${APP_ENCRYPTION_KEY:}
  # issue #1241: アバター画像(512x512 JPEG)の保存先。media-serviceのgenerated-images-storage-path
  # と同じ考え方の、identity-service専用ボリューム。
  avatar-storage-path: ${AVATAR_STORAGE_PATH:/app/data/avatars}
  # issue #583: project_users/user_site_authors の所有権がidentity-serviceへ移ったのに伴い、
  # ProjectUserSyncService がプロジェクト/サイトの照会(project-service)と、
  # WordPress側ユーザーの作成・更新(publishing-service)を内部ブリッジ経由で行う。
  project-service-uri: ${PROJECT_SERVICE_URI:http://project:8080}
  publishing-service-uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}

# Keycloakユーザー同期(#562)。letsblog-services(#560で定義済みのサービス間通信用confidentialクライアント)
# のクライアントクレデンシャルズグラントでKeycloak Admin REST APIを呼び出す。事前にrealm側で
# このクライアントのサービスアカウントにrealm-management#manage-usersロールを付与しておく必要がある
# (infra/keycloak/realm-export.json参照)。token-uri/admin-base-uriはコンテナ間通信で到達可能な内部アドレス
# (gatewayのkeycloak.jwk-set-uriと同様の考え方。services/gateway/src/main/resources/application.yml参照)。
keycloak:
  admin:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/token}
    admin-base-uri: ${KEYCLOAK_ADMIN_BASE_URI:http://keycloak:8080/auth/admin/realms/letsblog}
    client-id: ${KEYCLOAK_SERVICES_CLIENT_ID:letsblog-services}
    client-secret: ${KEYCLOAK_SERVICES_CLIENT_SECRET:}
  # KeycloakのJWT検証(#563)。gatewayを経由しない直接アクセスに対しても、Bearerトークンが
  # 付与されていれば独立して検証する(gatewayのbypassを許さない)。jwk-set-uri/issuerの
  # 意味はservices/gateway/src/main/resources/application.ymlのコメント参照。
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}
