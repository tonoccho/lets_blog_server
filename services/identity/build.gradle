// identity-service (#561): ユーザー・ロール・権限管理。
// スキーマ分離(lbs_identity)により他サービスから独立する。
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
}

dependencies {
    implementation project(':packages:lbs-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // issue #583: ProjectUserSyncService が project-service / publishing-service の内部ブリッジを
    // RestClient で呼ぶ。RestClient.Builder の自動設定はこのスターターが提供する
    // (media/project 等の他サービスと同じ依存)。
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // user.deactivatedドメインイベント発行(letsblog.events、issue #580)。プロデューサー側のみを
    // 担うため、コンシューマー側(spring-retry等)は不要。
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // issue #1242: AuditLogServiceがcom.fasterxml.jackson.databind.ObjectMapperを直接使うため
    // 明示的に追加する(Boot 4の既定JSONコンバータ・既定ObjectMapperはJackson3系(tools.jackson)に
    // 変わったため。project/media/ai/content-serviceと同じ構成。services/project/build.gradle参照)。
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'com.mysql:mysql-connector-j'
    // issue #786で専用スキーマlbs_identityをFlywayで管理するようにしたが、依存の追加が漏れていた。
    // application.ymlにflyway.enabled: trueとdb/migration/V1があってもライブラリが無ければ何も起きず、
    // ddl-auto: validateが「missing table [role_permissions]」で起動失敗する(issue #886で修正)。
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // @AutoConfigureMockMvc(AuthorizationMatrixIntegrationTest、issue #772)。他サービスと同じ依存。
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // JWTを必要とするテストの共通フィクスチャ(#587)。
    testImplementation testFixtures(project(':packages:lbs-common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
