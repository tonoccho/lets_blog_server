server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.media: DEBUG
  # 相関ID(issue #582、com.letsblog.common.web.CorrelationIdFilter)をログ行に含める。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # issue #589: health に加えて info / metrics も公開する。
        # 認証ゲート(ADR-0008)の PUBLIC_PATHS に /actuator/** が入っているため、
        # 秘匿情報を含みうるエンドポイント(env / configprops / heapdump 等)は公開しない。
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # log-writer(#572)と同じ理由: 明示的なproducesを持たないエンドポイントがOpenAPI上`*/*`として
  # 記録されると、orvalが生成するTypeScriptクライアントの型付けが崩れる。既定の応答Content-Typeを
  # 明示することでこれを避ける。
  default-produces-media-type: application/json

spring:
  application:
    name: lets-blog-media
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbs_media?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_media}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_media}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # generated_images/generated_image_sequences/diagrams/project_image_settingsのスキーマ所有権を
  # media-serviceへ移管した(#573)。専用スキーマ(lbs_media、ADR-0004)なので、legacy-api側の
  # V1〜とは無関係の独立したマイグレーション履歴としてV1から開始する。既存データの移行は
  # scripts/migrate-media-tables-to-lbs-media.sqlを参照(V1適用後に実行する運用)。
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# ComfyUI/PlantUML/Penpotへの接続情報。legacy-apiのapplication.ymlから該当プロパティをそのまま
# 移設した(#573)。stage1時点ではRenderController(PlantUML/Recharts/Penpot)のみが実際にこれらを
# 使う。ComfyUI関連プロパティ自体はstage2(ComfyUiModelService移設)まで未使用だが、legacy-api側の
# 既定値と揃えておく。
app:
  comfyui-base-url: ${COMFYUI_BASE_URL:http://localhost:8188}
  comfyui-checkpoint: ${COMFYUI_CHECKPOINT:v1-5-pruned-emaonly.safetensors}
  comfyui-models-path: ${COMFYUI_MODELS_PATH:/app/data/comfyui-models}
  plantuml-base-url: ${PLANTUML_BASE_URL:http://localhost:8085}
  penpot-base-url: ${PENPOT_BASE_URL:http://localhost:9001}
  penpot-public-url: ${PENPOT_PUBLIC_URL:http://localhost:9001}
  penpot-service-email: ${PENPOT_SERVICE_EMAIL:lbs-service@letsblog.local}
  penpot-service-password: ${PENPOT_SERVICE_PASSWORD:}
  generated-images-storage-path: ${GENERATED_IMAGES_STORAGE_PATH:/app/data/generated-images}
  # 画像生成のアプリ全体の既定値(issue #583でlegacy-apiから移設)。プロジェクト単位の上書きが
  # 無い場合にProjectImageDefaultsResolverが使う。環境変数名は移設前と同じものを引き継いでいる。
  default-negative-prompt: ${DEFAULT_NEGATIVE_PROMPT:low quality, blurry, watermark, text}
  default-quality-prompt: ${DEFAULT_QUALITY_PROMPT:high quality, highly detailed, sharp focus, masterpiece}
  default-generated-image-width: ${DEFAULT_GENERATED_IMAGE_WIDTH:1920}
  default-generated-image-height: ${DEFAULT_GENERATED_IMAGE_HEIGHT:1080}
  default-article-image-long-edge-px: ${DEFAULT_ARTICLE_IMAGE_LONG_EDGE_PX:1300}
  default-block-sexual-content: ${DEFAULT_BLOCK_SEXUAL_CONTENT:true}
  default-block-violent-content: ${DEFAULT_BLOCK_VIOLENT_CONTENT:true}
  default-block-discriminatory-content: ${DEFAULT_BLOCK_DISCRIMINATORY_CONTENT:true}
  # メディアガベージコレクションのCMSブリッジ(/api/internal/publishing/**、CmsBridgeClient参照)の
  # 呼び出し先。#573 stage3ではlegacy-apiが所有していたためlegacy-api-uriを使っていたが、
  # issue #709でCmsMediaBridgeControllerの所有権がpublishing-serviceへ移ったため、
  # CmsBridgeClientの向き先をこちらへ切り替え、パスも/api/internal/cms/**から
  # /api/internal/publishing/**へ変更した(Epic #551 C6-3)。
  publishing-service-uri: ${PUBLISHING_SERVICE_URI:http://publishing:8080}
  # ComfyUIチェックポイントのダウンロード/削除ジョブ(GenerationJob)の進捗反映先。#573 stage2では
  # legacy-apiが所有していたためlegacy-api-uriを共用していたが、issue #574でgeneration_jobsの
  # 所有権がai-serviceへ移ったため、GenerationJobClientの向き先をこちらへ切り替えた。
  ai-service-uri: ${AI_SERVICE_URI:http://api:8080}
  # メディアガベージコレクション(ProjectMediaGarbageCollectionController)のrequireAdmin/
  # 自分自身のuserId解決のため、呼び出し元のBearerトークンをそのままidentity-serviceの
  # /api/identity/meへ転送して問い合わせる(#573 stage3、log-writer(#572)と同じ暫定策。
  # media-serviceはusersテーブルへクロススキーマアクセスできない=ADR-0004のクロススキーマ禁止のため)。
  # issue #583でproject_usersの所有権がidentity-serviceへ移ったため、
  # プロジェクトメンバー判定(IdentityBridgeClient)の向き先もこちらになった。
  identity-service-uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
  # issue #583: project_image_settings と画像生成の所有権がmedia-serviceへ移ったのに伴い、
  # プロジェクトの存在確認(ProjectImageDefaultsResolver / ImageModelService /
  # ComfyUiModelService)を project-service の内部ブリッジ経由で行う。
  project-service-uri: ${PROJECT_SERVICE_URI:http://project:8080}
  # 画像生成の接続設定(ComfyUIのbaseUrl・ChatGPTのAPIキー/baseUrl)の取得先。system_settingsの
  # 所有権はplatform-service(issue #693)。issue #583で画像生成がこちらへ移ったため追加した。
  platform-service-uri: ${PLATFORM_SERVICE_URI:http://platform:8080}

# KeycloakのJWT検証(#573)。identity-service/log-writerのSecurityConfig/JwtDecoderConfigと同じ理由
# により、issuer-uriによる自動設定は使わずJWKS取得先と期待issuerを個別に指定して組み立てている。
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}
  # サービス間のClient Credentials認証(#567)。issue #583で画像生成がmedia-serviceへ移り、
  # platform-serviceの/api/internal/platform/image-generation-config(#742でJWT必須)を
  # このサービス自身のトークンで呼ぶ必要が生じたため追加した(ServiceTokenClientConfig参照)。
  admin:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_SERVICES_CLIENT_ID:letsblog-services}
    client-secret: ${KEYCLOAK_SERVICES_CLIENT_SECRET:}
