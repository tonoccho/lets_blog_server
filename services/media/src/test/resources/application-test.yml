server:
  port: 8080

spring:
  application:
    name: lets-blog-media
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。ローカルではリポジトリの
    # docker-compose MySQLコンテナに対して、専用のlbs_media_testスキーマ(lets_blog_testと
    # 同じtest_user/test_pass)を使う。lbs_mediaスキーマ(実データ)には接続しない。
    url: jdbc:mysql://localhost:3306/lbs_media_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  comfyui-base-url: http://localhost:19999
  comfyui-checkpoint: v1-5-pruned-emaonly.safetensors
  comfyui-models-path: /tmp/comfyui-models
  plantuml-base-url: http://localhost:19999
  penpot-base-url: http://localhost:19999
  penpot-public-url: http://localhost:19999
  penpot-service-email: lbs-service@letsblog.local
  penpot-service-password: test-password
  generated-images-storage-path: /tmp/generated-images
  legacy-api-uri: http://localhost:19999
  ai-service-uri: http://localhost:19999
  identity-service-uri: http://localhost:19999

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
