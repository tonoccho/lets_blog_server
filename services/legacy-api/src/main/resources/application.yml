server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.api: DEBUG
    org.springframework.web: DEBUG
  path: ./logs
  json:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # メール送信はオプショナルな下流依存(未設定でも起動・利用可能)のため、
    # SMTP到達性をコンテナのヘルスチェック(#556)のゲート条件にはしない。
    mail:
      enabled: false
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      logback: true

springdoc:
  # api-docsのpathは既定値(/v3/api-docs)のまま使う(#555。サービス別OpenAPI公開の
  # 規約として、各サービスがこのpathを個別に上書きしないことで、orvalのマルチターゲット
  # 生成(orval.config.js)が全サービス共通の取得先規約に乗れるようにする)。
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

spring:
  application:
    name: lets-blog-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lets_blog?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_app}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # マイグレーションSQL内でメールテンプレートのThymeleaf構文 [[${var}]] を使うため、
    # Flyway自身の ${...} プレースホルダー置換とぶつからないよう無効化する
    placeholder-replacement: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # ログ発行(issue #466)はキュー障害時に同期DB書き込みへフォールバックする方針のため、
    # 接続不可時にリクエストスレッドを長く塞がないよう短めのタイムアウトにする。
    connection-timeout: 3000ms
    template:
      reply-timeout: 3000

# Keycloak Admin REST API呼び出し(初回セットアップ/api/auth/setup・緊急復旧AdminPasswordResetRunner、
# issue #681)。services/identity/.../keycloak/KeycloakAdminClientと同じ"letsblog-services"
# クライアントクレデンシャルズグラントを使う。事前にrealm側でこのクライアントのサービスアカウントに
# realm-management#manage-usersロールを付与しておく必要がある(keycloak/realm-export.json参照)。
keycloak:
  admin:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/token}
    admin-base-uri: ${KEYCLOAK_ADMIN_BASE_URI:http://keycloak:8080/auth/admin/realms/letsblog}
    client-id: ${KEYCLOAK_SERVICES_CLIENT_ID:letsblog-services}
    client-secret: ${KEYCLOAK_SERVICES_CLIENT_SECRET:}
  # KeycloakのJWT検証(#563)。gatewayを経由しない直接アクセスに対しても、Bearerトークンが
  # 付与されていれば独立して検証する(gatewayのbypassを許さない)。値の意味・JWKS取得先と
  # issuerを分けて指定している理由はservices/gateway/src/main/resources/application.ymlの
  # コメント、および services/legacy-api/.../config/JwtDecoderConfig.java を参照。
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}

app:
  encryption-key: ${APP_ENCRYPTION_KEY:}
  mail:
    from: ${APP_MAIL_FROM:noreply@letsblog.example.com}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  llm-base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL:gpt-4o-mini}
  llm-available-models: ${LLM_AVAILABLE_MODELS:gpt-4o-mini,gpt-4o,gpt-4.1-mini}
  llm-request-timeout-seconds: ${LLM_REQUEST_TIMEOUT_SECONDS:120}
  llm-provider: ${LLM_PROVIDER:OPENAI}
  llm-claude-api-key: ${LLM_CLAUDE_API_KEY:}
  llm-claude-model: ${LLM_CLAUDE_MODEL:claude-3-5-haiku-20241022}
  comfyui-base-url: ${COMFYUI_BASE_URL:http://localhost:8188}
  comfyui-checkpoint: ${COMFYUI_CHECKPOINT:v1-5-pruned-emaonly.safetensors}
  comfyui-models-path: ${COMFYUI_MODELS_PATH:/app/data/comfyui-models}
  image-llm-api-key: ${IMAGE_LLM_API_KEY:}
  image-llm-base-url: ${IMAGE_LLM_BASE_URL:https://api.openai.com/v1}
  brave-search-base-url: ${BRAVE_SEARCH_BASE_URL:https://api.search.brave.com}
  brave-search-api-key: ${BRAVE_SEARCH_API_KEY:}
  # plantuml-base-url/penpot-base-urlは、これらを使っていた唯一のクラス(ConnectedServiceStatusService)が
  # platform-serviceへ移設された(issue #695、C10-3)ことに伴い撤去した(services/platform/src/main/
  # resources/application.yml参照)。
  penpot-public-url: ${PENPOT_PUBLIC_URL:http://localhost:9001}
  penpot-service-email: ${PENPOT_SERVICE_EMAIL:lbs-service@letsblog.local}
  penpot-service-password: ${PENPOT_SERVICE_PASSWORD:}
  # PlantUML/Recharts/Penpotの実際のレンダリング呼び出しをmedia-serviceへ委譲する(#573、
  # com.letsblog.api.render.MediaRenderClient参照)。CMSアップロード等のオーケストレーション自体は
  # 引き続きこのサービス(PlantUmlEmbedService/PlantUmlTagRenderService/RechartsTagRenderService/
  # CustomTagGenerationService)が行う。
  media-service-uri: ${MEDIA_SERVICE_URI:http://localhost:8080}
  # LLMテキスト生成(AiGenerationClient)・generation_jobsのジョブ作成/進捗更新(GenerationJobClient)を
  # ai-serviceへ委譲する(issue #574)。
  ai-service-uri: ${AI_SERVICE_URI:http://localhost:8080}
  # 公開パイプライン中のカスタムタグ/組み込みタグ展開・Markdown→HTML変換、posts/
  # project_content_settingsの読み書き、記事プレビューのテーマ骨格取得(Playwright)をcontent-service
  # へ委譲する(issue #576、com.letsblog.api.client.ContentServiceClient参照)。
  content-service-uri: ${CONTENT_SERVICE_URI:http://localhost:8080}
  # プロジェクト単位のGoogle Analytics/AdSense連携設定(analytics_credentials)のCRUD・AdSense OAuth
  # コード交換をanalytics-serviceへ委譲する(issue #578、com.letsblog.api.client.
  # AnalyticsProjectSettingsClient参照)。
  analytics-service-uri: ${ANALYTICS_SERVICE_URI:http://localhost:8080}
  # システム全体のグローバル設定(system_settings: Brave Search APIキー・実効LLM接続設定・画像生成
  # 接続設定)の所有権がplatform-serviceへ移った(issue #693)ことに伴う内部ブリッジ
  # (com.letsblog.api.client.PlatformServiceClient参照)。AiBridgeController
  # (ai-service向けブリッジ)・ChatGptImageClient/ComfyUiClient(画像生成、#574で移設されず
  # legacy-apiに残置)がこの内部ブリッジ経由で実効値を取得する。
  platform-service-uri: ${PLATFORM_SERVICE_URI:http://localhost:8080}
  # Project/Site本体の所有権がproject-serviceへ移った(issue #577 stage2)ことに伴い、legacy-apiに残る
  # 一括管理/環境間比較・投稿publish/delete・記事プレビュー等(いずれもCMSアダプタ・SSH実行への深い依存の
  # ため#577では移設せずlegacy-apiに残る)が、プロジェクト/サイトの基本情報・CMS認証情報を
  # 参照するための内部ブリッジ(issue #577 stage3、com.letsblog.api.client.ProjectServiceClient参照)。
  project-service-uri: ${PROJECT_SERVICE_URI:http://localhost:8080}
  # 投稿の公開・削除パイプライン(cms/*・PostPublishService・PostDeleteService)の所有権がpublishing
  # -serviceへ移った(issue #707)ことに伴う内部ブリッジ(com.letsblog.api.client.PublishingServiceClient
  # 参照)。ProjectUserSyncService#provisionUserOnSiteが、著者(WordPressユーザー)の作成/更新を
  # このブリッジ経由で依頼する(#575設計判断4の書き込み側)。
  publishing-service-uri: ${PUBLISHING_SERVICE_URI:http://localhost:8080}
  wordpress-provision-base-url: ${WORDPRESS_PROVISION_BASE_URL:http://localhost:9000}
  wordpress-provision-token: ${WP_PROVISION_TOKEN:}
  # generated-images-storage-path/backup-mysql-*はBackupServiceと共にplatform-serviceへ移設した
  # (issue #694、C10-2。services/platform/.../application.ymlのapp.generated-images-storage-path/
  # app.backup.*参照)。vscode-extension-source-path/vscode-extension-build-pathは
  # VscodeExtensionBuildServiceと共にplatform-serviceへ移設した(issue #696、C10-4。
  # services/platform/.../application.ymlのapp.vscode-extension-*参照)。
  # docker-socket-proxy-base-urlは、これを使っていた唯一のクラス(ContainerStatusService)が
  # platform-serviceへ移設された(issue #695、C10-3)ことに伴い撤去した。docker-socket-proxyへの
  # アクセスは本サービス(legacy-api)からは行わず、platform-serviceのみに限定する(Epic #551の方針)。
  default-negative-prompt: ${DEFAULT_NEGATIVE_PROMPT:low quality, blurry, watermark, text}
  default-quality-prompt: ${DEFAULT_QUALITY_PROMPT:high quality, highly detailed, sharp focus, masterpiece}
  default-generated-image-width: ${DEFAULT_GENERATED_IMAGE_WIDTH:1920}
  default-generated-image-height: ${DEFAULT_GENERATED_IMAGE_HEIGHT:1080}
  default-article-image-long-edge-px: ${DEFAULT_ARTICLE_IMAGE_LONG_EDGE_PX:1300}
  default-block-sexual-content: ${DEFAULT_BLOCK_SEXUAL_CONTENT:true}
  default-block-violent-content: ${DEFAULT_BLOCK_VIOLENT_CONTENT:true}
  default-block-discriminatory-content: ${DEFAULT_BLOCK_DISCRIMINATORY_CONTENT:true}
