server:
  port: 8080

spring:
  application:
    name: lets-blog-publishing
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。専用のlbs_publishing_testスキーマ
    # (lets_blog_testと同じtest_user/test_pass)を使い、lbs_publishingスキーマ(実データ)には接続しない。
    # スキーマはinfra/mysql/init/02-create-test-schemas.shが作成する(issue #772)。
    url: jdbc:mysql://localhost:3306/lbs_publishing_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  project-service-uri: http://localhost:19999
  content-service-uri: http://localhost:19999
  legacy-api-uri: http://localhost:19999
  identity-service-uri: http://localhost:19999
  media-service-uri: http://localhost:19999
  default-article-image-long-edge-px: 1300
  wordpress-provision-base-url: http://localhost:19999
  wordpress-provision-token: test-token
  bulk-upload-storage-path: /tmp/lbs-publishing-test-bulk-uploads

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
