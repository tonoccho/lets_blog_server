server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.logwriter: DEBUG
  # 相関ID(issue #582、com.letsblog.common.web.CorrelationIdFilter)をログ行に含める。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # issue #589: health に加えて info / metrics も公開する。
        # 認証ゲート(ADR-0008)の PUBLIC_PATHS に /actuator/** が入っているため、
        # 秘匿情報を含みうるエンドポイント(env / configprops / heapdump 等)は公開しない。
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # 明示的なproducesを持たないGET(Page<T>を返すログ検索系)がOpenAPI上`*/*`として記録されると、
  # orvalが生成するTypeScriptクライアントがres.text()の結果をJSON.parseせず生文字列のまま
  # 型付きレスポンスへ代入してしまい型エラーになる(#572で実際に踏んだ)。既定の応答Content-Typeを
  # 明示することでこれを避ける。
  default-produces-media-type: application/json

spring:
  application:
    name: lets-blog-log-writer
  datasource:
    # issue #1095: mysqlコンテナ再作成後も再起動なしで自力回復できるよう、ai-serviceの
    # application.ymlと同じ理由でconnectTimeout/socketTimeoutを設定する。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbs_log?useSSL=false&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_log}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_log}
    hikari:
      # issue #1095: ai-serviceのapplication.ymlと同じ理由で、プール枯渇時にヘルスチェックを
      # 含む全呼び出しがsocketTimeoutの自力回復を待たず早く失敗するようconnection-timeoutを縮める。
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # ログ4テーブル(audit_logs/operation_logs/frontend_error_logs)のスキーマ所有権をlog-writer
  # 自身のFlywayへ完全移管した(#572)。専用スキーマ(lbs_log、ADR-0004)なので、legacy-api側の
  # V1〜V71とは無関係の独立したマイグレーション履歴として V1 から開始する。既存データの移行は
  # scripts/migrate-log-tables-to-lbs-log.sql を参照(V1適用後・legacy-api側の旧テーブル
  # 削除マイグレーション適用前に実行する運用)。
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # issue #1059: #466の「default-requeue-rejected: true」は一時的な失敗(DB接続断等)を
        # 想定していたが、NOT NULL違反のような永続的な失敗も無限にrequeueしてしまい、
        # 1件の不正なメッセージが対象キューのコンシューマーを占有し続ける事故を起こした
        # (#1059の失敗シナリオ)。
        #
        # 一時的な失敗と永続的な失敗を例外の型では区別せず、「リトライ回数」で区別する方針に
        # 変更する: 一時的な失敗は数回のリトライで解消する見込みが高く、解消しない失敗は
        # 実質的に永続的な失敗として扱ってよい。下記retryで有限回(3回、初回込みで最大4回)
        # リトライし、それでも失敗したメッセージはrequeueされず(既定のRejectAndDontRequeueRecoverer
        # がAmqpRejectAndDontRequeueExceptionを投げる)、各キューのx-dead-letter-exchange設定
        # (RabbitMqConfig参照)によりletsblog.logs.dlx経由でDLQへ配送される。
        #
        # default-requeue-rejectedはリトライadviceが例外を握って再スローしない限り(想定外の
        # 例外がリスナー自体から漏れた場合など)にのみ効くフォールバックのため、falseにして
        # そちらも無限requeueにならないようにする。
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

# ログ読み取りAPIのadmin判定・自分自身のuserId解決のため、呼び出し元のBearerトークンをそのまま
# identity-serviceの/api/identity/meへ転送して問い合わせる(#572)。lbs_logスキーマは
# usersテーブルへクロススキーマアクセスできない(ADR-0004)ための暫定策。C12(#581)でサービス間
# 同期呼び出しの標準クライアント(タイムアウト/リトライ/サーキットブレーカー)が定まったら
# そちらへ寄せる想定(現時点は短いタイムアウトのみの素朴な同期呼び出し)。
app:
  identity-service-uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
  # 統合操作ログ(/api/operation-logs/unified)のAIジョブソースをai-serviceから
  # 同期HTTP呼び出しで取得する(lbs_logスキーマからgeneration_jobsは直接参照できないため)。
  #
  # 既定値を http://ai:8080 にしている理由(issue #825): 他サービスのapp.ai-service-uriは
  # ${AI_SERVICE_URI:http://api:8080} と書かれているが、これはGenerationJobControllerが
  # legacy-apiにあった頃の名残で、現在のlegacy-apiに当該エンドポイントは存在しない。
  # その既定値を踏襲すると、環境変数未設定時に404を受け続ける(#825で実際に起きた事象)。
  ai-service-uri: ${AI_SERVICE_URI:http://ai:8080}

# KeycloakのJWT検証(#572)。identity-serviceのSecurityConfig/JwtDecoderConfigと同じ理由により、
# issuer-uriによる自動設定は使わずJWKS取得先と期待issuerを個別に指定して組み立てている。
# gatewayを経由しない直接アクセスでも、gateway経由と同一の検証(署名・有効期限・issuer)が
# 独立して行われる。
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}
