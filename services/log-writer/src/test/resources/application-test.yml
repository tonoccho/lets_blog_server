server:
  port: 8080

spring:
  application:
    name: lets-blog-log-writer
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。専用のlbs_log_testスキーマ
    # (lets_blog_testと同じtest_user/test_pass)を使い、lbs_logスキーマ(実データ)には接続しない。
    # スキーマはmysql/init/02-create-test-schemas.shが作成する(issue #772)。
    url: jdbc:mysql://localhost:3306/lbs_log_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  identity-service-uri: http://localhost:19999
  # 到達しないポートを指す。統合テストは外部サービスへ実際には接続しない(ADR-0006)。
  # #825でlegacy-api-uriからai-service-uriへ改名(問い合わせ先がai-serviceへ移ったため)。
  ai-service-uri: http://localhost:19999

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
