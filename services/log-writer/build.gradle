plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
}

dependencies {
    implementation project(':packages:lbs-common')

    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // POST /api/logs/errorsの入口検証(issue #1059)。@Valid/@NotBlank/@Sizeを使う。
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // ログ読み取りAPI(#572でlegacy-apiから移設)を公開するREST APIサーバー。以前はDocker
    // healthcheck用のactuator公開のみが理由だったが、いまはAuditLog/OperationLog/
    // FrontendErrorLogの各読み取りコントローラーが実際にこれを使う。
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

    // ログ4テーブル(audit_logs/operation_logs/frontend_error_logs)のスキーマ所有権を
    // lbs_logスキーマへ移管(#572)。
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // 読み取りAPIのJWT検証(#572)。gatewayを経由しない直接アクセスでも検証する
    // (identity-serviceのSecurityConfigと同じ考え方)。
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    implementation 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation testFixtures(project(':packages:lbs-common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

