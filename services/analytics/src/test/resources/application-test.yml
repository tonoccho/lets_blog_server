server:
  port: 8080

spring:
  application:
    name: lets-blog-analytics
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。ローカルではリポジトリの
    # docker-compose MySQLコンテナに対して、専用のlbs_analytics_testスキーマ(lets_blog_testと
    # 同じtest_user/test_pass)を使う。lbs_analyticsスキーマ(実データ)には接続しない。
    url: jdbc:mysql://localhost:3306/lbs_analytics_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  encryption-key: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  legacy-api-uri: http://localhost:19999
  identity-service-uri: http://localhost:19999
  google-analytics-data-api-base-url: http://localhost:19999
  google-analytics-oauth-token-uri: http://localhost:19999
  google-oauth-token-uri: http://localhost:19999
  adsense-data-api-base-url: http://localhost:19999

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
