server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.analytics: DEBUG
  # 相関ID(issue #582、com.letsblog.common.web.CorrelationIdFilter)をログ行に含める。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # issue #589: health に加えて info / metrics も公開する。
        # 認証ゲート(ADR-0008)の PUBLIC_PATHS に /actuator/** が入っているため、
        # 秘匿情報を含みうるエンドポイント(env / configprops / heapdump 等)は公開しない。
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # log-writer(#572)/media-service(#573)/ai-service(#574)と同じ理由: 明示的なproducesを持たない
  # エンドポイントがOpenAPI上`*/*`として記録されると、orvalが生成するTypeScriptクライアントの
  # 型付けが崩れる。既定の応答Content-Typeを明示することでこれを避ける。
  default-produces-media-type: application/json

spring:
  application:
    name: lets-blog-analytics
  datasource:
    # issue #1095: mysqlコンテナ再作成後も再起動なしで自力回復できるよう、ai-serviceの
    # application.ymlと同じ理由でconnectTimeout/socketTimeoutを設定する。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbs_analytics?useSSL=false&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_analytics}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_analytics}
    hikari:
      # issue #1095: ai-serviceのapplication.ymlと同じ理由で、プール枯渇時にヘルスチェックを
      # 含む全呼び出しがsocketTimeoutの自力回復を待たず早く失敗するようconnection-timeoutを縮める。
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # analytics_credentialsのスキーマ所有権をanalytics-serviceへ移管した(#578)。専用スキーマ
  # (lbs_analytics、ADR-0004)なので、legacy-api側のV1〜とは無関係の独立したマイグレーション履歴
  # としてV1から開始する。既存データの移行はscripts/migrate-analytics-tables-to-lbs-analytics.sqlを
  # 参照(V1適用後に実行する運用)。
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # issue #1390: project-service(#1388)で確定した経路と同じ欠陥をspring.rabbitmqを持つ全サービスで
    # 塞ぐ。本サービス自身はEventMessageListenerでletsblog.eventsを消費するだけで、HTTPリクエスト
    # スレッドから同期的にconvertAndSendを呼ぶコード(AuditLogService相当)は持たない
    # (RabbitMqConnectionTimeoutTestのJavadoc参照)ため直接の504リスクは無いが、同じ
    # spring.rabbitmqブロックを持つ他8サービスと足並みを揃え、将来同期publish経路が
    # 足された際に同じ欠陥を持ち込まないようにする。本サービスの内部クライアント
    # (IdentityBridgeClient/ProjectBridgeClient、いずれもCONNECT_TIMEOUT = Duration.ofSeconds(3))
    # と同じ3秒の慣例に合わせる。
    connection-timeout: 3s
    # letsblog.eventsコンシューマー(EventMessageListener)のリトライ→DLQポリシー(issue #580)。
    # content-serviceと同じ設定(docs/EVENT_DRIVEN_ARCHITECTURE.md参照)。
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

app:
  # analytics_credentialsの各暗号化カラム(ga_service_account_json_encrypted/
  # adsense_refresh_token_encrypted/adsense_oauth_client_secret_encrypted)の暗号化/復号
  # (CredentialCipher、lbs-common)。全サービス共通のAES-256-GCM鍵(legacy-api/ai-serviceと同じ値)。
  encryption-key: ${APP_ENCRYPTION_KEY:}
  # 呼び出し元のBearerトークンをそのまま転送して他サービスの内部ブリッジへ問い合わせる
  # (log-writer(#572)/media-service(#573)/ai-service(#574)と同じ方針。issue #578)。
  # issue #583でlegacy-apiを解体したため、向き先は以下の2つに分かれた。
  #   - プロジェクトメンバー判定(IdentityBridgeClient) → identity-service(project_users の所有者)
  #   - レポート取得可否判定(ProjectBridgeClient) → project-service(projects/sites の所有者)
  project-service-uri: ${PROJECT_SERVICE_URI:http://project:8080}
  identity-service-uri: ${IDENTITY_SERVICE_URI:http://identity:8080}
  # Google Analytics連携(issue #386、legacy-apiから移設)。
  google-analytics-data-api-base-url: ${GOOGLE_ANALYTICS_DATA_API_BASE_URL:https://analyticsdata.googleapis.com}
  google-analytics-oauth-token-uri: ${GOOGLE_ANALYTICS_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
  # AdSense連携(issue #387、legacy-apiから移設)。OAuthクライアントID/シークレットはプロジェクトごとに
  # 異なるため、プロジェクト単位のDB設定(issue #407)で保持し、環境変数では扱わない。
  google-oauth-token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
  adsense-data-api-base-url: ${ADSENSE_DATA_API_BASE_URL:https://adsense.googleapis.com}

# KeycloakのJWT検証。identity-service/log-writer/media-service/ai-serviceのSecurityConfig/
# JwtDecoderConfigと同じ理由により、issuer-uriによる自動設定は使わずJWKS取得先と期待issuerを
# 個別に指定して組み立てている。
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}
