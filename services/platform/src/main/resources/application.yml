server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.platform: DEBUG
  # 相関ID(issue #582、com.letsblog.common.web.CorrelationIdFilter)をログ行に含める。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # 他サービスと同じ理由: 明示的なproducesを持たないエンドポイントがOpenAPI上`*/*`として記録されると、
  # orvalが生成するTypeScriptクライアントの型付けが崩れる。既定の応答Content-Typeを明示することで
  # これを避ける。
  default-produces-media-type: application/json

spring:
  application:
    name: lets-blog-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbs_platform?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_platform}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_platform}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # system_settingsのスキーマ所有権をplatform-serviceへ移管した(issue #693)。専用スキーマ
  # (lbs_platform、ADR-0004)なので、legacy-api側のV1〜とは無関係の独立したマイグレーション履歴として
  # V1から開始する。既存データの移行はscripts/migrate-system-settings-to-lbs-platform.sqlを参照
  # (V1適用後に実行する運用)。
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # AppSettingServiceのメール送信設定項目(mail_host/mail_port/mail_username/mail_password)の
  # 環境変数フォールバック値。legacy-api版と同じくSMTP送信自体は行わない(唯一の利用者だった
  # MailSenderServiceはissue #566で撤去済み。Web管理画面からの表示・編集項目としてのみ残る)。
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  encryption-key: ${APP_ENCRYPTION_KEY:}
  mail:
    from: ${APP_MAIL_FROM:noreply@letsblog.example.com}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  llm-base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL:gpt-4o-mini}
  llm-available-models: ${LLM_AVAILABLE_MODELS:gpt-4o-mini,gpt-4o,gpt-4.1-mini}
  llm-request-timeout-seconds: ${LLM_REQUEST_TIMEOUT_SECONDS:120}
  llm-provider: ${LLM_PROVIDER:OPENAI}
  llm-claude-api-key: ${LLM_CLAUDE_API_KEY:}
  llm-claude-model: ${LLM_CLAUDE_MODEL:claude-3-5-haiku-20241022}
  comfyui-base-url: ${COMFYUI_BASE_URL:http://localhost:8188}
  image-llm-api-key: ${IMAGE_LLM_API_KEY:}
  image-llm-base-url: ${IMAGE_LLM_BASE_URL:https://api.openai.com/v1}
  brave-search-api-key: ${BRAVE_SEARCH_API_KEY:}
  # CurrentActorServiceのisAdmin/自分自身のuserId解決のため、呼び出し元のBearerトークンをそのまま
  # identity-serviceの/api/identity/meへ転送して問い合わせる(log-writer(#572)/content-service(#576)/
  # project-service(#577)と同じ暫定策。platform-serviceはusersテーブルへクロススキーマアクセス
  # できない=ADR-0004のクロススキーマ禁止のため)。
  identity-service-uri: ${IDENTITY_SERVICE_URI:http://identity:8080}

# KeycloakのJWT検証。他サービスのSecurityConfig/JwtDecoderConfigと同じ理由により、issuer-uriによる
# 自動設定は使わずJWKS取得先と期待issuerを個別に指定して組み立てている。
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:https://localhost/auth/realms/letsblog}
  # AdminPasswordResetRunner(緊急パスワードリセット、issue #693)がKeycloak Admin REST APIを
  # 呼び出すための設定。legacy-api/identity-serviceと同じletsblog-servicesクライアントの
  # サービスアカウント(realm-management#manage-usersロール)を使う。
  admin:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/auth/realms/letsblog/protocol/openid-connect/token}
    admin-base-uri: ${KEYCLOAK_ADMIN_BASE_URI:http://keycloak:8080/auth/admin/realms/letsblog}
    client-id: ${KEYCLOAK_SERVICES_CLIENT_ID:letsblog-services}
    client-secret: ${KEYCLOAK_SERVICES_CLIENT_SECRET:}
