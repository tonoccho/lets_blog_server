server:
  port: 8080

spring:
  application:
    name: lets-blog-platform
  datasource:
    # legacy-api(services/legacy-api/src/test/resources/application-test.yml)と同じ方式(ADR-0006:
    # Testcontainersは使わず実MySQLに接続する)。ローカルではリポジトリのdocker-compose MySQL
    # コンテナに対して、専用のlbs_platform_testスキーマ(lets_blog_testと同じtest_user/test_pass)を
    # 使う。lbs_platformスキーマ(実データ)には接続しない。
    url: jdbc:mysql://localhost:3306/lbs_platform_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000
  mail:
    host: localhost
    port: 587
    username:
    password:

app:
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  identity-service-uri: http://localhost:19999
  llm-base-url: https://api.openai.com/v1
  llm-model: gpt-4o-mini
  llm-available-models: gpt-4o-mini,gpt-4o
  llm-request-timeout-seconds: 120
  comfyui-base-url: http://localhost:8188
  # ConnectedServiceStatusService/ContainerStatusServiceのテスト用値(issue #695、C10-3)。
  # MockRestServiceServerを介するユニットテスト自体はこれらを使わないが、@SpringBootTestで
  # フルコンテキストを起動するAdminAuthorizationIntegrationTestがBean生成のために必要とする。
  plantuml-base-url: http://localhost:8085
  penpot-base-url: http://localhost:9001
  wordpress-provision-base-url: http://localhost:9000
  docker-socket-proxy-base-url: http://localhost:2375
  mail:
    from: noreply@example.com
  web:
    base-url: http://localhost:3000
  generated-images-storage-path: /tmp/lbs-platform-test-generated-images
  # VscodeExtensionBuildServiceのテスト用値(issue #696、C10-4)。MockitoベースのVscodeExtensionBuild
  # ServiceTest自体はこれらを使わないが、@SpringBootTestでフルコンテキストを起動する
  # AdminAuthorizationIntegrationTestがBean生成のために必要とする。
  vscode-extension-source-path: /tmp/lbs-platform-test-extension-src
  vscode-extension-build-path: /tmp/lbs-platform-test-extension-build
  backup:
    mysql:
      host: localhost
      port: 3306
      user: test_user
      password: test_pass
      schemas: lbs_platform_test
    postgres:
      host: localhost
      port: 5432
      user: keycloak
      password: test_pass
      database: keycloak

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
  admin:
    token-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/token
    admin-base-uri: http://localhost:19999/auth/admin/realms/letsblog
    client-id: letsblog-services
    client-secret: test-secret
