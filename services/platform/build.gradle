// platform-service (issue #693、C10-1): システム全体のグローバル設定(system_settingsテーブル:
// Brave Search APIキー・実効LLM接続設定/メール送信/Google OAuthクライアント/Webフロント公開URL/
// アップロードレート制限)をlegacy-apiから抽出した。SystemSettingService/AppSettingServiceおよび
// これらに付随するController/緊急パスワードリセットCLI(AdminPasswordResetRunner)を移設する。
// スキーマ分離(lbs_platform)により他サービスから独立する。バックアップ機能拡張(#694)・
// コンテナ状態/接続サービス状態のSSE中継(#695)・VSCode拡張のオンデマンドビルド配布(#696)は
// 別issueでこのモジュールへ追加される想定。
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
}

dependencies {
    implementation project(':libs:lbs-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // AdminPasswordResetRunnerが直接呼び出すKeycloakAdminClient(legacy-api/identity-serviceと同じ
    // 個別実装、issue #693のJavadoc参照)がcom.fasterxml.jackson.databind.JsonNode/ObjectNodeを
    // 直接使うため明示的に追加する(Boot 4の既定JSONコンバータ・既定ObjectMapperはJackson3系
    // (tools.jackson)に変わったため。legacy-api/media-service/ai-service/content-service/
    // project-serviceと同じ構成)。
    implementation 'org.springframework.boot:spring-boot-jackson2'

    // system_settingsのスキーマ所有権(issue #693)。
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // @AuditLog(SystemSettingService/AppSettingService)のAOP実装(AuditLogAspect)に使う。
    // legacy-api/content-service/project-serviceと同じ構成。
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    implementation 'com.mysql:mysql-connector-j'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation testFixtures(project(':libs:lbs-common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // AuthorizationMatrixIntegrationTest は実行時に自サービスのコントローラと SecurityConfig を
    // ソースとして走査する(issue #805。検証ロジックは lbs-common の
    // AuthorizationMatrixContract)。これらを Gradle の入力として宣言しておかないと、
    // コントローラを増やしても test タスクが UP-TO-DATE で飛ばされ、契約テストが実行されない。
    // CI は毎回 fresh checkout なので結局実行されるが、それではローカルで気付けず
    // 「エンドポイントを足したら落ちて気付ける」という目的を果たさない(#743 と同じ理由)。
    inputs.files(fileTree("$projectDir/src/main/java") {
        include '**/*Controller.java'
        include '**/SecurityConfig.java'
    }).withPropertyName('authorizationMatrixSources').withPathSensitivity(PathSensitivity.RELATIVE)
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
