server:
  port: 8080

spring:
  application:
    name: lets-blog-project
  datasource:
    # content-service(services/content/src/test/resources/application-test.yml)と同じ方式
    # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。専用のlbs_project_testスキーマ
    # (lets_blog_testと同じtest_user/test_pass)を使い、lbs_projectスキーマ(実データ)には接続しない。
    # スキーマはmysql/init/02-create-test-schemas.shが作成する(issue #772)。
    url: jdbc:mysql://localhost:3306/lbs_project_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000ms
    template:
      reply-timeout: 1000

app:
  legacy-api-uri: http://localhost:19999
  publishing-service-uri: http://localhost:19999
  identity-service-uri: http://localhost:19999
  ai-service-uri: http://localhost:19999
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  wordpress-provision-base-url: http://localhost:19999
  wordpress-provision-token: test-token

keycloak:
  jwk-set-uri: http://localhost:19999/auth/realms/letsblog/protocol/openid-connect/certs
  issuer: http://localhost:19999/auth/realms/letsblog
