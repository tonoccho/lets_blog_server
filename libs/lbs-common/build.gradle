// サービス間で共有する共通ライブラリ。ドメインロジックは置かず、暗号化・エラー応答規約・
// ログメッセージ型・相関IDフィルタ等の横断的な部品のみを置く(#554)。
// Spring Bootアプリではなく通常のライブラリとしてビルドする(bootJar無効 / jar有効)。
plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
}

dependencies {
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-web'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'org.slf4j:slf4j-api'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    // ServiceTokenClient(#567)がKeycloakAdminClient等と同じ流儀でJsonNode(Jackson2)を
    // 使ってトークンエンドポイントのレスポンスを読むために必要
    // (Boot 4の既定Jackson3コンバータはJsonNode.classのデシリアライズに失敗するため)。
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.hamcrest:hamcrest'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JwtTestFixtures(#587)がJwt/SecurityMockMvcRequestPostProcessorsを組み立てるために必要。
    // Jwtクラス自体はoauth2-resource-serverではなくoauth2-jose(その推移的依存)が提供する。
    // legacy-api/identity-serviceは既にこれらへ依存しているため、ここではテストフィクスチャの
    // 利用側(testFixtures(project(...)))へ推移的に公開するためtestFixturesApiとして宣言する。
    testFixturesApi 'org.springframework.security:spring-security-oauth2-jose'
    testFixturesApi 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('bootJar') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
    archiveClassifier = ''
}
