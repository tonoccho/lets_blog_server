# 受け入れテスト用の外部依存スタブ一式(issue #928 / AT-2)。
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e-stubs.yml up -d
#
# 受け入れテストは外部SaaSに依存しない。実キーが要る依存(LLM / Google Analytics /
# AdSense / Brave Search / OpenAI画像生成 / GitHub)を、決定的に応答するスタブへ置き換える。
# ComfyUI は外部SaaSではないが、GPU が要り実生成が遅いので、枚数と seed の決定的な検証の
# ためだけにスタブを併置する(#1106。実生成の検証は #936 が実機で行う)。
# 詳細と使い方は docs/ACCEPTANCE_TESTING.md の「外部依存スタブ」節を参照。
#
# #843 で導入した docker-compose.e2e-llm-stub.yml は本ファイルへ統合し、削除した。
# オーバーライドを依存ごとに増やすと起動手順が破綻するため、1本にまとめる方針。
#
# ## 落とし穴: システム設定(DB)が環境変数より優先される
#
# LLM の baseUrl / APIキーは platform-service の system_settings(DB)に値があると
# そちらが優先される(AppSettingService が正)。環境変数だけ差し替えても実サービスへ
# 出ていく。受け入れテストの前に scripts/e2e-clear-llm-db-overrides.sh で DB 側を空にすること。
#
# Ollama / ComfyUI の接続先は環境変数で決まらない(issue #1567)ので、このファイルでは差し替えない。
# 同スクリプトが system_settings の llm_ollama_base_url / comfyui_base_url にスタブの URL を投入する。
#
# ## ホスト公開ポート
#
# 各スタブは 127.0.0.1 のみに公開する。受け入れテストが制御エンドポイント
# (POST /__control/force など)でエラーを注入し、/__control/state で呼ばれた回数を
# 確認するために必要。外部へは開けない。

x-stub-base: &stub-base
  image: node:22-alpine
  restart: unless-stopped
  # 他のサービスと同じログ上限(#1247)。値の根拠は docker-compose.yml の x-logging を参照。
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  # マウント先(/app)を working_dir にしない(#1000)。
  #
  # ヘルスチェックは docker exec と同じ経路で走り、その cwd はコンテナの WorkingDir に
  # なる。healthcheck: には -w に当たる指定が無いので、cwd を選べるのはここだけである。
  # runc 1.4.0 は exec の cwd がバインドマウント経由でマウント名前空間のルート外を指す場合、
  # プロセスの起動そのものを拒否する:
  #
  #   OCI runtime exec failed: exec failed: unable to start container process:
  #   current working directory is outside of container mount namespace root
  #
  # 拒否されるのはプロセスが動き出す前なので、test: の中に cd を書いても回避できない。
  # working_dir=/app のままだとスタブ6本が起動直後から恒常的に unhealthy になり、
  # condition: service_healthy で待つ ai / platform / analytics が起動を完了できない。
  # ソースの持ち込み方(読み取り専用の /app マウント)とスタブの機能は変えていない。
  # 起動は下の command が絶対パス(/app/<name>/server.js)で指す。
  working_dir: /
  volumes:
    - ./infra/e2e-stubs:/app:ro
  environment:
    TZ: UTC
    PORT: "8080"
  networks:
    - lbs-net
  healthcheck:
    # localhost ではなく 127.0.0.1 を使う。node:22-alpine の busybox wget は localhost を
    # ::1 へ先に解決し、サーバーが IPv4 の 0.0.0.0 にしか bind していないため接続拒否になる。
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # api-global のレート制限を受け入れテスト用に引き上げる(issue #1132)。
  #
  # `@api` シナリオは nginx 経由(https://localhost)で gateway を叩くため、gateway からは
  # 外部の実クライアントと区別が付かない。api-global はクライアント単位に分割済みだが
  # (issue #749)、受け入れテストの実行元は常に1台の Playwright プロセスなので、
  # 分割してもスイート全体が「1クライアント」に潰れる。本番既定の100req/分のままだと、
  # フィクスチャ構築の呼び出しだけで枠を使い切り、無関係なシナリオが429で落ちる。
  #
  # 本番既定値(API_RATE_LIMIT_REQUESTS 未設定 = 100)はここでは変更しない。
  # 値の根拠(実測とヘッドルームの計算)は docs/API_RATE_LIMITING.md
  # 「Acceptance-test override (issue #1132)」を参照。docs/ACCEPTANCE_TESTING.md §9 にも
  # 同じ内容を要約している。
  #
  # upload-endpoint(画像生成/アップロード)の枠も同じ理由で受け入れテスト用に引き上げる
  # (issue #1286)。`image-generation.feature` 冒頭の内訳どおり、`@slow` を含む全件実行の
  # 消費はちょうど12で、既定値10(1時間に10回、プロセス全体で1バケット)を2つ超える。
  # 1時間以内の再実行も429無しでまかなうには、同じ1時間の枠の中で少なくとも24
  # (12 × 2回)を吸収できる必要がある。
  #
  # 本番既定値(UPLOAD_RATE_LIMIT_REQUESTS 未設定 = 10)はここでは変更しない。
  # 値の根拠は docs/API_RATE_LIMITING.md「Acceptance-test override (issue #1286)」を参照。
  # docs/ACCEPTANCE_TESTING.md §9 にも同じ内容を要約している。
  gateway:
    environment:
      API_RATE_LIMIT_REQUESTS: "1000"
      UPLOAD_RATE_LIMIT_REQUESTS: "40"
      # 内部APIへの故障注入(#1519)を有効にする。GET /api/projects/{id}/users をプロジェクトID
      # 単位で503にできる制御パス(/api/__fault-injection/...)がこの構成にだけ現れる。
      # 本番構成(このファイルを重ねない)ではこの変数が無く、フィルタ自体が作られない。
      # 使い方は docs/ACCEPTANCE_TESTING.md「内部APIへの故障注入」を参照。
      APP_FAULT_INJECTION_ENABLED: "true"

  llm-stub:
    <<: *stub-base
    container_name: lbs-e2e-llm-stub
    command: ["node", "/app/llm/server.js"]
    ports:
      - "127.0.0.1:18081:8080"

  ga-stub:
    <<: *stub-base
    container_name: lbs-e2e-ga-stub
    command: ["node", "/app/google-analytics/server.js"]
    ports:
      - "127.0.0.1:18082:8080"

  adsense-stub:
    <<: *stub-base
    container_name: lbs-e2e-adsense-stub
    command: ["node", "/app/adsense/server.js"]
    ports:
      - "127.0.0.1:18083:8080"

  brave-stub:
    <<: *stub-base
    container_name: lbs-e2e-brave-stub
    command: ["node", "/app/brave-search/server.js"]
    ports:
      - "127.0.0.1:18084:8080"

  image-stub:
    <<: *stub-base
    container_name: lbs-e2e-image-stub
    command: ["node", "/app/openai-image/server.js"]
    ports:
      - "127.0.0.1:18085:8080"

  github-stub:
    <<: *stub-base
    container_name: lbs-e2e-github-stub
    command: ["node", "/app/github/server.js"]
    ports:
      - "127.0.0.1:18086:8080"

  # X API(issue #1573)。letsblog プラグインの X 送信処理(トークン更新・投稿)の向き先。
  # プラグインは wp-config.php の定数 LETSBLOG_X_API_BASE_URL(http://x-stub:8080)でここへ向ける。
  x-stub:
    <<: *stub-base
    container_name: lbs-e2e-x-stub
    command: ["node", "/app/x/server.js"]
    ports:
      - "127.0.0.1:18088:8080"

  # Threads API(issue #1579)。letsblog プラグインの Threads 送信処理(長期トークンの更新・投稿)と、
  # project-service の Threads 接続(認可画面・トークン交換・自分の情報)の向き先。
  # プラグインは wp-config.php の定数 LETSBLOG_THREADS_API_BASE_URL(http://threads-stub:8080)でここへ向ける。
  threads-stub:
    <<: *stub-base
    container_name: lbs-e2e-threads-stub
    command: ["node", "/app/threads/server.js"]
    ports:
      - "127.0.0.1:18090:8080"

  # Facebook(Graph API)(issue #1580)。letsblog プラグインの Facebook ページ送信処理(ページのフィードへの投稿)と、
  # project-service の Facebook 接続(認可画面・コード交換・長期トークン化・管理しているページの一覧)の向き先。
  # プラグインは wp-config.php の定数 LETSBLOG_FACEBOOK_API_BASE_URL(http://facebook-stub:8080)でここへ向ける。
  facebook-stub:
    <<: *stub-base
    container_name: lbs-e2e-facebook-stub
    command: ["node", "/app/facebook/server.js"]
    ports:
      - "127.0.0.1:18091:8080"

  # ComfyUI(issue #1106)。実機は NVIDIA ランタイムが要り、1枚あたり数十秒かかるため、
  # batch size 16 の枚数検証も「リピートごとに seed が変わる」ことの確認も実行時間に乗らない。
  # スタブが引き受けるのは枚数と seed の決定的な検証だけで、画像の見た目は再現しない。
  # #936(AT-10)の実生成シナリオ(@slow)は実機の ComfyUI を使い続ける(併用)。
  comfyui-stub:
    <<: *stub-base
    container_name: lbs-e2e-comfyui-stub
    command: ["node", "/app/comfyui/server.js"]
    ports:
      - "127.0.0.1:18087:8080"

  # Docker Engine API(issue #1399)。ComfyUIの演算デバイス(GPU/CPU)切り替えは、platform-service が
  # docker-socket-proxy 経由でコンテナを start / stop する。共有の受け入れ環境で実コンテナを止めると
  # 他のシナリオを壊すため、platform の切り替え専用の向き先(COMPUTE_DEVICE_DOCKER_BASE_URL)だけを
  # このスタブへ向ける。ダッシュボードのコンテナ一覧(DOCKER_SOCKET_PROXY_BASE_URL)は実物のまま。
  # スタブは GET /containers/json と POST /containers/{id}/start|stop だけを実装する。
  # COMPOSE_PROJECT_NAME は platform と同じ値にする(一覧のプロジェクトラベルの照合に使われる)。
  docker-engine-stub:
    <<: *stub-base
    container_name: lbs-e2e-docker-engine-stub
    command: ["node", "/app/docker-engine/server.js"]
    environment:
      TZ: UTC
      PORT: "8080"
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-lets_blog_server}
    ports:
      - "127.0.0.1:18089:8080"

  # ---- ollama は AT では起動しない(issue #1090)----
  #
  # AT の LLM は llm-stub が担う(#928: GPU にも外部SaaS にも依存しない)。ollama と
  # ollama-model-init を残すと、テストに使わない約4.7GBのモデル取得とVRAM確保が走る。
  # profiles を上書きファイル側にだけ置くので、docker-compose.yml 単独の起動は変わらず、
  # AT の `docker compose up -d` に引数も要らない。
  # deploy.replicas: 0 はコンテナを作らず `docker compose start ollama` が使えないため採らない。
  # 明示起動は `docker compose -f docker-compose.yml -f docker-compose.e2e-stubs.yml up -d ollama`
  # (profile が自動で有効になる)。いったん作られたコンテナは `start` / `stop` でも操作できる。
  ollama:
    profiles: ["ollama"]
  ollama-model-init:
    profiles: ["ollama"]

  # ---- 各サービスの向き先をスタブへ ----

  # LLM を実際に呼ぶのは ai-service、その接続設定の既定値を持つのは platform-service
  # (system_settings の所有者、issue #693)。両方を向けないと、DBに設定が無い環境で
  # platform 側の既定値(本物のエンドポイント)が使われてしまう(#843)。
  #
  # ChatGPT(OpenAI)のベースURLは本番では設定項目を持たず常に https://api.openai.com/v1 である(#1569)。
  # 受け入れテストでだけスタブへ向けるため、ai / media に Spring プロファイル e2e-stubs を有効にする。
  # このプロファイルは RemoteLlmConfigProvider(ai)/ PlatformServiceClient(media)が見て、
  # ChatGPT の向き先を llm-stub / image-stub に切り替える。本番の compose はこのプロファイルを有効にしない。
  # LlmClient は {baseUrl}/chat/completions を叩く(パスはクライアント側が付ける)。
  ai:
    environment:
      SPRING_PROFILES_ACTIVE: e2e-stubs
      BRAVE_SEARCH_BASE_URL: http://brave-stub:8080
      GITHUB_API_BASE_URL: http://github-stub:8080
    depends_on:
      llm-stub:
        condition: service_healthy
      brave-stub:
        condition: service_healthy
      github-stub:
        condition: service_healthy

  platform:
    environment:
      # issue #1568: ChatGPT / ClaudeのAPIキーはプロジェクト単位だけで、システム全体のキーも環境変数も無い。
      # プロジェクト指定の無い呼び出し(VSCode拡張・タグ提案など)がスタブへ向くよう、AT では
      # 既定プロバイダを、キー不要のOLLAMAに固定する。接続先のスタブ(http://llm-stub:8080)は
      # 環境変数ではなく DB へ入る(scripts/e2e-clear-llm-db-overrides.sh、issue #1567)。
      # OPENAI を使うシナリオは、プロジェクトにスタブ用のキーを設定してそのプロジェクトで選ぶ。
      # 同スクリプトが DB 上書きを消すため、ここで固定しないと環境変数既定がそのまま効く。
      LLM_PROVIDER: OLLAMA
      LLM_OLLAMA_MODEL: e2e-stub-model
      # media-service は画像生成の接続設定を platform の
      # /api/internal/platform/image-generation-config から取る(PlatformServiceClient)。
      # ChatGPT 画像生成の向き先は設定項目ではなく、media の e2e-stubs プロファイルで決まる(#1569)。
      # ComfyUI の向き先は環境変数では決まらない(issue #1567)。DB の comfyui_base_url に
      # scripts/e2e-clear-llm-db-overrides.sh がスタブの URL を投入する(issue #1106 以来の経路:
      # media-service は ComfyUiClient が呼ぶ都度 platform の image-generation-config から baseUrl を取り、
      # platform 自身の ConnectedServiceStatusService(連携サービスの状況)も同じ DB の値の
      # /system_stats を叩くため、スタブがその経路を実装している)。
      # 演算デバイス切り替え(issue #1399)の向き先だけを Docker Engine API スタブへ向ける。
      # 成功判定の /system_stats は上の DB の comfyui_base_url(= comfyui-stub)が応える。
      # 待機の上限は受け入れテストが失敗シナリオを現実的な時間で確かめられるよう10秒に縮める(既定180秒)。
      COMPUTE_DEVICE_DOCKER_BASE_URL: http://docker-engine-stub:8080
      COMPUTE_DEVICE_APPLY_TIMEOUT_SECONDS: "10"
    depends_on:
      llm-stub:
        condition: service_healthy
      image-stub:
        condition: service_healthy
      comfyui-stub:
        condition: service_healthy
      docker-engine-stub:
        condition: service_healthy

  # 画像生成の実行者。向き先そのものは上の platform が決める(プロジェクト設定 → DB の system_settings、
  # AppSettingService が正、issue #531 / #1567)。media の ComfyUiClient は呼ぶ都度
  # platform の /api/internal/platform/image-generation-config から baseUrl を取り、環境変数は読まない
  # (media の COMFYUI_BASE_URL は廃止した、issue #1567)。ここではスタブの起動待ちだけを宣言する。
  media:
    environment:
      # ChatGPT 画像生成の向き先を image-stub にする(#1569)。上のコメント(ai)を参照。
      SPRING_PROFILES_ACTIVE: e2e-stubs
    depends_on:
      comfyui-stub:
        condition: service_healthy

  # project-service の X 接続(#1574)。トークン交換と自分の情報は x-stub へ(コンテナ間)、
  # 利用者のブラウザが開く認可画面はホストから見える 127.0.0.1:18088 の x-stub へ向ける。
  project:
    environment:
      X_API_BASE_URL: http://x-stub:8080
      X_AUTHORIZE_URL: http://127.0.0.1:18088/i/oauth2/authorize
      # Threads の接続(#1579)も同じ方式。認可画面はホストから見える 127.0.0.1:18090 の threads-stub へ向ける。
      THREADS_API_BASE_URL: http://threads-stub:8080
      THREADS_AUTHORIZE_URL: http://127.0.0.1:18090/oauth/authorize
      # Facebook の接続(#1580)も同じ方式。認可画面はホストから見える 127.0.0.1:18091 の facebook-stub へ向ける。
      FACEBOOK_API_BASE_URL: http://facebook-stub:8080
      FACEBOOK_AUTHORIZE_URL: http://127.0.0.1:18091/dialog/oauth
    depends_on:
      x-stub:
        condition: service_healthy
      threads-stub:
        condition: service_healthy
      facebook-stub:
        condition: service_healthy

  # publishing-service も GitHub の Pull Request / contents / comments API を使う(#1333)。
  # 実 GitHub へ向けると受け入れテストが本リポジトリの PR を汚すので、github-stub へ向ける(#1334)。
  publishing:
    environment:
      GITHUB_API_BASE_URL: http://github-stub:8080
    depends_on:
      github-stub:
        condition: service_healthy

  analytics:
    environment:
      GOOGLE_ANALYTICS_DATA_API_BASE_URL: http://ga-stub:8080
      # GAはユーザーOAuthへ移行した(#1231)。トークン交換とプロパティ一覧(Admin API)もga-stubへ向ける。
      GOOGLE_ANALYTICS_ADMIN_API_BASE_URL: http://ga-stub:8080
      GOOGLE_ANALYTICS_OAUTH_TOKEN_URI: http://ga-stub:8080/token
      ADSENSE_DATA_API_BASE_URL: http://adsense-stub:8080
      GOOGLE_OAUTH_TOKEN_URI: http://adsense-stub:8080/token
    depends_on:
      ga-stub:
        condition: service_healthy
      adsense-stub:
        condition: service_healthy
