server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

spring:
  application:
    name: lets-blog-api
  datasource:
    url: jdbc:mysql://localhost:3306/lets_blog_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  encryption-key: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  mail:
    from: test@letsblog.example.com
  web:
    base-url: http://localhost:3000
  ollama-base-url: http://localhost:11434
  ollama-model: qwen2.5:7b-instruct
  comfyui-base-url: http://localhost:8188
  comfyui-checkpoint: v1-5-pruned-emaonly.safetensors
  comfyui-models-path: /tmp/comfyui-models
  brave-search-base-url: https://api.search.brave.com
  brave-search-api-key: test-key
  plantuml-base-url: http://localhost:8085
  wordpress-provision-base-url: http://localhost:9000
  wordpress-provision-token: test-token
  bulk-upload-storage-path: /tmp/bulk-uploads
  generated-images-storage-path: /tmp/generated-images
  vscode-extension-source-path: /tmp/extension-src
  vscode-extension-build-path: /tmp/extension-build
  backup-mysql-host: localhost
  backup-mysql-port: 3306
  backup-mysql-database: lets_blog_test
  backup-mysql-user: test_user
  backup-mysql-password: test_pass
