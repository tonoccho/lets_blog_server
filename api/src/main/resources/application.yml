server:
  port: 8080

logging:
  level:
    root: INFO
    com.letsblog.api: DEBUG
    org.springframework.web: DEBUG
  path: ./logs
  json:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      logback: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

spring:
  application:
    name: lets-blog-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lets_blog?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lbs_app}
    password: ${SPRING_DATASOURCE_PASSWORD:lbs_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # マイグレーションSQL内でメールテンプレートのThymeleaf構文 [[${var}]] を使うため、
    # Flyway自身の ${...} プレースホルダー置換とぶつからないよう無効化する
    placeholder-replacement: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  encryption-key: ${APP_ENCRYPTION_KEY:}
  mail:
    from: ${APP_MAIL_FROM:noreply@letsblog.example.com}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:qwen2.5:7b-instruct}
  comfyui-base-url: ${COMFYUI_BASE_URL:http://localhost:8188}
  comfyui-checkpoint: ${COMFYUI_CHECKPOINT:v1-5-pruned-emaonly.safetensors}
  comfyui-models-path: ${COMFYUI_MODELS_PATH:/app/data/comfyui-models}
  brave-search-base-url: ${BRAVE_SEARCH_BASE_URL:https://api.search.brave.com}
  brave-search-api-key: ${BRAVE_SEARCH_API_KEY:}
  plantuml-base-url: ${PLANTUML_BASE_URL:http://localhost:8085}
  wordpress-provision-base-url: ${WORDPRESS_PROVISION_BASE_URL:http://localhost:9000}
  wordpress-provision-token: ${WP_PROVISION_TOKEN:}
  bulk-upload-storage-path: ${BULK_UPLOAD_STORAGE_PATH:/app/data/bulk-uploads}
  generated-images-storage-path: ${GENERATED_IMAGES_STORAGE_PATH:/app/data/generated-images}
  vscode-extension-source-path: ${VSCODE_EXTENSION_SOURCE_PATH:/app/extension-src}
  vscode-extension-build-path: ${VSCODE_EXTENSION_BUILD_PATH:/app/extension-build}
  backup-mysql-host: ${BACKUP_MYSQL_HOST:localhost}
  backup-mysql-port: ${BACKUP_MYSQL_PORT:3306}
  backup-mysql-database: ${BACKUP_MYSQL_DATABASE:lets_blog}
  backup-mysql-user: ${BACKUP_MYSQL_USER:lbs_app}
  backup-mysql-password: ${BACKUP_MYSQL_PASSWORD:lbs_app}

resilience4j:
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: false
        limitRefreshPeriod: 1m
        limitForPeriod: 100
        timeoutDuration: 1s
        allowHealthIndicatorToFail: true
    instances:
      api-global:
        baseConfig: default
        limitForPeriod: ${API_RATE_LIMIT_REQUESTS:100}
        limitRefreshPeriod: ${API_RATE_LIMIT_PERIOD:1m}
      auth-endpoint:
        baseConfig: default
        limitForPeriod: ${AUTH_RATE_LIMIT_REQUESTS:5}
        limitRefreshPeriod: ${AUTH_RATE_LIMIT_PERIOD:1m}
      upload-endpoint:
        baseConfig: default
        limitForPeriod: ${UPLOAD_RATE_LIMIT_REQUESTS:10}
        limitRefreshPeriod: ${UPLOAD_RATE_LIMIT_PERIOD:1h}
