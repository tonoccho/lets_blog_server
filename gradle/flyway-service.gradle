// サービス別Flywayの設定テンプレート(#570, ADR-0004)。
// 新規サービスのbuild.gradleから次のように読み込んで使う:
//
//   apply from: "${rootDir}/gradle/flyway-service.gradle"
//
// スキーマ名・接続先(datasource URL)・マイグレーション配置場所はサービスごとに異なるため
// ここでは持たない。各サービスのapplication.ymlでの設定方法は
// docs/SERVICE_SCHEMA_MIGRATION.md を参照。
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
}
