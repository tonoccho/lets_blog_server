// ComfyUI アダプター(#1813): 画像生成の契約(docs/plugins/CONTRACTS.md §2・§4.4)を話し、ComfyUI のワークフローへ翻訳する
// 参照プラグイン。Spring は使わず、JDK の HttpServer / HttpClient と Jackson だけで動く(単体で起動できる軽さを優先)。
// compose へは同梱しない。起動は docs/plugins/comfyui-adapter.md。
plugins {
    id 'java'
    id 'application'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.letsblog.plugins.comfyui.ComfyUiAdapter'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
