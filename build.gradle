// ルートビルド。各サブプロジェクト(packages/*, services/*)はこのビルドの一部として扱われる。
// checkstyle / jacoco / dependencyCheck は、各サブプロジェクトが該当プラグインを
// 適用している場合にのみ、ここで定義した共通設定を適用する(プラグインの適用有無自体は
// 各サブプロジェクトの build.gradle が決める)。

subprojects {
    group = 'com.letsblog'
    version = '0.4.3-DEVELOP'

    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    // #1109: `docker compose up -d --force-recreate <svc>` は mysql もオーバレイ無しで作り直し、
    // 127.0.0.1:3306 の公開を黙って外す。DB依存テストが変更と無関係に大量に落ちるので、
    // 到達できないときは「環境要因」と明示して警告する。失敗にはしない(DB非依存の単体テストは動かす)。
    // #1257: システム内部の時刻はすべてUTC。ホストのTZ(例: Pacific/Auckland)に関係なく、
    // テストJVMはUTCで動かす。TZ は子プロセスへ、user.timezone はJVM既定ゾーンへ効く。
    plugins.withId('java') {
        tasks.withType(Test).configureEach {
            environment 'TZ', 'UTC'
            systemProperty 'user.timezone', 'UTC'
            // #1633: テストJVMの総メモリを固定する。ヒープ以外(Metaspace・コードキャッシュ・
            // ダイレクトメモリ)は既定だと無制限で、ヒープ上限(512m)を大きく超えて常駐する。
            maxHeapSize = '512m'
            maxParallelForks = 1
            jvmArgs '-XX:MaxMetaspaceSize=256m', '-XX:ReservedCodeCacheSize=128m', '-XX:MaxDirectMemorySize=128m'
        }
    }

    plugins.withId('java') {
        tasks.withType(Test).configureEach {
            doFirst {
                try {
                    def host = System.getenv('TEST_DB_HOST') ?: '127.0.0.1'
                    def port = (System.getenv('TEST_DB_PORT') ?: '3306') as int
                    def socket = new java.net.Socket()
                    try {
                        socket.connect(new java.net.InetSocketAddress(host, port), 1000)
                    } catch (IOException e) {
                        logger.warn("""
                            |WARNING: ${host}:${port} に到達できません。これは環境要因(3306が公開されていない)です。
                            |  DB依存テストは FlywaySqlUnableToConnectToDbException / ConnectException で落ちます。
                            |  コードの不具合ではありません。復旧:
                            |    docker compose -f docker-compose.yml -f docker-compose.host-tests.yml up -d mysql
                            |  詳細: scripts/check-test-db.sh --reachability / docs/TEST_DOCUMENTATION.md""".stripMargin())
                    } finally {
                        socket.close()
                    }
                } catch (Exception e) {
                    logger.info("test DB reachability check skipped: ${e}")
                }
            }
        }
    }

    plugins.withId('checkstyle') {
        checkstyle {
            configFile = rootProject.file('config/checkstyle.xml')
            ignoreFailures = false
            showViolations = true
        }

        tasks.named('checkstyleMain') {
            reports {
                xml.required = true
                html.required = true
            }
        }

        tasks.register('lint') {
            dependsOn tasks.named('checkstyleMain')
            doLast {
                println "✓ Lint check passed"
            }
        }
    }

    plugins.withId('jacoco') {
        jacoco {
            toolVersion = '0.8.11'
        }
    }

    plugins.withId('org.owasp.dependencycheck') {
        dependencyCheck {
            format = 'HTML'
            suppressionFile = rootProject.file('config/dependency-check-suppression.xml').path
            failBuildOnCVSS = 7.0
        }
    }
}
