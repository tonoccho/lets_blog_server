name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      # issue #810: web は tsconfig の paths で "@api-client": ["../sdk/api-client/src"] を
      # 参照しており、sdk/api-client に型レベルで依存している。sdk 側の変更でこのワークフローが
      # 起動しないと、web の型エラーを CI で検知できない(#739 で実際に踏み、17件の型エラーが
      # CI をすり抜けた)。
      - 'sdk/**'
      - 'orval.config.js'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'sdk/**'
      - 'orval.config.js'
      - '.github/workflows/frontend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # issue #810: sdk/api-client 自体の型チェック。web の型チェックは path mapping 経由で
      # index.ts から到達できるファイルしか見ないため、再エクスポートされていない生成物は
      # どのビルドでも型検査されない。ここで include 指定の tsconfig を使って src 配下を全て見る。
      - name: Install sdk/api-client dependencies
        run: npm ci
        working-directory: sdk/api-client

      - name: Type check sdk/api-client
        run: npm run typecheck
        working-directory: sdk/api-client

      - name: Run linter
        run: npm run lint
        working-directory: web

      - name: Build Next.js with type checking
        run: npm run build
        working-directory: web

      - name: Run unit tests
        run: npm test -- --passWithNoTests
        working-directory: web

      - name: Generate coverage report
        run: npm run test:coverage
        working-directory: web
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./web/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: Install Playwright browsers
        run: npx playwright install
        working-directory: web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: web
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
