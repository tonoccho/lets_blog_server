name: Database Migration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/src/main/resources/db/migration/**'
      - 'api/build.gradle'
      - '.github/workflows/migration-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/src/main/resources/db/migration/**'
      - 'api/build.gradle'
      - '.github/workflows/migration-test.yml'

jobs:
  migration-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: lets_blog_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run migration tests
        run: |
          cd api
          ./gradlew test "-Dspring.datasource.url=jdbc:mysql://localhost:3306/lets_blog_test?useSSL=false&serverTimezone=UTC" \
            -Dspring.datasource.username=test_user \
            -Dspring.datasource.password=test_pass \
            -Dspring.test.database.replace=any \
            --tests "com.letsblog.api.migration.*"

      - name: Run idempotency test
        run: |
          cd api
          ./gradlew test "-Dspring.datasource.url=jdbc:mysql://localhost:3306/lets_blog_test?useSSL=false&serverTimezone=UTC" \
            -Dspring.datasource.username=test_user \
            -Dspring.datasource.password=test_pass \
            -Dspring.test.database.replace=any \
            --tests "com.letsblog.api.migration.MigrationIdempotencyTest"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api/build/test-results/
