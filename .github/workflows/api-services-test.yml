name: API Services Tests

# マルチサービス構成向けのCI(#557)。packages/lbs-common と services/* が同じGradle
# マルチプロジェクトビルド(ルートのsettings.gradle/build.gradle)にまとまったため、
# サービス単位のマトリクスで、変更のあったサービスだけをビルド・テストする。
# GitHub Actions自体は現状意図的に無効化されている(README/CLAUDE.md参照)。本ワークフローは
# 定義の更新のみが目的で、有効化の是非は別スコープ。

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'packages/lbs-common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/api-services-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'packages/lbs-common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      lbs-common: ${{ steps.filter.outputs.lbs-common }}
      log-writer: ${{ steps.filter.outputs.log-writer }}
      gateway: ${{ steps.filter.outputs.gateway }}
      identity: ${{ steps.filter.outputs.identity }}
      content: ${{ steps.filter.outputs.content }}
      ai: ${{ steps.filter.outputs.ai }}
      analytics: ${{ steps.filter.outputs.analytics }}
      media: ${{ steps.filter.outputs.media }}
      platform: ${{ steps.filter.outputs.platform }}
      project: ${{ steps.filter.outputs.project }}
      publishing: ${{ steps.filter.outputs.publishing }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lbs-common:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            log-writer:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/log-writer/**'
            gateway:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/gateway/**'
            identity:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/identity/**'
            content:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/content/**'
            ai:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/ai/**'
            analytics:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/analytics/**'
            media:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/media/**'
            platform:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/platform/**'
            project:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/project/**'
            publishing:
              - 'packages/lbs-common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'services/publishing/**'

  test:
    needs: detect-changes
    if: |
      (matrix.service == 'lbs-common' && needs.detect-changes.outputs.lbs-common == 'true') ||
      (matrix.service == 'log-writer' && needs.detect-changes.outputs.log-writer == 'true') ||
      (matrix.service == 'gateway' && needs.detect-changes.outputs.gateway == 'true') ||
      (matrix.service == 'identity' && needs.detect-changes.outputs.identity == 'true') ||
      (matrix.service == 'content' && needs.detect-changes.outputs.content == 'true') ||
      (matrix.service == 'ai' && needs.detect-changes.outputs.ai == 'true') ||
      (matrix.service == 'analytics' && needs.detect-changes.outputs.analytics == 'true') ||
      (matrix.service == 'media' && needs.detect-changes.outputs.media == 'true') ||
      (matrix.service == 'platform' && needs.detect-changes.outputs.platform == 'true') ||
      (matrix.service == 'project' && needs.detect-changes.outputs.project == 'true') ||
      (matrix.service == 'publishing' && needs.detect-changes.outputs.publishing == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [lbs-common, log-writer, gateway, identity, content,
                  ai, analytics, media, platform, project, publishing]

    # content/identity/log-writer 等のテストがMySQLを使う(#570のスキーマ分離により、
    # いずれも lbs_<service>_test という専用スキーマ。contentは#576、
    # identity/log-writerは#772で追加した)。
    # lbs-common/gatewayには不要だが、マトリクスジョブ単位でしか services: を定義できないため、
    # 無害な待機コストとして許容する。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: lets_blog_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve Gradle project path and build directory
        id: project
        run: |
          if [ "${{ matrix.service }}" = "lbs-common" ]; then
            echo "path=:packages:lbs-common" >> "$GITHUB_OUTPUT"
            echo "dir=packages/lbs-common" >> "$GITHUB_OUTPUT"
          else
            echo "path=:services:${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "dir=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run linter
        run: ./gradlew ${{ steps.project.outputs.path }}:lint

      # サービス専用のテストスキーマを作る(infra/mysql/init/02-create-test-schemas.sh のCI版)。
      # 各サービスの src/test/resources/application-test.yml が参照する
      # (ADR-0006: Testcontainersは使わず実MySQLに接続する)。identity / log-writer 分は
      # issue #772 で AuthorizationMatrixIntegrationTest を追加したときに足した。
      #
      # issue #790: DBを使わない lbs-common / gateway 以外はすべて専用スキーマを持つ。
      # 列挙漏れを黙って通さないよう、case に該当しないサービスは明示的に失敗させる
      # (マトリクスへ追加したのにスキーマを足し忘れると、DB接続エラーという分かりにくい形で
      # 落ちるため)。issue #583 で legacy-api(唯一の共有DB利用者)を削除した。
      - name: Create service test schema
        if: >-
          matrix.service != 'lbs-common' && matrix.service != 'gateway'
        run: |
          case "${{ matrix.service }}" in
            content)    schema=lbs_content_test ;;
            identity)   schema=lbs_identity_test ;;
            log-writer) schema=lbs_log_test ;;
            ai)         schema=lbs_ai_test ;;
            analytics)  schema=lbs_analytics_test ;;
            media)      schema=lbs_media_test ;;
            platform)   schema=lbs_platform_test ;;
            project)    schema=lbs_project_test ;;
            publishing) schema=lbs_publishing_test ;;
            *)
              echo "テストスキーマの割り当てが未定義です: ${{ matrix.service }}" >&2
              echo "マトリクスへサービスを追加したら、ここにも lbs_<service>_test を足すこと(issue #790)。" >&2
              exit 1
              ;;
          esac
          mysql -h 127.0.0.1 -P 3306 -u root -ptestpass -e "
            CREATE DATABASE IF NOT EXISTS ${schema} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON ${schema}.* TO 'test_user'@'%';
            FLUSH PRIVILEGES;"

      - name: Run unit tests with coverage
        run: ./gradlew ${{ steps.project.outputs.path }}:test ${{ steps.project.outputs.path }}:jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./${{ steps.project.outputs.dir }}/build/reports/jacoco/test/jacocoTestReport.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
        continue-on-error: true

      - name: Generate coverage badge data
        if: always()
        run: |
          REPORT="${{ steps.project.outputs.dir }}/build/reports/jacoco/test/jacocoTestReport.xml"
          if [ -f "$REPORT" ]; then
            echo "✓ JaCoCo coverage report generated"
            COVERAGE=$(grep -oP 'covered="\K[^"]*' "$REPORT" | head -1)
            echo "Coverage: $COVERAGE%"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            ${{ steps.project.outputs.dir }}/build/test-results/
            ${{ steps.project.outputs.dir }}/build/reports/jacoco/test/
          retention-days: 30
