name: API Tests and Coverage

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/api-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: lets_blog_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x api/gradlew

      - name: Run linter
        working-directory: api
        run: ./gradlew lint

      - name: Run unit tests with coverage
        working-directory: api
        run: |
          ./gradlew test jacocoTestReport \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/lets_blog_test?useSSL=false&serverTimezone=UTC \
            -Dspring.datasource.username=test_user \
            -Dspring.datasource.password=test_pass \
            -Dspring.test.database.replace=any

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./api/build/reports/jacoco/test/jacocoTestReport.xml
          flags: api
          name: api-coverage
        continue-on-error: true

      - name: Generate coverage badge data
        if: always()
        run: |
          cd api
          if [ -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
            echo "✓ JaCoCo coverage report generated"
            # Extract coverage percentage from XML
            COVERAGE=$(grep -oP 'covered="\K[^"]*' build/reports/jacoco/test/jacocoTestReport.xml | head -1)
            echo "Coverage: $COVERAGE%"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            api/build/test-results/
            api/build/reports/jacoco/test/
          retention-days: 30
