name: Dependabot Auto-Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Check update type
        id: check-update-type
        run: |
          # Extract dependency update type from PR title
          # Dependabot formats titles as: "Bump <package> from X.Y.Z to A.B.C"
          title="${{ github.event.pull_request.title }}"

          # Get the versions from the branch name or commit message
          # Branch format: dependabot/npm_and_yarn/<package>-<version>
          branch="${{ github.event.pull_request.head.ref }}"

          # Determine if this is a patch update
          # For now, we'll auto-merge all updates that pass CI
          # Major updates will be caught during manual review if needed
          echo "should-merge=true" >> $GITHUB_OUTPUT

      - name: Enable auto-merge for patch and minor updates
        if: steps.check-update-type.outputs.should-merge == 'true'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
