name: Performance Testing

on:
  push:
    branches:
      - develop
      - feature/issue-24
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  jmh-benchmarks:
    name: JMH Micro-Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x api/gradlew

      - name: Run JMH Benchmarks
        working-directory: api
        run: ./gradlew jmh --info
        continue-on-error: true

      - name: Parse benchmark results
        if: always()
        run: |
          if [ -f "api/build/results/jmh/results.json" ]; then
            echo "Benchmark Results:"
            cat api/build/results/jmh/results.json | jq .
          else
            echo "No benchmark results found"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: api/build/results/jmh/
          retention-days: 30

  k6-load-tests:
    name: k6 Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      api:
        image: openjdk:21-jdk
        options: >-
          -v ${{ github.workspace }}/api:/app
          -w /app
          --health-cmd="curl -f http://localhost:8080/actuator/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build API
        working-directory: api
        run: |
          chmod +x gradlew
          ./gradlew clean build -DskipTests=true
          java -jar build/libs/api-*.jar > api.log 2>&1 &
          sleep 30
          curl -f http://localhost:8080/actuator/health || (cat api.log && exit 1)

      - name: Run k6 Render Endpoint Load Test
        working-directory: api/performance-tests
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          k6 run --out json=render-results.json load-test-render-endpoint.js
          echo "Render test completed"
        continue-on-error: true

      - name: Run k6 Database Queries Load Test
        working-directory: api/performance-tests
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          k6 run --out json=db-results.json load-test-database-queries.js
          echo "Database queries test completed"
        continue-on-error: true

      - name: Run k6 Spike Test
        working-directory: api/performance-tests
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          k6 run --out json=spike-results.json load-test-spike.js
          echo "Spike test completed"
        continue-on-error: true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: api/performance-tests/*-results.json
          retention-days: 30

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## Performance Test Results\n\n';
            comment += '✅ Performance tests completed!\n\n';
            comment += '**Test Summary:**\n';
            comment += '- JMH Micro-benchmarks: [Artifacts](../actions/runs/${{ github.run_id }})\n';
            comment += '- k6 Load Tests (Render): [Artifacts](../actions/runs/${{ github.run_id }})\n';
            comment += '- k6 Load Tests (Database): [Artifacts](../actions/runs/${{ github.run_id }})\n';
            comment += '- k6 Spike Test: [Artifacts](../actions/runs/${{ github.run_id }})\n\n';
            comment += 'See uploaded artifacts for detailed results.\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  performance-check:
    name: Performance Threshold Check
    runs-on: ubuntu-latest
    needs: [jmh-benchmarks, k6-load-tests]
    if: always()
    steps:
      - name: Download JMH results
        uses: actions/download-artifact@v4
        with:
          name: jmh-results
          path: jmh-results
        continue-on-error: true

      - name: Download k6 results
        uses: actions/download-artifact@v4
        with:
          name: k6-results
          path: k6-results
        continue-on-error: true

      - name: Check thresholds
        run: |
          echo "Performance Test Threshold Check"
          echo "=================================="
          echo ""
          echo "JMH Benchmarks:"
          if [ -f "jmh-results/results.json" ]; then
            echo "✓ Benchmark results available"
          else
            echo "⚠ Benchmark results not found"
          fi
          echo ""
          echo "k6 Load Tests:"
          if [ -f "k6-results/render-results.json" ]; then
            echo "✓ Render endpoint test results available"
          fi
          if [ -f "k6-results/db-results.json" ]; then
            echo "✓ Database queries test results available"
          fi
          if [ -f "k6-results/spike-results.json" ]; then
            echo "✓ Spike test results available"
          fi
          echo ""
          echo "See artifacts for detailed results and metrics."
