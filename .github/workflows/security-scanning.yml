name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - directory: "web"
            name: "Frontend"
          - directory: "extension"
            name: "Extension"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.directory }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate --json > audit-report.json
        working-directory: ${{ matrix.directory }}
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.name }}
          path: ${{ matrix.directory }}/audit-report.json
        if: always()

  gradle-dependency-check:
    name: Gradle Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run dependency check
        run: |
          cd api
          ./gradlew dependencyCheckAnalyze
        continue-on-error: true

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependency-check
          path: |
            api/build/reports/dependency-check-report.html
            api/build/reports/dependency-check-report.json
        if: always()
        continue-on-error: true

  license-scanning:
    name: License Compliance Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - directory: "web"
            name: "Frontend"
          - directory: "extension"
            name: "Extension"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.directory }}

      - name: Check licenses
        run: |
          npm install -g npm-check-licenses
          npm-check-licenses --onlyAllow "MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,LGPL-2.1,LGPL-3.0,MPL-2.0" || true
        working-directory: ${{ matrix.directory }}
        continue-on-error: true

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for security files
        run: |
          echo "Checking for security configuration files..."

          if [ -f "SECURITY.md" ]; then
            echo "✓ SECURITY.md exists"
          else
            echo "✗ SECURITY.md is missing"
            exit 1
          fi

          if [ -f ".gitignore" ]; then
            echo "✓ .gitignore exists"
          else
            echo "✗ .gitignore is missing"
            exit 1
          fi

  sbom-generation:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install cyclonedx-npm
        run: npm install -g @cyclonedx/npm
        continue-on-error: true

      - name: Generate SBOM for Frontend
        run: |
          cd web
          cyclonedx-npm --output-file ../sbom-frontend.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: sbom-*.json
        if: always()
        continue-on-error: true
