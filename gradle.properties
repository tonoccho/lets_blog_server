# #1633: Gradle の総メモリ(RSS)を固定値で抑える。根拠と実測は docs/TEST_DOCUMENTATION.md「Gradle のメモリ予算」。
# org.gradle.jvmargs を書くと既定値は引き継がれないので、必要な値はすべてここに明示する。
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=128m
# 並列度: parallel=false と maxParallelForks=1 は既定どおり。workers.max=4 は既定(CPU コア数=8)より意図して絞った値。
org.gradle.parallel=false
org.gradle.workers.max=4
# pipeline から起動したデーモンはユニットの cgroup に残りメモリ枠を消費し続けるので、既定の3時間より短くする。
org.gradle.daemon.idletimeout=900000
