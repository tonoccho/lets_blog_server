# WebSocket(Next.js HMR / ComfyUI 進捗通知)共通アップグレード設定
# ("map" ディレクティブは http コンテキスト直下でのみ許可されるため server 外に配置)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS リダイレクト
server {
    listen 80;
    server_name localhost;

    # コンテナ内ヘルスチェック専用の入口(issue #588)。docker-compose.ymlの
    # reverse-proxyのhealthcheckがこれを叩く。HTTPSへリダイレクトすると
    # 自己署名証明書の検証でヘルスチェックが不安定になるため、80番で完結させる
    # (このlocationはnginx自身が即応答し、上流サービスには依存しない)。
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 画像アップロード等に対応するため上限を引き上げる
    client_max_body_size 100M;

    # Auth.js(NextAuth)が内部で使う /api/auth/* はNext.js(web)自身のルートであり、
    # Spring Boot側も同じ /api/auth プレフィックス(signup/login/totp等)を使っているため衝突する。
    # 両者のリーフパスに重複はないため、NextAuth固有のパスだけ正規表現locationで先にwebへ振り分ける
    # (nginxは正規表現locationを通常のprefix locationより優先して評価するため、下の /api/ より先に一致する)
    #
    # _log はNextAuthのクライアントサイド診断ロガーの送信先(issue #781)。これが漏れていたため
    # gatewayへ転送され、(a) 下流に該当エンドポイントが無く401になり、(b) gatewayの
    # RateLimitWebFilterが /api/auth/* を一律 auth-endpoint バケット
    # (5 req/60s、プロセス全体で1バケット)へ計上していた。24時間の実測で77件(401が67件、
    # 429が10件)が観測され、ブラウザのログノイズだけで全ユーザーのログイン試行が
    # 429で弾かれうる自己DoS経路になっていた。NextAuthの他のパスと同じくwebで完結させる。
    location ~ ^/api/auth/(session|csrf|providers|signin|signout|error|callback|_log)(/.*)?$ {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # issue #564でKeycloakへ移行後、NextAuthのJWTセッションにaccessToken/refreshToken/idToken
        # (いずれもKeycloak発行のJWT)を保持するようになり、暗号化したセッションcookieが
        # nginxの既定バッファ(4k)を超える(NextAuthは4kを超えるcookieを
        # __Secure-next-auth.session-token.0/.1/...へ自動分割するが、/api/auth/callback/*の
        # レスポンスはこれらSet-Cookieを全て一度に返すため、ヘッダー合計がすぐ既定値を超える。
        # 実機検証で約5.5KBに達し、既定設定では"upstream sent too big header"で502になることを確認済み)。
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # ダッシュボードの状態パネル(issue #876)。Next.jsのRoute Handlerへ振り分ける。
    #
    # これらのRoute Handler(apps/web/src/app/api/dashboard/**)は、ブラウザからの呼び出しに
    # 認証を付けるために存在する。apps/web/src/lib/apiClient.ts は `server-only` で、
    # next-authのgetToken()がセッションCookie(HttpOnly)から取り出したアクセストークンを
    # Authorizationヘッダーに載せる。ブラウザ側にはこの手段が無い
    # (fetchは素で呼んでおり、EventSourceは仕様上ヘッダーを付けられない)。
    #
    # しかし下の location /api/ が /api/** を一律gatewayへ送るため、この中継に到達せず、
    # 認証なしでplatform-service(#695でDashboardControllerを移設、#705以降は認証必須)を
    # 叩いて401になっていた。しかもパネル側は `if (!res.ok) return;` で握り潰すため、
    # 画面上は「データが無い」ようにしか見えなかった(#782の調査で判明)。
    #
    # prefix locationは最長一致が優先されるため、この location が下の /api/ より先に効く。
    # SSE(/stream)がバッファリングされずに流れるよう proxy_buffering off を設定する。
    location /api/dashboard/ {
        set $upstream_web_dashboard web:3000;
        proxy_pass http://$upstream_web_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 仲介API(#560でgateway経由に統一。gatewayがルーティング/JWT検証/レート制限/相関IDを担う)。
    # プロジェクト環境間同期・一括管理・記事公開など重い処理向けの個別タイムアウト延長は、
    # gateway側のルート単位のresponse-timeout設定(services/gateway/src/main/resources/
    # application.yml)へ移した。SSEエンドポイント(/api/dashboard/*-status/stream)が
    # バッファリングされずに流れるよう proxy_buffering off も設定する。
    location /api/ {
        set $upstream_gateway gateway:8080;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # issue #639時点では、ここで旧actor詐称可能ヘッダー(実行者ID/実行者ロールの自己申告用)を
        # 空文字で上書きして除去していた。legacy-api/identity-serviceのCurrentActorServiceが
        # JWT未提示時にこれらのヘッダーをそのまま信頼していたためだが、issue #566でその信頼
        # (ヘッダーベースのフォールバック)自体を撤去しKeycloakのJWTのみを信頼するよう
        # 全面移行したことに伴い、これらのヘッダーはどのサービスにとっても何の意味も持たない
        # 単なる任意ヘッダーとなったため、nginx側の特別な除去も不要になり撤去した
        # (services/gateway/.../ProxyHandlerのJavadocも参照)。
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # Keycloak(認証基盤。#559)。KC_HTTP_RELATIVE_PATH=/authでKeycloak自身がサブパス配信に
    # 対応しているため、phpMyAdmin/ComfyUIのようなプレフィックス書き換えは不要で、
    # /auth/ 配下をそのままKeycloakへ透過的に転送するだけでよい。KC_PROXY_HEADERS=xforwarded
    # としているため、Keycloakが公開URL(issuer等)を正しく組み立てられるよう
    # X-Forwarded-Host/Portも明示的に渡す。
    location /auth/ {
        set $upstream_keycloak keycloak:8080;
        proxy_pass http://$upstream_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # phpMyAdmin(PMA_ABSOLUTE_URI をコンテナ側で設定し、サブパス配下でのリンク生成に対応)
    # 注: proxy_pass に変数を使う場合、URI部分によるプレフィックス自動除去が効かないため
    # rewrite ... break で明示的にプレフィックスを除去してから転送する
    location /phpmyadmin/ {
        set $upstream_phpmyadmin phpmyadmin:80;
        rewrite ^/phpmyadmin/(.*)$ /$1 break;
        proxy_pass http://$upstream_phpmyadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ComfyUI(SPA。静的アセット・WebSocket("/ws")はサブパス非対応のため、
    # HTMLレスポンス内のルート相対パスをsub_filterで書き換える。要実機検証)
    location /comfyui/ {
        set $upstream_comfyui comfyui:8188;
        rewrite ^/comfyui/(.*)$ /$1 break;
        proxy_pass http://$upstream_comfyui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        sub_filter 'href="/' 'href="/comfyui/';
        sub_filter 'src="/' 'src="/comfyui/';
    }

    # PlantUML
    location /plantuml/ {
        set $upstream_plantuml plantuml:8080;
        rewrite ^/plantuml/(.*)$ /$1 break;
        proxy_pass http://$upstream_plantuml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # draw.io(自己ホスト、embed mode)。jgraph/drawioイメージはコンテナ内でJS/CSS等の
    # 静的アセットをルート("/")配下にも展開しているため、ComfyUIと異なりsub_filterでの
    # パス書き換えは不要(実機で/drawio/配下のHTML・JSアセット取得を確認済み)。
    location /drawio/ {
        set $upstream_drawio drawio:8080;
        rewrite ^/drawio/(.*)$ /$1 break;
        proxy_pass http://$upstream_drawio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web管理画面のサイト編集ページ(/sites/{id}/edit、idは常に数値のDB主キー)。
    # 下のWordPressサブディレクトリ用正規表現(/sites/{slug})は "22" のような数値も
    # スラッグとして許容してしまい先にマッチするため、より具体的なこちらを先に定義して優先させる
    # (nginxの正規表現locationはファイル中に現れる順序で先勝ちのため、順序が重要)。
    location ~ ^/sites/[0-9]+/edit$ {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # WordPress自動プロビジョニングサイト(サブディレクトリ設置型)
    # プレフィックス除去は行わない(Apache側のDocumentRoot構造とURLパスを一致させているため)。
    # 内部限定のプロビジョニングエージェント(ポート9000)はここに含めず、lbs-net内部通信のみに限定する。
    # 正規表現location: 素の /sites, /sites/ (スラッグなし)はWeb管理画面の「サイト管理」ページと
    # 名前空間が衝突するため、スラッシュ直後にスラッグ(1文字以上)を要求してマッチさせ、
    # 素のパスは下の location / (Web管理画面) へフォールスルーさせる。
    location ~ ^/sites/([a-z0-9-]+)(/.*)?$ {
        set $upstream_wordpress wordpress:80;
        proxy_pass http://$upstream_wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Penpot サブパスルーティング設定
    # https://localhost/penpot → http://penpot:80
    location /penpot {
        set $upstream_penpot penpot:80;
        proxy_pass http://$upstream_penpot/penpot;

        # HTTP/1.1 upgrade for WebSocket (real-time collaboration)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (real-time collaboration・大規模デザイン操作用に長めに設定)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffers (静的アセット転送最適化)
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Webフロント(Next.js dev server、lbs-net内のwebコンテナ)
    # プラグイン/テーマzipのアップロード(Server Actions経由)が100MBを超える場合があるため上限を引き上げる
    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }
}
