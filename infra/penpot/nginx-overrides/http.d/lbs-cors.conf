# issue #1093: https://localhost/penpot/ (reverse-proxy 経由) と http://localhost:9001/
# (直接アクセス、#1012 の Out of Scope が名指しするハンドオフURL生成の前提経路) の両方を
# 壊さずに成立させるための CORS 許可リスト。
#
# PENPOT_PUBLIC_URI は http://localhost:9001 のまま据え置く(#1012まとめ参照)。
# これを https://localhost/penpot に変えると、今度は直接アクセス(http://localhost:9001/)
# 自身のAPI呼び出しがクロスオリジンになり、同じ壊れ方を直接アクセス側へ移すだけになる。
#
# 代わりに、penpot-frontend の内蔵nginx(公式の拡張ポイント /etc/nginx/overrides/)で
# https://localhost からの /api 呼び出しにだけ CORS ヘッダーを追加する。
# このファイルは http{} 直下(overrides/http.d/*.conf)に置く必要がある map 定義。
# server.d/lbs-cors-api.conf から $penpot_cors_allow_origin として参照する。
map $http_origin $penpot_cors_allow_origin {
    default "";
    "https://localhost" $http_origin;
}
