# issue #1093: /api への呼び出しに、許可した Origin (https://localhost) からのときだけ
# CORSヘッダーを付ける。$penpot_cors_allow_origin は overrides/http.d/lbs-cors.conf の map
# で決まり、許可された Origin 以外(Originヘッダーが無い同一オリジン呼び出しも含む)では
# 空文字になる。
#
# `location /api/`(末尾スラッシュ有り)は、素の image が定義する `location /api`
# (末尾スラッシュ無し)より長い前置一致になるため、/api/ 配下のリクエストはこちらが勝つ
# (nginxは前置一致の中で最長のものを選ぶ)。`/api` 単独(サブパス無し)へのリクエストは
# このSPAは送らないため、素のlocationのままで問題ない。
#
# Penpotのフロントエンドは `credentials: "include"` でfetchするため、
# Access-Control-Allow-Origin は `*` ではなく実際のOriginを返す必要があり、
# Access-Control-Allow-Credentials も要る。
#
# プリフライト(OPTIONS)はpenpot-backendへ転送しない。penpot-backendはOPTIONSを
# 特別扱いせず実際のRPCとして処理するため、エンドポイントによっては認可チェックで
# 401等を返す(例: get-enabled-flags)。ブラウザはプリフライト応答が2xxでない限り
# 本来のリクエストを送らせないため、ここでOPTIONSを204で完結させる。
# nginxは、あるcontextで`add_header`を1つでも宣言すると、親contextの`add_header`
# (ここでは `include /etc/nginx/nginx-security-headers.conf;` が設定する
# X-Content-Type-Options / Referrer-Policy / Permissions-Policy / X-Frame-Options)を
# 継承しなくなる。下のCORSヘッダー用`add_header`を足しただけではこれらが/api/配下の
# 応答から消えてしまうため、両方の分岐で明示的に再includeする。
location /api/ {
    if ($request_method = OPTIONS) {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Access-Control-Allow-Origin $penpot_cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    proxy_pass http://penpot-backend:6060/api/;
    proxy_buffering off;

    include /etc/nginx/nginx-security-headers.conf;
    add_header Access-Control-Allow-Origin $penpot_cors_allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Vary "Origin" always;
}
