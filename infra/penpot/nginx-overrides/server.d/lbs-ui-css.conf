# issue #1255: 素の image (penpotapp/frontend) の index.html は `css/ui.css?ts=...` を
# <link rel="stylesheet"> で参照するが、image は css/ には main.css しか同梱しておらず、
# ui.css は存在しない(アプリのスタイルは main.css に入っている)。そのため要求が SPA の
# フォールバックで 404 (text/html) になり、ブラウザが MIME 不一致でスタイルシートを拒否して
# コンソールにエラーを出していた。
#
# 参照そのものは image 内の index.html にあり直せないため、空の text/css を返して解消する。
# 画面の見た目には影響しない(元々読み込めていなかったファイル)。
# 上流が将来 ui.css を同梱しても、この完全一致 location が優先されるので衝突はしない
# (その時点でこのファイルを外す)。
location = /css/ui.css {
    include /etc/nginx/nginx-security-headers.conf;
    default_type text/css;
    return 200 "";
}
