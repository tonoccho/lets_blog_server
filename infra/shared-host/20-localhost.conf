# https://localhost を lets_blog_server の lbs-reverse-proxy へ中継する vhost(issue #1038)。
#
# **このファイルは本リポジトリでは読み込まれない。**同居している別スタックのリバースプロキシ
# (infra-proxy / /home/seiji/src/infra)の conf.d へ配置して使う。配置・検証・reload は
# scripts/setup-shared-host-proxy.sh が行う(冪等。点検だけなら --check)。
#
# infra 側に置くべき設定をこのリポジトリで管理するのは、妥協ではなく意図である。
# 手で書いた nginx 設定は差分にもレビューにも残らず、壊れたときに誰も経緯を辿れない。
# ここに置けば、変更が版管理とレビューと scripts/test_shared_host_proxy.py の検査を受ける。
#
# ------------------------------------------------------------------
# なぜ必要か
# ------------------------------------------------------------------
#
# 受け入れテストの baseURL は apps/web/playwright.config.ts で https://localhost に
# ハードコードされている(Keycloak の redirect_uri が
# https://localhost/api/auth/callback/keycloak として固定登録されており、実行時に
# 差し替えられないため)。これを受けるのは docker-compose.yml の reverse-proxy で、
# ホストの 80/443 を占有することを前提にしている。
#
# ところがこの開発機では、GitLab を提供する infra-proxy が先に 0.0.0.0:80 と
# 0.0.0.0:443 を占有している。**ポート競合の帰結はポート公開の失敗だけでは済まない。**
# Docker はネットワーク接続時にポート公開を行うため、公開に失敗したコンテナは
#
#     Error response from daemon: driver failed programming external connectivity ...
#     Bind for 0.0.0.0:80 failed: port is already allocated
#
# でネットワーク接続そのものに失敗し、**どのネットワークにも所属しないまま running になる**。
# 実測では lbs-reverse-proxy の NetworkSettings.Networks が {} で、コンテナ内には
# loopback しか無く、web:3000 も gateway:8080 も `bad address` で解決できなかった。
# それでもヘルスチェックは自分の netns の 127.0.0.1:80/nginx-health を叩くだけなので
# healthy を返し続ける(この点は docker-compose.yml のヘルスチェック側で是正した)。
#
# ------------------------------------------------------------------
# なぜ「共存」なのか — IP では分離できない
# ------------------------------------------------------------------
#
# localhost も server.tonoccho.local も、/etc/hosts でどちらも 127.0.0.1 に解決される。
# したがって「infra-proxy は LAN IP、lbs は loopback」のような **IP による分離は成立しない**。
# 分離できる軸は Host ヘッダ / SNI しか無く、それはまさに nginx の vhost が担う役割である。
# ゆえに infra-proxy 側に server_name localhost の vhost を足して共存させる(案A)。
#
# 採らなかった案とその理由は docs/ACCEPTANCE_TESTING.md の
# 「ホストの80/443を他プロセスが占有している場合」に記した。
#
# ------------------------------------------------------------------
# 触るときの注意
# ------------------------------------------------------------------
#
# このファイルを読み込むのは **GitLab を提供している nginx** である。壊すと GitLab が
# 止まり、glab に依存する開発ワークフローごと進行不能になる。
# 変更したら必ず scripts/setup-shared-host-proxy.sh 経由で適用すること
# (docker exec infra-proxy nginx -t を通してからでなければ reload しない)。

# ------------------------------------------------------------------
# localhost : HTTP -> HTTPS リダイレクト
# ------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# localhost : HTTPS 本体
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # lets_blog_server の自己署名証明書(scripts/generate-certs.sh が certs/ に作るもの)を
    # infra 側の certs へ配置して使う。lbs 側 nginx と同じ証明書なので、
    # 受け入れテストの ignoreHTTPSErrors / curl -k の前提が変わらない。
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # lbs 側 reverse-proxy(infra/nginx/conf.d/default.conf)と揃える。
    # 手前が下流より小さいと、画像アップロードが原因不明の 413 になる。
    client_max_body_size 100M;

    # Docker 組み込み DNS。下の proxy_pass を変数経由にするために必須。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # **上流名は必ず変数経由にすること。回帰させてはいけない。**
        #
        # `proxy_pass https://lbs-reverse-proxy:443;` と直接書くと、nginx は上流名を
        # **起動時**に解決する。lets_blog_server スタックを停止している間に infra-proxy を
        # 再起動・reload すると `host not found in upstream` で nginx 自体が起動できず、
        # **GitLab ごと落ちる**。しかも lbs スタックが動いている間は何の症状も出ないので、
        # レビューでは気づけない。
        #
        # 変数を使うと解決がリクエスト時になり(上の resolver がそれを担う)、上流が
        # 居なければそのリクエストが 502 になるだけで済む。infra-proxy と GitLab は生きる。
        set $lbs_upstream https://lbs-reverse-proxy:443;
        proxy_pass $lbs_upstream;

        # lbs 側は自己署名証明書 + server_name localhost。SNI を localhost で送り、
        # 検証は切る(この経路は同一ホスト内の docker ネットワーク上に閉じている)。
        proxy_ssl_verify      off;
        proxy_ssl_server_name on;
        proxy_ssl_name        localhost;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Next.js の HMR と /sites/{id}/edit が WebSocket を使う。
        # $connection_upgrade は infra 側 conf.d/00-common.conf が http コンテキストで
        # 定義済み(00- が先に include されるため、ここから参照できる)。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # NextAuth のセッション Cookie(Keycloak の access/refresh/id トークンを含む)は
        # 実測で約 5.5KB あり、既定の 4k バッファでは "upstream sent too big header" で
        # 502 になる。lbs 側 default.conf が同じ理由で 16k を設定している。
        proxy_buffer_size 16k;
        proxy_buffers   4 16k;

        # ダッシュボードの SSE(/api/dashboard/**/stream)が手前で溜まらないようにする。
        # 併せて長時間の接続を切らない。
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_redirect     off;
    }
}
