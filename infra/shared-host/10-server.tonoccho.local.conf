# server.tonoccho.local: infra-proxy が提供する GitLab 用 vhost(issue #1043)。
#
# **このファイルは本リポジトリでは読み込まれない。**同居している別スタックのリバースプロキシ
# (infra-proxy / /home/seiji/src/infra)の conf.d へ配置して使う。配置・検証・reload は
# scripts/setup-shared-host-proxy.sh が行う(冪等。点検だけなら --check)。
#
# infra 側に置くべき設定をこのリポジトリで管理するのは、妥協ではなく意図である。
# 手で書いた nginx 設定は差分にもレビューにも残らず、壊れたときに誰も経緯を辿れない。
# ここに置けば、変更が版管理とレビューと scripts/test_shared_host_proxy.py の検査を受ける。
#
# ------------------------------------------------------------------
# なぜ必要か
# ------------------------------------------------------------------
#
# 元の /home/seiji/src/infra/proxy/conf.d/10-server.tonoccho.local.conf の /gitlab
# location は上流を `proxy_pass http://gitlab:80;` と直書きしていた。nginx は変数を
# 使わない proxy_pass の宛先を**起動時**に名前解決するため、`infra-gitlab` コンテナが
# 起動していない状態で `infra-proxy` を起動・reload すると
#
#     nginx: [emerg] host not found in upstream "gitlab" in
#     /etc/nginx/conf.d/10-server.tonoccho.local.conf:58
#
# で **nginx 自体が起動できない**。`depends_on: gitlab` は起動順序を保証するだけで、
# GitLab の停止・削除・再作成中の reload や、proxy だけの単独起動を保護しない。
# infra-proxy は GitLab を提供している唯一の入口なので、この失敗は GitLab を含む
# 開発ワークフロー全体(glab)の停止を意味する。
#
# `infra/shared-host/20-localhost.conf`(#1038)で同型の問題を変数 + resolver で
# 解決済みなので、それに揃える(#1043)。
#
# ------------------------------------------------------------------
# 触るときの注意
# ------------------------------------------------------------------
#
# このファイルを読み込むのは **GitLab を提供している nginx** である。壊すと GitLab が
# 止まり、glab に依存する開発ワークフローごと進行不能になる。
# 変更したら必ず scripts/setup-shared-host-proxy.sh 経由で適用すること
# (docker exec infra-proxy nginx -t を通してからでなければ reload しない)。

# ------------------------------------------------------------------
# server.tonoccho.local : HTTP -> HTTPS リダイレクト
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name server.tonoccho.local;

    # コンテナのヘルスチェック用（リダイレクトさせない）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# server.tonoccho.local : HTTPS 本体
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name server.tonoccho.local;

    ssl_certificate     /etc/nginx/certs/server.tonoccho.local.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/server.tonoccho.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # git push / LFS / アーティファクトのため上限なし
    client_max_body_size 0;

    access_log /var/log/nginx/access.log proxy;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Docker 組み込み DNS。下の proxy_pass を変数経由にするために必須(#1043)。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------- GitLab (サブパス /gitlab) ----------------
    # GitLab 側も relative_url_root=/gitlab で動くため、
    # proxy_pass には末尾スラッシュを付けずパスをそのまま渡す。
    location /gitlab {
        # **上流名は必ず変数経由にすること。回帰させてはいけない(#1043)。**
        #
        # `proxy_pass http://gitlab:80;` と直接書くと、nginx は上流名を**起動時**に
        # 解決する。`infra-gitlab` が起動していない状態で `infra-proxy` を起動・reload
        # すると `host not found in upstream` で nginx 自体が起動できず、GitLab ごと
        # 落ちる。しかも GitLab が動いている間は何の症状も出ないので、レビューでは
        # 気づけない。
        #
        # 変数を使うと解決がリクエスト時になり(上の resolver がそれを担う)、上流が
        # 居なければそのリクエストが 502 になるだけで済む。infra-proxy は生きたままになる。
        set $gitlab_upstream http://gitlab:80;
        proxy_pass $gitlab_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl   on;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # git clone / push や CI ジョブのロングポーリングに備える
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_redirect          off;
    }

    # ---------------- ルート: ランディングページ ----------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
