; managed WordPress のアップロード上限(issue #1243)
;
; このイメージは php.ini を1つも持たない(`Loaded Configuration File => (none)`)ため、
; 変更前の実効値は PHP のビルトイン既定値がそのまま露出した状態だった。
; サイトを配信する Apache SAPI(apache2handler)での変更前の実測値:
;
;     upload_max_filesize => 2M    post_max_size => 8M
;     memory_limit => 128M         max_execution_time => 30    max_input_time => -1
;
; (同じ既定値でも CLI SAPI では max_execution_time は 0 になる。SAPI ごとに違うため、
;  エージェント側への影響は下の表で別に示す。)
;
; WP 管理画面の実効上限は min(upload_max_filesize, post_max_size) なので、
; 片方だけ上げても変わらない。5項目をまとめてここで整合させる。
;
; `start.sh` の `php -d upload_max_filesize=500M ...` はポート9000の
; プロビジョニングエージェント(`php -S`)専用で、実際にサイトを配信する
; `apache2-foreground` には効かない。
;
; ■ この ini がエージェント(CLI SAPI)側へ与える影響(受入基準5・実測)
;
; conf.d に置いた ini は CLI SAPI にも読まれるため、エージェント側の実効値も変わりうる。
; 5項目を1つずつ測った(`php -n`= ini 無しの素の既定値、`php -d ...`= start.sh:10 と同じ引数):
;
;   directive             変更前   変更後   理由
;   --------------------  -------  -------  ------------------------------------------
;   upload_max_filesize   500M     500M     start.sh の -d が固定。この ini の 1G は届かない
;   post_max_size         500M     500M     start.sh の -d が固定。この ini の 1025M は届かない
;   memory_limit          128M     512M     -d で固定されておらず、この ini が効く ★唯一の変化
;   max_execution_time    0        0        conf.d の ini は CLI SAPI に届かない(下記)
;   max_input_time        -1       -1       同上
;
; 変化するのは memory_limit の1項目だけで、128M → 512M の**引き上げ**である。
; エージェントが扱うのはプラグイン/テーマ zip(bulk-management/upload)で、上限は -d の
; 500M のまま据え置かれる。使える作業メモリだけが増えるので、退行方向の変化は無い。
;
; max_execution_time / max_input_time は、この ini が 900 を指定していても CLI SAPI では
; 0 / -1 のままだった(実測)。scan された ini の値は CLI に届かない一方、コマンドラインの
; `-d max_execution_time=900` は届く(こちらも実測)。start.sh はこの2項目を -d で渡して
; いないため、エージェントは従来どおり無制限(0)で走る。長時間の wp-cli 実行を
; 打ち切らないという点で、これは維持したい既存の挙動である。

; 受入基準1。WP はこの値を `size_format()` で「1 GB」と表示する。
upload_max_filesize = 1G

; 受入基準4。upload_max_filesize 以上でなければならない。
; 1025M = 1GB のファイル本体 + multipart のフォーム項目(_wpnonce, post_id, action)と
; 境界文字列のための余裕 1MB。前段 nginx の client_max_body_size もこの値に合わせてある
; (infra/nginx/conf.d/default.conf の /sites location、infra/shared-host/20-localhost.conf)。
; 3層を同じ値にすることで、「どの層が先に弾いたか分からない」状態を作らない。
post_max_size = 1025M

; 受入基準4。アップロード本体はメモリに載らない — PHP の multipart ハンドラは
; ファイル部分を逐次テンポラリファイルへ書き出すため、memory_limit が支配するのは
; ファイル以外のフォーム項目と、アップロード後の処理である。
; 実際に効くのは WordPress が画像に対して行うサブサイズ生成(GD/Imagick)で、
; ここは展開後のビットマップをメモリに持つ。1億画素・RGBA でおよそ 400MB。
; 512M はそれを収めたうえで、共有コンテナで複数の Apache ワーカーが同時に走っても
; ホストを圧迫しない範囲に置いた値(1G にはしない)。
memory_limit = 512M

; 受入基準4。1GB の受信とアップロード後処理が1リクエスト内で終わる必要がある。
; Apache 既定の 30 秒では、1GB は受信の途中で打ち切られる。
; 900 秒は約 1.2MB/秒の実効速度でも 1GB を送り切れる budget。
max_execution_time = 900

; max_input_time は -1 のとき max_execution_time を流用する。受信(パース)の予算を
; 後処理の予算と別に持たせたいので明示する。値は同じ 900 秒。
max_input_time = 900
